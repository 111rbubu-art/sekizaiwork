<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>組み立て（墓所の 3D）</title>
<style>
:root{--fg:#1d1d1f;--sub:#6b6b70;--line:#d9d9de;--acc:#2f5d8a;--navy:#1f3b5c;--org:#e07a1f;--bg:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
.top{flex:none;min-height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
.top b{font-size:16px;white-space:nowrap}
.top .nm{background:transparent;border:1px solid #5b7a9c;border-radius:6px;color:#fff;padding:5px 8px;width:220px;font:inherit}
.top .nm::placeholder{color:#a9bcd2}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 11px;font-weight:700;white-space:nowrap}
.btn.g{background:var(--acc);color:#fff;border:1px solid #8fb0d0}
.seg{display:flex;border:1px solid #8fb0d0;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:7px 10px}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.main{flex:1;display:flex;min-height:0}
.left{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px;overflow:auto}
.left h4{margin:10px 0 6px;font-size:12px;color:var(--sub)}
.it{display:flex;align-items:center;width:100%;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fafafa;text-align:left;color:var(--fg)}
.it.on{border-color:var(--org);background:#fff4ea;font-weight:700}
.tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:#e6e8ec;color:#555;font-weight:400}
.c{flex:1;position:relative;min-width:0}
#v{position:absolute;inset:0}
.badge{position:absolute;top:10px;left:10px;border-radius:20px;padding:6px 14px;font-weight:700;max-width:calc(100% - 20px)}
.badge.ok{background:#dff3e4;color:#1d7a3a;border:1px solid #9fd3ae}
.badge.ng{background:#fde8e8;color:#b42020;border:1px solid #f2a7a7;cursor:pointer}
.hitlist{position:absolute;top:46px;left:10px;background:#fff;border:1px solid #f2a7a7;border-radius:10px;padding:8px 12px;line-height:1.7;display:none;max-width:calc(100% - 20px);max-height:40%;overflow:auto}
.site{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center}
.site b{grid-column:1/-1}
.chip{width:72px;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;font:inherit;font-weight:700;color:var(--navy);text-align:right;background:#fff}
.chip.l{border-color:#8fb0d0}
.chip:focus{outline:none;border-color:var(--org);background:#fff4ea}
.right{width:320px;flex:none;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}
.right h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f2}
.row .k{color:var(--sub)}
.muted{color:var(--sub);font-size:11px;line-height:1.5}
.box{margin-top:12px;background:#f5f7fa;border-radius:10px;padding:10px}
.box .row{border-color:#e3e6ea}
.tot{font-size:17px;font-weight:700;color:var(--navy)}
.lk{color:var(--acc);font-weight:700;background:none;border:0;padding:0}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;max-width:170px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #0002}
.plist .row{cursor:pointer}
.plist .row.on{background:#fff4ea}
.plist .row.hit .k{color:#b42020}
.err{color:#b42020}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%}
  .main{flex-direction:column}
  .left{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .left > div{min-width:150px}
  .left h4{margin:2px 0 4px}
  .left .hint,.left > div:first-child{display:none}
  .c{height:62vh;flex:none}
  .right{width:auto;border-left:0}
  .top .nm{width:150px}
  .site{grid-template-columns:auto auto}
}
</style>
</head>
<body>
<div class="top">
  <b>🏯 組み立て</b>
  <input class="nm" id="nm" placeholder="名前（例：和型8寸 案1）">
  <span class="sp"></span>
  <div class="seg" id="seg"><button data-v="3d" class="on">3D</button><button data-v="front">正面</button><button data-v="top">平面</button></div>
  <button class="btn g" id="bPng">🖼 画像</button>
  <button class="btn g" id="bOpen">📂 開く</button>
  <button class="btn" id="bSave">💾 保存</button>
</div>
<div class="main">
  <div class="left" id="left"></div>
  <div class="c">
    <div id="v"></div>
    <div class="badge ok" id="badge">✓ 干渉 なし</div>
    <div class="hitlist" id="hitlist"></div>
    <div class="site">
      <b>敷地</b>
      <span>間口</span><input class="chip" id="sW" type="number" inputmode="numeric">
      <span>奥行</span><input class="chip" id="sD" type="number" inputmode="numeric">
      <span>土留め 高さ</span><input class="chip l" id="sH" type="number" inputmode="numeric">
      <span>厚み</span><input class="chip l" id="sT" type="number" inputmode="numeric">
      <span>石塔 奥行調整</span><input class="chip l" id="sA" type="number" inputmode="numeric">
    </div>
  </div>
  <div class="right">
    <div id="selBox"></div>
    <div class="box" id="estBox"></div>
    <div class="box"><details><summary>部材の 一覧（才数）</summary><div class="plist" id="plist"></div></details></div>
    <div class="muted" style="margin-top:10px" id="ver"></div>
  </div>
</div>
<input type="file" id="fOpen" accept=".json,application/json" hidden>
<input type="file" id="fPart" accept=".json,application/json" hidden>
<input type="file" id="fTanka" accept=".json,application/json" hidden>
<script src="buzai-engine.js?v=0.7.0"></script>
<script src="kumitate-data.js"></script>
<script src="kumitate-engine.js"></script>
<script>
var APP_VER = 'v0.2';
// 部材の データ：見本（kumitate-data.js）か、読んだ 旧シミュレーターの 保存ファイル
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var DATA = lsGet('kumitate.data') || window.KUMITATE_DATA;
var TANKA = lsGet('kumitate.tanka');   // { stones:[], estimate:{} }（公開の 場所に 置かない ため ファイルから 読む）
var ST = lsGet('kumitate.state');
if (!ST || ST.schema !== 'kumitate/1') ST = KM.newState(DATA);
ST.shapes = ST.shapes || {};
var SEL = null, RES = null, V3 = null;
var KLABEL = { tower:'石塔', fence:'外柵', boshi:'墓誌', toba:'塔婆立', crypt:'納骨室' };
var GRAY = { tower:'#4a4d52', fence:'#9aa0a6', boshi:'#5a5d62', crypt:'#b8b2a6' };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function yen(n){ return '¥ ' + Math.round(n).toLocaleString(); }
function f2(n){ return (Math.round(n * 100) / 100).toFixed(2); }

function stoneOf(g){ if (!TANKA || !TANKA.stones || !TANKA.stones.length) return null; return TANKA.stones.filter(function(s){ return s.id === ST.stone[g]; })[0] || TANKA.stones[0]; }
function groupOf(p){ return p.kind === 'boshi' ? 'boshi' : (p.kind === 'crypt' || p.cg === 'crypt') ? 'crypt' : p.cg === 'tower' ? 'tower' : 'fence'; }
function colorOf(k){ var p = RES.parts[k], g = groupOf(p); if (g === 'crypt') return GRAY.crypt; var s = stoneOf(g); return s && s.hex ? s.hex : GRAY[g]; }

function renderLeft(){
  var h = '<div style="font-weight:700">部材を 置く</div>';
  KM.KINDS.forEach(function(K){
    var vs = KM.variants(DATA, K.k), keys = Object.keys(vs);
    h += '<div><h4>' + KLABEL[K.k] + '</h4>';
    if (K.k === 'crypt') h += '<button class="it' + (!ST.sel.crypt ? ' on' : '') + '" data-k="crypt" data-v="">なし</button>';
    keys.forEach(function(vk){
      var n = Object.keys(vs[vk].parts || {}).length;
      h += '<button class="it' + (ST.sel[K.k] === vk ? ' on' : '') + '" data-k="' + K.k + '" data-v="' + esc(vk) + '">' + esc(vs[vk].label || vk) + (n ? '<span class="tag">箱 ' + n + '</span>' : '') + '</button>';
    });
    h += '</div>';
  });
  h += '<div><h4>形の ある 部材</h4>';
  partChoices().forEach(function(c, i){
    var on = Object.keys(ST.shapes).some(function(k){ return RES && RES.boxes[k] && ST.shapes[k].id === c.def.id && ST.shapes[k].__from === c.from; });
    h += '<button class="it' + (on ? ' on' : '') + '" data-part="' + i + '">🏺 ' + esc(c.def.name || c.def.id) + '<span class="tag" style="background:#dff3e4;color:#1d7a3a">' + esc(c.tag) + '</span></button>';
  });
  h += '<button class="it" id="bPartFile">📂 部材を 読む（.json）</button></div>';
  h += '<div class="muted hint" style="margin-top:10px">「箱」＝旧シミュレーターの 寸法を 箱で 取り込んだ もの。「形の ある 部材」を 押すと、同じ 名前の 石（香炉 なら 香炉）が その 形に なる。石を 選んで から 押すと その 石に 入る</div>';
  $('left').innerHTML = h;
}
// 形の ある 部材の 候補：見本（香炉 1 号）／図面アプリで いま 作って いる 部材（同じ サイトの localStorage）／読んだ ファイル
var LOADED = lsGet('kumitate.parts') || [];
function partChoices(){
  var out = [{ def:BZ_KORO, from:'mihon', tag:'見本' }], z = lsGet('zumen.part');
  if (z && z.schema === 'buzai/1') out.unshift({ def:z, from:'zumen', tag:'図面アプリ' });
  LOADED.forEach(function(d){ out.push({ def:d, from:'file', tag:'読んだ' }); });
  return out;
}
function targetFor(def){
  if (SEL) return SEL;
  var cat = def.category || '', ks = Object.keys(RES.boxes).filter(function(k){ var n = RES.parts[k].name || ''; return cat && n.indexOf(cat) >= 0; });
  return ks[0] || null;
}
function placePart(c){
  var k = targetFor(c.def);
  if (!k) { alert('「' + (c.def.category || c.def.name) + '」の 石が ありません。3D で 入れたい 石を 押して から もう一度 押して ください'); return; }
  var d = JSON.parse(JSON.stringify(c.def)); d.__from = c.from;
  ST.shapes[k] = d; delete ST.over[k]; SEL = k; renderLeft(); run();
}
$('fPart').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    if (j.schema !== 'buzai/1') { alert('部材の ファイル（buzai/1）では ありません'); return; }
    LOADED = LOADED.filter(function(d){ return d.id !== j.id; }); LOADED.push(j); lsSet('kumitate.parts', LOADED);
    placePart({ def:j, from:'file' });
  });
};
$('left').addEventListener('click', function(e){
  if (e.target.closest('#bPartFile')) { $('fPart').click(); return; }
  var pb = e.target.closest('[data-part]'); if (pb) { placePart(partChoices()[+pb.dataset.part]); return; }
  var b = e.target.closest('.it'); if (!b) return;
  ST.sel[b.dataset.k] = b.dataset.v; SEL = null; renderLeft(); run(true);
});

function siteIn(){
  [['sW', 'W'], ['sD', 'D'], ['sH', 'domeH'], ['sT', 'domeT'], ['sA', 'adj']].forEach(function(a){
    var el = $(a[0]); el.value = ST.site[a[1]];
    el.oninput = function(){ var v = parseFloat(el.value); if (isFinite(v)) { ST.site[a[1]] = v; run(); } };
  });
}

function run(refit){
  RES = KM.compute(DATA, ST);
  if (SEL && !RES.boxes[SEL]) SEL = null;
  if (V3) V3.update(RES, colorOf, SEL, ST.site, refit);
  var b = $('badge');
  if (RES.hits.length) {
    b.className = 'badge ng'; b.textContent = '⚠ 干渉 ' + RES.hits.length + ' か所（押すと 一覧）';
    $('hitlist').innerHTML = RES.hits.map(function(x){ return esc(x.nameA) + ' ↔ ' + esc(x.nameB) + '　<span class="muted">横 ' + x.ox + '・高さ ' + x.oy + '・奥行 ' + x.oz + ' mm 重なる</span>'; }).join('<br>');
  } else { b.className = 'badge ok'; b.textContent = '✓ 干渉 なし'; $('hitlist').style.display = 'none'; }
  renderSel(); renderEst(); renderList();
  lsSet('kumitate.state', ST);
}
$('badge').onclick = function(){ if (RES.hits.length) { var h = $('hitlist'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; } };

function stoneSelect(g){
  if (!TANKA || !TANKA.stones) return '<span class="muted">単価を 読むと 選べます</span>';
  var cur = stoneOf(g);
  return '<span class="sw" style="background:' + esc(cur && cur.hex || '#888') + '"></span><select data-g="' + g + '">' +
    TANKA.stones.map(function(s){ return '<option value="' + esc(s.id) + '"' + (cur && cur.id === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') + '</select>';
}
function renderSel(){
  var h = '';
  if (SEL) {
    var p = RES.parts[SEL], g = groupOf(p), ov = ST.over[SEL] || {};
    h += '<h3>選んだ 部材：' + esc(p.name) + '</h3>';
    h += '<div class="row"><span class="k">幅 × 奥行 × 高さ</span><span>' +
      ['w', 'd', 'h'].map(function(f){ return '<input class="chip' + (ov[f] ? '' : ' l') + '" style="width:56px" data-f="' + f + '" type="number" inputmode="numeric" value="' + p[f] + '">'; }).join(' ') + '</span></div>';
    h += '<div class="row"><span class="k">才数</span><span id="selSai">' + f2(KM.sai(p.w, p.d, p.h)) + ' 才</span></div>';
    h += '<div class="row"><span class="k">石種（' + ({ tower:'石塔', fence:'外柵', boshi:'墓誌', crypt:'納骨室' })[g] + '）</span><span>' + (g === 'crypt' ? '<span class="muted">見積に 入れない</span>' : stoneSelect(g)) + '</span></div>';
    if (Object.keys(ov).length) h += '<div class="row"><span class="muted">濃い 枠＝手で 変えた 寸法</span><button class="lk" id="bReset">元に 戻す</button></div>';
    var sh = ST.shapes[SEL];
    if (sh) {
      var pr = (sh.estimate && sh.estimate.processes || []).map(function(x){ return esc(x.name) + (x.qty > 1 ? '×' + x.qty : ''); }).join('・');
      var pt = (sh.estimate && sh.estimate.parts || []).map(function(x){ return esc(x.name); }).join('・');
      h += '<div class="row"><span class="k">形</span><span>🏺 ' + esc(sh.name) + '</span></div>';
      if (pr || pt) h += '<div class="row"><span class="k">加工・既製品</span><span style="text-align:right">' + pr + (pt ? '<br>' + pt : '') + '</span></div>';
      h += '<div class="row"><button class="lk" id="bZumen">🧊 図面アプリで 形を 直す</button><button class="lk" id="bUnshape">箱に 戻す</button></div>';
      h += '<div class="muted">幅・奥行・高さを 変えると、部材の 中の 寸法（筆返し・穴 など）は 部材の 式で ついてくる</div>';
    } else if (partChoices().some(function(c){ return c.def.category && (p.name || '').indexOf(c.def.category) >= 0; })) {
      h += '<div class="muted" style="margin-top:4px">左の「形の ある 部材」を 押すと、この 石を その 形に できます</div>';
    }
    h += '<div class="muted" style="margin-top:6px">数字を 変えると、上に のる 石・つながる 石も ついてくる。手で 変えた 寸法は ノウハウ式より 優先</div>';
  } else {
    h += '<h3>石種</h3>';
    ['tower', 'fence', 'boshi'].forEach(function(g){ h += '<div class="row"><span class="k">' + ({ tower:'石塔', fence:'外柵', boshi:'墓誌' })[g] + '</span><span>' + stoneSelect(g) + '</span></div>'; });
    h += '<div class="muted" style="margin-top:6px">3D の 石を 押すと、その 部材の 寸法を 直せます</div>';
  }
  $('selBox').innerHTML = h;
}
$('selBox').addEventListener('change', function(e){
  var t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.g) { ST.stone[t.dataset.g] = t.value; run(); }
});
$('selBox').addEventListener('input', function(e){
  var t = e.target; if (!t.dataset.f || !SEL) return;
  var v = parseFloat(t.value); if (!(v > 0)) return;
  var sh = ST.shapes[SEL];
  if (sh) { var id = { w:'W', d:'D', h:'H' }[t.dataset.f]; if (sh.params[id]) sh.params[id].value = v; }
  else { ST.over[SEL] = ST.over[SEL] || {}; ST.over[SEL][t.dataset.f] = v; }
  RES = KM.compute(DATA, ST); if (V3) V3.update(RES, colorOf, SEL, ST.site); renderEst();
  var q = RES.parts[SEL]; if (q && $('selSai')) $('selSai').textContent = f2(KM.sai(q.w, q.d, q.h)) + ' 才'; renderList(); lsSet('kumitate.state', ST);
});
$('selBox').addEventListener('click', function(e){
  if (e.target.id === 'bReset') { delete ST.over[SEL]; run(); }
  if (e.target.id === 'bUnshape') { delete ST.shapes[SEL]; renderLeft(); run(); }
  if (e.target.id === 'bZumen') { // 図面アプリの 部材設計は いまの 部材（zumen.part）を 開く
    var d = JSON.parse(JSON.stringify(ST.shapes[SEL])); delete d.__from; lsSet('zumen.part', d);
    alert('図面アプリを 開きます。上の［🧊 部材設計］を 押すと この 形が 出ます。直したら 組み立てを 開き直し、左の「図面アプリ」の 部材を 押して ください');
    window.open('zumen.html', 'zumen');
  }
});

function renderEst(){
  var E = KM.estimate(RES, ST, TANKA), s = E.sai, h = '<div style="font-weight:700;margin-bottom:4px">才数と 見積（その場で 変わる）</div>';
  h += '<div class="row"><span class="k">才数</span><span>石塔 ' + f2(s.tower) + '・外柵 ' + f2(s.fence) + (s.boshi ? '・墓誌 ' + f2(s.boshi) : '') + ' 才</span></div>';
  if (!E.ok) {
    h += '<div class="muted" style="margin:6px 0">単価が まだ 入って いません。旧シミュレーターの 保存ファイル（gravestone-project.json）か 単価ファイルを 読むと 金額が 出ます</div><button class="btn g" id="bTanka">💰 単価を 読む</button>';
  } else {
    var t = E.tower;
    h += '<details><summary class="row" style="display:flex"><span>石塔 小計</span><span>' + yen(t.subtotal) + '</span></summary>' +
      '<div class="row"><span class="k">石材費（' + f2(s.tower) + '才 × ' + yen(t.stU) + '）</span><span>' + yen(t.stone) + '</span></div>' +
      '<div class="row"><span class="k">金具</span><span>' + yen(t.kin) + '</span></div><div class="row"><span class="k">運搬</span><span>' + yen(t.hakobi) + '</span></div>' +
      '<div class="row"><span class="k">設計</span><span>' + yen(t.sekkei) + '</span></div><div class="row"><span class="k">据付</span><span>' + yen(t.suitsuke) + '</span></div></details>';
    if (E.fence) { var f = E.fence;
      h += '<details><summary class="row" style="display:flex"><span>外柵 小計</span><span>' + yen(f.subtotal) + '</span></summary>' +
        '<div class="row"><span class="k">石材費（' + f2(s.fence) + '才 × ' + yen(f.stU) + '）</span><span>' + yen(f.stone) + '</span></div>' +
        '<div class="row"><span class="k">金具</span><span>' + yen(f.kin) + '</span></div><div class="row"><span class="k">据付</span><span>' + yen(f.suitsuke) + '</span></div>' +
        '<div class="row"><span class="k">残土処分</span><span>' + yen(f.zando) + '</span></div></details>'; }
    if (E.boshi) h += '<div class="row"><span>墓誌（石材）</span><span>' + yen(E.boshi.subtotal) + '</span></div>';
    h += '<div class="row"><span>合計（税別）</span><span class="tot">' + yen(E.total) + '</span></div>';
    h += '<div class="muted">彫刻・耐震・コーティングは まだ 入れて いません。<button class="lk" id="bTanka">単価を 読み直す</button></div>';
  }
  if (RES.errs.length) h += '<div class="err muted" style="margin-top:6px">読めない 式：' + RES.errs.slice(0, 3).map(function(x){ return esc(x.expr) + '（' + esc(x.msg) + '）'; }).join('、') + '</div>';
  $('estBox').innerHTML = h;
}
$('estBox').addEventListener('click', function(e){ if (e.target.id === 'bTanka') $('fTanka').click(); });

function renderList(){
  var hit = {}; RES.hits.forEach(function(x){ hit[x.a] = hit[x.b] = 1; });
  $('plist').innerHTML = Object.keys(RES.boxes).map(function(k){ var p = RES.parts[k];
    return '<div class="row' + (k === SEL ? ' on' : '') + (hit[k] ? ' hit' : '') + '" data-k="' + esc(k) + '"><span class="k">' + esc(p.name) + '</span><span>' + p.w + '×' + p.d + '×' + p.h + '　' + f2(KM.sai(p.w, p.d, p.h)) + '</span></div>'; }).join('');
}
$('plist').addEventListener('click', function(e){ var r = e.target.closest('.row'); if (r) { SEL = r.dataset.k === SEL ? null : r.dataset.k; run(); } });

// 単価・旧シミュレーターの 保存ファイルを 読む
function readJson(file, cb){ var fr = new FileReader(); fr.onload = function(){ try { cb(JSON.parse(fr.result)); } catch (e) { alert('読めませんでした：' + e.message); } }; fr.readAsText(file); }
$('fTanka').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    var stones = j.stones || j.stoneMaster, est = j.estimate || j.estimateSettings;
    if (!stones || !est) { alert('単価（石材と 見積の 設定）が 入って いない ファイルです'); return; }
    TANKA = { stones:stones, estimate:est }; lsSet('kumitate.tanka', TANKA);
    if (j.partsData && j.knowhow && confirm('このファイルには 部材・ノウハウ式・基準点も 入って います。組み立ての 部材も この ファイルの ものに しますか？')) {
      DATA = { partsData:j.partsData, knowhow:j.knowhow, anchors:j.anchors || {} }; lsSet('kumitate.data', DATA); renderLeft();
    }
    run();
  });
};
// 保存・開く（kumitate/1）
$('nm').value = ST.name || '';
$('nm').oninput = function(){ ST.name = this.value; lsSet('kumitate.state', ST); };
$('bSave').onclick = function(){
  var txt = JSON.stringify(ST, null, 1), d = new Date(), ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'application/json' }));
  a.download = 'kumitate_' + (ST.name ? ST.name.replace(/[\\/:*?"<>|\s]+/g, '_') + '_' : '') + ds + '.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
};
$('bOpen').onclick = function(){ $('fOpen').click(); };
$('fOpen').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    if (j.schema === 'kumitate/1') { ST = j; ST.over = ST.over || {}; ST.shapes = ST.shapes || {}; ST.stone = ST.stone || {}; $('nm').value = ST.name || ''; SEL = null; renderLeft(); siteIn(); run(true); return; }
    if (j.partsData || j.stoneMaster) { var dt = new DataTransfer(); dt.items.add(f); $('fTanka').files = dt.files; $('fTanka').onchange(); return; }
    alert('組み立ての ファイル（kumitate_….json）では ありません');
  });
};
$('bPng').onclick = function(){ if (!V3) return; var a = document.createElement('a'); a.href = V3.png(); a.download = 'kumitate_' + (ST.name || '3d') + '.png'; a.click(); };
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !V3) return;
  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); }); V3.fit(b.dataset.v);
});
$('ver').textContent = '組み立て ' + APP_VER + '（部材は ' + (DATA === window.KUMITATE_DATA ? '見本' : '読んだ ファイル') + '）';

RES = KM.compute(DATA, ST); renderLeft(); siteIn(); run();
import('./kumitate-3d.js?v=0.6.8').then(function(m){
  V3 = m.create($('v'), function(k){ SEL = k === SEL ? null : k; run(); });
  V3.update(RES, colorOf, SEL, ST.site);
  window.__ready = true;
}).catch(function(e){ $('v').innerHTML = '<div class="muted" style="padding:20px">3D を 開けませんでした：' + esc(e.message) + '</div>'; window.__ready = true; });
</script>
</body>
</html>
