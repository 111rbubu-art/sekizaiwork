<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤怠 — 会社の休日</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root{
  --ground:#ECEDEA;--panel:#F8F9F7;--panel2:#E3E5E1;--ink:#191D1E;--ink2:#4A5251;--stone:#6B7371;
  --hair:#C9CDC8;--hair2:#DCDFDA;--accent:#2F5645;--accent-soft:#DFE9E3;--accent-txt:#2F5645;
  --signal:#A63D2C;--signal-soft:#F6E4E0;--amber:#8A6716;--amber-soft:#F3EBD8;
  --font:"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#131716;--panel:#1C2120;--panel2:#252B29;--ink:#E4E9E6;--ink2:#B2B9B6;--stone:#8B9390;
  --hair:#333B39;--hair2:#262D2B;--accent:#6FA189;--accent-soft:#21302A;--accent-txt:#8FBFA7;
  --signal:#D5806D;--signal-soft:#32211E;--amber:#C6A15C;--amber-soft:#2C2718;color-scheme:dark;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:46rem;margin:0 auto;padding:2rem 1rem 6rem}
h1{font-size:1.35rem;letter-spacing:.08em}
.sub{color:var(--stone);font-size:.86rem;margin-bottom:1.4rem}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:1rem 1.1rem;margin:.9rem 0}
.card h2{font-size:.8rem;letter-spacing:.1em;color:var(--stone);font-weight:700;margin-bottom:.7rem}
button{font-family:inherit;font-size:.92rem;cursor:pointer;background:var(--accent);
       color:var(--ground);border:none;border-radius:6px;padding:.6rem 1.1rem;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink2);font-weight:400}
button.danger{background:transparent;border:1px solid var(--signal);color:var(--signal);font-weight:400}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
label.f{display:block;font-size:.78rem;color:var(--stone);margin:.5rem 0 .2rem}
input,select{font-family:inherit;font-size:.95rem;padding:.45rem .55rem;background:var(--ground);
  color:var(--ink);border:1px solid var(--hair);border-radius:5px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 9rem;min-width:8rem}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem;align-items:center}
.yr{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.yr .y{flex:1;text-align:center;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:.6rem -1.1rem 0;padding:0 1.1rem}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:.35rem .45rem;text-align:left;white-space:nowrap}
th{font-size:.7rem;letter-spacing:.05em;color:var(--stone);border-bottom:1px solid var(--hair)}
tbody tr+tr td{border-top:1px solid var(--hair2)}
tr.sun td{color:var(--signal)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:.02rem .4rem;border-radius:3px}
.badge.ok{background:var(--accent-soft);color:var(--accent-txt)}
.badge.cau{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--signal-soft);color:var(--signal)}
.del{background:transparent;border:1px solid var(--hair);color:var(--stone);
  font-size:.72rem;font-weight:400;padding:.1rem .45rem;border-radius:3px}
.del:hover{border-color:var(--signal);color:var(--signal)}
.msg{border-radius:5px;padding:.6rem .75rem;margin-top:.6rem;font-size:.87rem}
.msg.bad{background:var(--signal-soft);color:var(--signal)}
.msg.warn{background:var(--amber-soft);color:var(--amber)}
.msg.good{background:var(--accent-soft);color:var(--accent-txt)}
.nav{margin-bottom:1rem}
.back{display:inline-block;border:1px solid var(--hair);border-radius:6px;padding:.45rem .9rem;
  font-size:.88rem;color:var(--ink2);text-decoration:none;background:var(--panel)}
.back:hover{border-color:var(--accent);color:var(--accent-txt)}
.foot{color:var(--stone);font-size:.78rem;margin-top:2rem}
a{color:var(--accent-txt)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a class="back" href="./">← 勤怠にもどる</a></div>
  <h1>会社の休日</h1>
  <p class="sub">年末年始や夏季休暇など、土日・毎月14日15日のほかに休みにする日を登録します。管理者専用です。</p>
  <div id="gate"><button id="go">Microsoft 365 でログイン</button></div>
  <div id="main" class="hide"></div>
  <p class="foot">打刻画面は <a href="./">こちら</a> ／ 過去の勤怠の入力は <a href="./import.html">こちら</a>。</p>
</div>

<script src="./config.js"></script>
<script src="./util.js"></script>
<script src="./auth.js"></script>
<script src="./graph.js"></script>
<script src="./attendance.js"></script>
<script>
var HL = { list: [], year: +ktToday().slice(0, 4), busy: false, result: null, preview: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return ktEsc(s); }


/* ── 起動 ────────────────────────────────────────────────── */

document.getElementById('go').onclick = function(){ ktLogin(); };

ktInitAuth(start, function(){}, function(e){
  $('gate').innerHTML = '<div class="msg bad">ログインエラー：' + esc(e.message) + '</div>';
});

function start(){
  $('gate').innerHTML = '<p class="sub">読み込んでいます…</p>';
  ktList('employees').then(function(emps){
    var me = ktUserName();
    var mine = emps.filter(function(e){
      return String(e.UserPrincipalName || '').toLowerCase() === me;
    })[0];
    if (!mine || mine.IsAdmin !== true){
      $('gate').innerHTML = '<div class="msg bad"><b>この画面は管理者のみ使えます。</b><br>' +
        'ログイン中のアカウント：<code>' + esc(me) + '</code></div>';
      return;
    }
    $('gate').classList.add('hide');
    $('main').classList.remove('hide');
    load();
  }).catch(function(e){
    $('gate').innerHTML = '<div class="msg bad">読み込みに失敗しました：' + esc(e.message) + '</div>';
  });
}

function load(){
  render(true);
  ktList('holidays').then(function(rows){
    HL.list = rows.filter(function(r){ return /^\d{4}-\d{2}-\d{2}$/.test(r.HolidayDate || ''); })
                  .sort(function(a, b){ return ktYmdDiffDays(a.HolidayDate, b.HolidayDate); });
    render(false);
  }).catch(function(e){
    HL.list = []; render(false);
    HL.result = { cls:'bad', html:'休日の読み込みに失敗しました：' + esc(e.message) };
  });
}

/* ── 画面 ────────────────────────────────────────────────── */

var TYPES = ['所定休日', '法定休日', '平日'];

function render(loading){
  var h = '';

  h += '<div class="card"><h2>期間で登録する</h2>';
  h += '<label class="f" for="nm">名称</label><input id="nm" placeholder="例：年末年始" value="' +
       esc(HL.nm || '') + '">';
  h += '<div class="row" style="margin-top:.5rem">' +
    '<div><label class="f" for="d1">開始日</label><input type="date" id="d1" value="' + esc(HL.d1 || '') + '"></div>' +
    '<div><label class="f" for="d2">終了日</label><input type="date" id="d2" value="' + esc(HL.d2 || '') + '"></div>' +
    '<div><label class="f" for="tp">種別</label><select id="tp">' +
      TYPES.map(function(t){
        return '<option' + ((HL.tp || '所定休日') === t ? ' selected' : '') + '>' + t + '</option>';
      }).join('') + '</select></div></div>';
  h += '<div class="btnrow"><button id="add">この期間を休みにする</button>' +
       '<button class="ghost" id="clr">入力を消す</button></div>';
  h += '<div id="prev"></div>';
  h += '<p class="sub" style="margin:.7rem 0 0">' +
       '<b>所定休日</b>＝会社の休み（出勤すると週40時間を超えた分だけ割増25%）。<br>' +
       '<b>法定休日</b>＝労基法上の休み（出勤すると割増35%）。日曜は自動で法定休日です。<br>' +
       '<b>平日</b>＝休日を出勤日に変えるとき（振替出勤日）に使います。</p>';
  h += '</div>';

  var y = HL.year;

  // 登録済み
  h += '<div class="card"><h2>登録済みの休日</h2>';
  h += '<div class="yr"><button class="ghost" id="y-prev">前年</button>' +
       '<span class="y">' + y + '年</span>' +
       '<button class="ghost" id="y-next">翌年</button></div>';
  h += '<div id="note">' + (HL.result ? '<div class="msg ' + HL.result.cls + '">' +
                                        HL.result.html + '</div>' : '') + '</div>';

  if (loading){
    h += '<p class="sub">読み込んでいます…</p></div>';
    $('main').innerHTML = h;
    bind();
    return;
  }

  var rows = HL.list.filter(function(r){ return r.HolidayDate.slice(0, 4) === String(y); });
  h += '<div class="tw"><table><thead><tr><th>日付</th><th>名称</th><th>種別</th><th></th></tr></thead><tbody>';
  if (!rows.length){
    h += '<tr><td colspan="4" class="sub">' + y + '年の登録はありません。' +
         '土日と毎月14日15日は登録しなくても自動で休みになります。</td></tr>';
  }
  rows.forEach(function(r){
    var t = r.HolidayType || '所定休日';
    var cls = t === '法定休日' ? 'no' : t === '平日' ? 'cau' : 'ok';
    h += '<tr' + (ktYmdWeekday(r.HolidayDate) === 0 ? ' class="sun"' : '') + '>';
    h += '<td>' + esc(r.HolidayDate) + '（' + KT_WD[ktYmdWeekday(r.HolidayDate)] + '）</td>';
    h += '<td>' + esc(r.Title || '') + '</td>';
    h += '<td><span class="badge ' + cls + '">' + esc(t) + '</span></td>';
    h += '<td><button class="del" data-del="' + esc(r._id) + '">削除</button></td></tr>';
  });
  h += '</tbody></table></div>';
  if (rows.length > 1){
    h += '<div class="btnrow"><button class="danger" id="del-year">' + y + '年をすべて削除</button></div>';
  }
  h += '</div>';

  $('main').innerHTML = h;
  bind();
}

function bind(){
  ['nm','d1','d2','tp'].forEach(function(id){
    if ($(id)) $(id).oninput = $(id).onchange = function(){ HL[id] = this.value; };
  });
  if ($('add')) $('add').onclick = addRange;
  if ($('clr')) $('clr').onclick = function(){
    HL.nm = HL.d1 = HL.d2 = ''; HL.preview = null; render(false);
  };
  if ($('y-prev')) $('y-prev').onclick = function(){ HL.year--; HL.result = null; render(false); };
  if ($('y-next')) $('y-next').onclick = function(){ HL.year++; HL.result = null; render(false); };
  if ($('del-year')) $('del-year').onclick = delYear;

  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = function(){ delOne(b.dataset.del); };
  });
}


/* 期間内の日付を並べる。既に登録済みの日と、法定休日を下げてしまう日は除く。 */
function expandRange(from, to, type){
  var add = [], skipDup = [], skipLegal = [];
  var have = {};
  HL.list.forEach(function(r){ have[r.HolidayDate] = r; });

  for (var d = from, i = 0; i < 400 && ktYmdDiffDays(d, to) <= 0; d = ktYmdAddDays(d, 1), i++){
    if (have[d]) { skipDup.push(d); continue; }
    // 所定休日を日曜に重ねると、法定休日（割増35%）が所定休日に下がってしまう
    if (type === '所定休日' && ktYmdWeekday(d) === KT_HOLIDAY.legalWeekday){
      skipLegal.push(d); continue;
    }
    add.push(d);
  }
  return { add: add, skipDup: skipDup, skipLegal: skipLegal };
}

function addRange(){
  var nm = ($('nm').value || '').trim();
  var d1 = $('d1').value, d2 = $('d2').value, tp = $('tp').value;
  if (!nm){ note('bad', '名称を入れてください（例：年末年始）。'); return; }
  if (!d1 || !d2){ note('bad', '開始日と終了日を選んでください。'); return; }
  if (ktYmdDiffDays(d2, d1) < 0){ note('bad', '終了日が開始日より前になっています。'); return; }

  var r = expandRange(d1, d2, tp);
  if (!r.add.length){
    note('warn', '登録する日がありません。' +
      (r.skipDup.length ? r.skipDup.length + '日は既に登録済みです。' : '') +
      (r.skipLegal.length ? r.skipLegal.length + '日は日曜（法定休日）のため飛ばしました。' : ''));
    return;
  }

  var msg = nm + '（' + tp + '）として ' + r.add.length + '日を登録します。\n\n' +
            r.add.map(function(d){ return d + '（' + KT_WD[ktYmdWeekday(d)] + '）'; }).join('\n');
  if (r.skipLegal.length){
    msg += '\n\n※ 次の日は日曜で既に法定休日（割増35%）のため飛ばします。' +
           '所定休日として登録すると割増が25%に下がってしまうためです。\n' +
           r.skipLegal.join('、');
  }
  if (r.skipDup.length) msg += '\n\n※ 登録済みのため飛ばす日：' + r.skipDup.join('、');
  if (!window.confirm(msg)) return;

  save(r.add.map(function(d){
    return { Title: nm, HolidayDate: d, HolidayType: tp };
  }), function(){
    HL.nm = HL.d1 = HL.d2 = '';
    HL.year = +r.add[0].slice(0, 4);
  });
}



/* ── 保存と削除 ──────────────────────────────────────────── */

function save(items, after){
  if (HL.busy) return;
  HL.busy = true;
  ['add','del-year'].forEach(function(id){ if ($(id)) $(id).disabled = true; });
  note('warn', '登録しています… 0 / ' + items.length + ' 件');
  var done = 0, errMsgs = [];
  items.reduce(function(chain, f){
    return chain.then(function(){
      return ktCreate('holidays', f)
        .catch(function(e){ errMsgs.push(f.HolidayDate + '：' + e.message); })
        .then(function(){ done++; note('warn', '登録しています… ' + done + ' / ' + items.length + ' 件'); });
    });
  }, Promise.resolve()).then(function(){
    HL.busy = false;
    if (after) after();
    HL.result = errMsgs.length
      ? { cls:'bad', html:'<b>' + (items.length - errMsgs.length) + '日を登録しました。' +
          errMsgs.length + '日は登録できませんでした。</b><br>' +
          esc(errMsgs.slice(0, 3).join(' ／ ')) +
          (errMsgs.length > 3 ? ' ほか' + (errMsgs.length - 3) + '件' : '') }
      : { cls:'good', html:items.length + '日を登録しました。' };
    load();
  });
}

function delOne(id){
  var r = HL.list.filter(function(x){ return x._id === id; })[0];
  if (!r) return;
  if (!window.confirm(r.HolidayDate + '（' + esc(r.Title || '') + '）を削除します。よろしいですか？')) return;
  var btn = document.querySelector('[data-del="' + id + '"]');
  if (btn) { btn.disabled = true; btn.textContent = '削除中'; }
  ktDelete('holidays', id).then(function(){
    HL.result = { cls:'good', html:r.HolidayDate + ' を削除しました。' };
    load();
  }).catch(function(e){
    HL.result = { cls:'bad', html:r.HolidayDate + ' を削除できませんでした：' + esc(e.message) };
    load();
  });
}

function delYear(){
  if (HL.busy) return;
  var rows = HL.list.filter(function(r){ return r.HolidayDate.slice(0, 4) === String(HL.year); });
  if (!rows.length) return;
  if (!window.confirm(HL.year + '年の登録 ' + rows.length + '件をすべて削除します。よろしいですか？')) return;

  HL.busy = true;
  var btn = $('del-year');
  if (btn) { btn.disabled = true; btn.textContent = '削除しています…'; }

  var done = 0, errMsgs = [];
  function tick(){
    done++;
    note('warn', '削除しています… ' + done + ' / ' + rows.length + ' 件');
  }

  // 3件ずつ並行で送る。1件ずつだと件数が多いときに待ち時間が長くなる。
  var idx = 0;
  function worker(){
    if (idx >= rows.length) return Promise.resolve();
    var r = rows[idx++];
    return ktDelete('holidays', r._id)
      .catch(function(e){ errMsgs.push(r.HolidayDate + '：' + e.message); })
      .then(function(){ tick(); return worker(); });
  }

  Promise.all([worker(), worker(), worker()]).then(function(){
    HL.busy = false;
    HL.result = errMsgs.length
      ? { cls:'bad', html:'<b>' + (rows.length - errMsgs.length) + '件を削除しました。' +
          errMsgs.length + '件は削除できませんでした。</b><br>' +
          esc(errMsgs.slice(0, 3).join(' ／ ')) +
          (errMsgs.length > 3 ? ' ほか' + (errMsgs.length - 3) + '件' : '') }
      : { cls:'good', html:rows.length + '件を削除しました。' };
    load();
  });
}

function note(cls, html){
  var el = $('note');
  if (el) el.innerHTML = '<div class="msg ' + cls + '">' + html + '</div>';
}
</script>
</body>
</html>
