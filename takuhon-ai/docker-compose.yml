# 拓本クリーン化サーバーだけの まとまり。
#   docker compose -p takuhon up -d --build
#   docker compose -p takuhon logs -f
#   docker compose -p takuhon down          ← -v は付けない（付けるとデータが消える）
#
# 【注意】Dify など、いま動いている まとまりとは別の名前（-p takuhon）で立てること。
#        Dify の compose ファイルに書き足したり、down -v を打ったりしないこと。
services:
  takuhon-ai:
    build: .
    image: takuhon-ai:latest
    container_name: takuhon-ai
    restart: unless-stopped
    ports:
      - "8077:8077"          # Ollama(11434) や Dify(80/443) とぶつからない番号
    volumes:
      - ./dataset:/app/dataset
      - ./runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
