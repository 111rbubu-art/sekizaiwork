<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墓石設計</title>
<style>
/* 墓石設計の タブの 枠（2026-11-10 本人「図面関連の ページを 統一。組み立てと 図面と 加工図面を タブで」「部材マスターは 組み立てから しか 使わない」）
   上の 帯は 共通。帯の 下は 今の 各画面（kumitate.html・zumen.html・buzai.html）を そのまま 入れる。タブを 切り替えても 作業は 消えない */
:root{--bar:#14233a;--tab:#24395a;--tabtx:#c9d6ea;--on:#f6f7f9;--ontx:#14233a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6f7f9;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
#bar{height:44px;background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;white-space:nowrap}
#logo{font-weight:700;font-size:16px}
#ken{background:#ffffff1a;border:1px solid #ffffff40;border-radius:14px;padding:2px 12px;font-size:13px;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
#ken:empty{display:none}
#tabs{display:flex;gap:2px;align-self:flex-end;margin-left:8px}
#tabs button{border:0;font:inherit;font-size:15px;padding:8px 20px 9px;border-radius:8px 8px 0 0;background:var(--tab);color:var(--tabtx);cursor:pointer;touch-action:manipulation}
#tabs button.on{background:var(--on);color:var(--ontx);font-weight:700}
#tabs button .sub{font-size:12px;font-weight:400;color:#56657a}
#tabs button:not(.on) .sub{display:none}
#sp{margin-left:auto;font-size:12px;color:var(--tabtx);overflow:hidden;text-overflow:ellipsis}
#ver{font-size:11px;color:#8ea2c0;overflow:hidden;text-overflow:ellipsis}
#main{position:absolute;left:0;right:0;top:44px;bottom:0}
#main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
#main iframe.on{visibility:visible;z-index:2}
#empty{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:#f6f7f9}
#empty.on{display:flex}
#empty div{max-width:560px;background:#fff;border:1px solid #d3d9e1;border-radius:10px;padding:22px 26px;font-size:15px;line-height:1.8;color:#334}
#empty b{color:var(--ontx)}
#empty button{margin-top:10px;font:inherit;font-size:14px;padding:6px 14px;border-radius:6px;border:1px solid #c3ccd8;background:#fff;cursor:pointer}
@media (max-width:900px){ #ver{display:none} #logo{font-size:14px} #tabs button{padding:8px 12px 9px;font-size:14px} #sp .long{display:none} }
@media (max-width:600px){ #ken,#logo{display:none} #tabs{margin-left:0} }
</style>
</head><body>
<div id="bar">
  <span id="logo">🪨 墓石設計</span>
  <span id="ken" title="案件の 件名（業務アプリから）"></span>
  <div id="tabs">
    <button data-t="kumi" class="on" title="墓所に 部材・セットを 並べる 3D（部材マスターも ここから）">🏯 組み立て<span class="sub" id="subBz"></span></button>
    <button data-t="zumen" title="組み立ての 形の 展開図（平面・正面・側面・背面）。DXF・DWG・mics も ここで 開く">📐 図面</button>
    <button data-t="kakou" title="組み立てから 作った 配置図・部品寸法表・詳細図の 束／部材 1 つの 図枠つき 加工図面">✏ 加工図面</button>
  </div>
  <span id="sp"></span>
  <span id="ver"></span>
</div>
<div id="main">
  <div id="empty"><div><b>加工図面</b>は 次の どれかで 開きます。<br>
    ・組み立ての 3D で 部材を <b>ダブルクリック</b><br>
    ・部材マスターで 部材を 選んで［✎ 図面で 直す］<br>
    ・組み立ての［📐 図面に する］で 配置図・部品寸法表・詳細図の 束<br>
    <button id="bEmptyBz">🗂 部材マスターを 開く</button></div></div>
</div>
<script>
var SHELL_VER = 'v0.2';
// 各 タブの 画面（はじめて 開く ときに 読む）。図面と 加工図面は zumen.html を 2 つ（自動保存の 鍵を 分けて ある）
var PAGES = { kumi:'kumitate.html?sk=kumi', zumen:'zumen.html?sk=zumen', kakou:'zumen.html?sk=kakou', buzai:'buzai.html?sk=buzai' };
var NAMES = { kumi:'組み立て', zumen:'図面', kakou:'加工図面', buzai:'部材マスター' };
var FR = {}, CUR = 'kumi', BZ_ON = false, KAKOU_ON = false, WAIT = {};
function $(id){ return document.getElementById(id); }
function frame(t, hash){
  if (FR[t]) return FR[t];
  var f = document.createElement('iframe'); f.id = 'f_' + t; f.title = NAMES[t];
  f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
  f.src = PAGES[t] + (hash || ''); f.addEventListener('load', function(){ f.__ok = true; vers(); (WAIT[t] || []).forEach(function(fn){ try { fn(f.contentWindow); } catch (e) {} }); WAIT[t] = []; });
  $('main').appendChild(f); FR[t] = f; return f;
}
function whenReady(t, fn){ var f = frame(t); if (f.__ok) fn(f.contentWindow); else (WAIT[t] = WAIT[t] || []).push(fn); }
function show(){
  var vis = CUR === 'kumi' && BZ_ON ? 'buzai' : CUR;
  Object.keys(FR).forEach(function(k){ FR[k].classList.toggle('on', k === vis); });
  [].forEach.call($('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t === CUR); });
  $('subBz').textContent = CUR === 'kumi' && BZ_ON ? '　›　🗂 部材マスター' : '';
  $('empty').classList.toggle('on', CUR === 'kakou' && !KAKOU_ON);
  var f = FR[vis]; if (f) setTimeout(function(){ try { f.contentWindow.focus(); } catch (e) {} }, 0);   // キー操作（AutoCAD 式の コマンド・Fusion 式の 3D）は 見えて いる タブへ
}
// 枠の 窓口（中の 画面は sekkei-in.js の SKP から 呼ぶ）
var SK = {
  go: function(t, hash){
    if (t === 'buzai') { CUR = 'kumi'; BZ_ON = true; frame('kumi'); frame('buzai'); show(); return; }
    if (t === 'kumi') BZ_ON = false;
    if (t === 'kakou' && /^#pd/.test(hash || '')) KAKOU_ON = true;
    var f = FR[t];
    if (!f) frame(t, hash);
    else if (hash) { try { f.contentWindow.location.hash = hash; } catch (e) { f.src = PAGES[t] + hash; } }
    CUR = t; show();
  },
  // 加工図面の［✓ 図から 反映して マスターへ 戻る］→ 組み立てタブの 部材マスターに 渡す
  toMaster: function(def, open){ whenReady('buzai', function(w){ if (w.bmTake) w.bmTake(def); }); if (open) SK.go('buzai'); },
  kakouState: function(on){ KAKOU_ON = !!on; show(); },
  // 組み立ての［📐 図面に する］：配置図・部品寸法表・詳細図の 束は 加工図面タブ、展開図は 図面タブ（こちらを 見せる）
  zumenize: function(t){ KAKOU_ON = true; var f = FR.kakou; if (!f) frame('kakou', '#km' + t); else { try { f.contentWindow.location.hash = '#km' + t; } catch (e) { f.src = PAGES.kakou + '#km' + t; } }
    SK.go('zumen', '#tk' + t); }
};
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t === 'kumi' && CUR === 'kumi' && BZ_ON) { BZ_ON = false; show(); return; }   // 部材マスターから 組み立てへ
  SK.go(b.dataset.t); });
$('bEmptyBz').onclick = function(){ SK.go('buzai'); };
// 件名・SharePoint（業務アプリの［📐 図面］から 開いた とき）
var FROM = null; try { FROM = JSON.parse(sessionStorage.getItem('zumenFrom') || 'null'); } catch (e) {}
if (FROM && FROM.title) { $('ken').textContent = '📁 ' + FROM.title; document.title = FROM.title + ' ― 墓石設計'; }
function spOn(){ try { var w = window.opener; return !!(w && !w.closed && w.listItemsInFolderPassFromTekkyo); } catch (e) { return false; } }
function spShow(){ $('sp').innerHTML = spOn() ? '☁️ <span class="long">SharePoint と </span>つながって います' : '💻 この 端末だけ<span class="long">（SharePoint は 業務アプリから 開いた とき）</span>'; }
spShow(); setInterval(spShow, 10000);
function vers(){ var v = [], g = function(t, n){ try { var w = FR[t] && FR[t].__ok && FR[t].contentWindow; if (w && w.APP_VER) v.push(n + ' ' + w.APP_VER); } catch (e) {} };
  g('kumi', '組み立て'); g('zumen', '図面'); if (!FR.zumen) g('kakou', '図面'); g('buzai', '部材'); v.push('枠 ' + SHELL_VER); $('ver').textContent = v.join('・'); }
// 最初は 組み立て。#zumen・#kakou・#buzai で その タブから
var h0 = (location.hash || '').replace('#', '');
frame('kumi'); if (h0 === 'zumen' || h0 === 'kakou' || h0 === 'buzai') SK.go(h0); else show();
vers();
</script>
</body></html>
