<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モデリング（墓所の 3D）</title>
<style>
:root{--fg:#1d1d1f;--sub:#6b6b70;--line:#d9d9de;--acc:#2f5d8a;--navy:#1f3b5c;--org:#e07a1f;--bg:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
.top{flex:none;min-height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
.top b{font-size:16px;white-space:nowrap}
.top .nm{background:transparent;border:1px solid #5b7a9c;border-radius:6px;color:#fff;padding:5px 8px;width:220px;font:inherit}
.top .nm::placeholder{color:#a9bcd2}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 11px;font-weight:700;white-space:nowrap}
.btn.g{background:var(--acc);color:#fff;border:1px solid #8fb0d0}
.seg{display:flex;border:1px solid #8fb0d0;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:7px 10px}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.main{flex:1;display:flex;min-height:0}
.left{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px;overflow:auto}
.left h4{margin:10px 0 6px;font-size:12px;color:var(--sub)}
.it{display:flex;align-items:center;width:100%;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fafafa;text-align:left;color:var(--fg)}
.it.on{border-color:var(--org);background:#fff4ea;font-weight:700}
.tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:#e6e8ec;color:#555;font-weight:400}
.c{flex:1;position:relative;min-width:0}
#v{position:absolute;inset:0}
#skPins{position:absolute;left:0;top:0;width:0;height:0;z-index:6}
/* 直し方の 矢印（部材の 上に じかに。v0.8.81 本人「部材に 直接 矢印の マークを 付けて、移動や 寸法変更と 出る 様に」） */
#skArw{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible}
#skArw g.ar{pointer-events:auto;cursor:pointer}
#skArw g.ar:hover .chip rect{fill:#fff4ea}
#dimPins{position:absolute;left:0;top:0;width:0;height:0;z-index:5}
#dimPins .dpin{position:absolute;transform:translate(-50%,-50%)}
#dimPins button{background:#1f3a5f;color:#fff;border:0;border-radius:6px;padding:2px 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
#dimPins button:hover{background:#e07a1f}
#dimPins button.lk{background:#c2410c}
#dimPins .lkv{background:#fff;color:#c2410c;border-radius:4px;padding:0 4px;margin-left:2px}
#dimPins input{width:70px;font:inherit;font-size:13px;padding:2px 4px;border:2px solid #e07a1f;border-radius:6px}
/* 札は エラーの 所から 右上へ 線で 引き出す（v0.8.47 本人「アラートの 位置を 右側に ずらして、エラーの 位置と 線で 紐づけて」） */
#skPins .pin{position:absolute;width:0;height:0}
#skPins .pin .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#b42020;border:2px solid #fff;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
#skPins .pin .ld{position:absolute;left:0;top:-1px;width:113px;height:2px;background:#b42020;transform-origin:0 50%;transform:rotate(-27.9deg);box-shadow:0 0 0 1px rgba(255,255,255,.7);pointer-events:none}
#skPins .pin .pb{position:absolute;left:100px;top:-53px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start}
#skPins .pin.op .pb{transform:translateY(-14px)}
#skPins .pin .pb>button.lb{background:#b42020;color:#fff;border:2px solid #fff;border-radius:7px;padding:2px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#skPins .pin .gopt.sko{margin:3px 0 0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:8px;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#skPins .pin .gopt.sko button{background:rgba(255,255,255,.6)}#skPins .pin .gopt.sko button:hover{background:rgba(255,244,234,.9)}
#skPins .pin .gopt.sko button{white-space:nowrap}
.hln{font-weight:700;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}.hln i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;box-shadow:0 0 0 1.5px #fff}
/* 直す ための 案内（目地・拝石）は 3D の 右上（右の 欄の 部材の 設定と まぎれない ように） */
.fixes{position:absolute;top:46px;right:10px;width:300px;max-width:calc(100% - 20px);max-height:calc(100% - 56px);overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.fixes>*{pointer-events:auto}
.btn:disabled,.lk:disabled{opacity:.45;cursor:default}
/* 右クリックの メニュー・大きさを 変更・変えた あとの アラート（v0.8.23） */
#ctx{position:fixed;z-index:80;display:none;background:#fff;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.28);min-width:190px;padding:6px 0;font-size:13px}
#ctx .h{padding:4px 14px 8px;color:#888;font-size:12px;border-bottom:1px solid #eee}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;font:inherit;color:var(--fg);cursor:pointer}
#ctx button:hover{background:#e8f0ff}
#szBox{position:absolute;left:10px;bottom:10px;width:260px;max-width:calc(100% - 20px);margin:0;background:rgba(255,255,255,.97);box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:6}
#szBox.near{bottom:auto}
#szBox .szr{display:flex;align-items:center;gap:6px;margin:5px 0}
#szBox .szr .k{width:36px;color:var(--sub)}
#szBox input{width:72px;font-weight:700;font-size:15px;padding:3px 6px;border:2px solid #1f9d55;border-radius:6px}
#szSt{margin-top:6px;line-height:1.6}
/* 移動の 間の 1 行の 案内（v0.8.87 本人「移動モードで 入力欄が 邪魔」→ 欄を 外した）。押せない（下の 3D を じゃま しない） */
#mvHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:none;pointer-events:none;background:rgba(31,58,95,.82);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#alertBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;display:none;gap:10px;align-items:center;background:#b42020;color:#fff;border-radius:10px;padding:8px 12px;max-width:min(720px,calc(100% - 340px));box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px}
#alertBar .al{font-size:12px;opacity:.9;margin-top:2px}
#alertBar .ab{display:flex;flex-direction:column;gap:4px;flex:none}
#alertBar .lk{color:#fff}
.gopt{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.gopt button{text-align:left;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:7px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--fg)}
.gopt button:hover{border-color:var(--org);background:#fff4ea}
.gopt button:disabled{opacity:.55;cursor:default}
.gopt.sko{gap:3px;margin:3px 0 4px 12px}.gopt.sko button{padding:3px 8px;border-radius:6px}
.gopt.sko .skr{display:flex;align-items:center;gap:6px}.gopt.sko .skn{min-width:7.5em;font-size:12px;font-weight:700;white-space:nowrap}.gopt.sko .skr button{flex:1}
#alertBar .gopt.sko .skn{color:#fff}
#alertBar .muted.sko{color:#fff;margin-left:12px}
@media (max-width:900px){#alertBar{max-width:calc(100% - 20px);top:52px}}
.fixes .box{margin:0;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.fixes .hitlist{position:static;max-width:none;max-height:none}
.badge{position:absolute;top:10px;right:10px;border-radius:20px;padding:6px 14px;font-weight:700;max-width:calc(100% - 20px)}
.badge.ok{background:#dff3e4;color:#1d7a3a;border:1px solid #9fd3ae}
.badge.ng{background:#fde8e8;color:#b42020;border:1px solid #f2a7a7;cursor:pointer}
.hitlist{position:absolute;top:46px;right:10px;background:#fff;border:1px solid #f2a7a7;border-radius:10px;padding:8px 12px;line-height:1.7;display:none;max-width:calc(100% - 20px);max-height:40%;overflow:auto}
.site{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center}
.site b{grid-column:1/-1}
.chip{width:72px;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;font:inherit;font-weight:700;color:var(--navy);text-align:right;background:#fff}
.chip.l{border-color:#8fb0d0}
.chip:focus{outline:none;border-color:var(--org);background:#fff4ea}
.right{width:320px;flex:none;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}
.right h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f2}
.row .k{color:var(--sub)}
.muted{color:var(--sub);font-size:11px;line-height:1.5}
.box{margin-top:12px;background:#f5f7fa;border-radius:10px;padding:10px}
.box .row{border-color:#e3e6ea}
.tot{font-size:17px;font-weight:700;color:var(--navy)}
.lk{color:var(--acc);font-weight:700;background:none;border:0;padding:0}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;max-width:170px}
.box select[data-g]{max-width:118px}
.ltp{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.ltb{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;font-weight:bold;cursor:pointer;text-align:left}
.ltb .ic{font-size:16px;line-height:1.1}.ltb small{font-weight:normal;color:#667;font-size:11px}
.ltb.on{border-color:#e07a1f;background:#fff4ea;box-shadow:0 0 0 1px #e07a1f inset}
.ltd summary{cursor:pointer;color:#2a5aa8;font-size:12px;margin:4px 0}
.ishsz{display:flex;align-items:center;gap:4px;padding:2px 0 7px 14px;border-bottom:1px solid var(--line);font-size:12px}.ishsz .k{color:#556;white-space:nowrap}.ishsz small{color:#667;font-size:11px;white-space:nowrap}.ishsz input{flex:1;min-width:60px}.ishsz b{min-width:50px;text-align:right;white-space:nowrap}
.ishb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px 2px 2px;font:inherit;font-size:12px;vertical-align:middle;cursor:pointer}
.ishth{display:inline-block;border-radius:4px;background-size:cover;background-position:center;border:1px solid #0002;flex:none}
.ishth.no{background:repeating-linear-gradient(45deg,#f2f2f2 0 6px,#e4e4e4 6px 12px);color:#888;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.ishsp{background:#f3f7fc;border:1px solid #cfe0f2;border-radius:8px;padding:6px;margin:4px 0}
.ishp{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0 8px}
.ishg{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.ishc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fafafa;border-radius:8px;padding:5px 3px;font:inherit;font-size:11px;cursor:pointer;color:var(--fg)}
.ishc.on{border-color:var(--org);background:#fff4ea;font-weight:700}
.ishc i{position:absolute;top:1px;right:3px;font-style:normal;color:#b42020;font-size:11px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #0002}
.plist .row{cursor:pointer}
.plist .row.on{background:#fff4ea}
.plist .row.hit .k{color:#b42020}
.err{color:#b42020}
.auto{grid-column:1/-1;background:var(--org);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:700}
.ad{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;background:#fff}
.ad.cur{border-color:var(--org)}
.ad .h{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.ad .lv0{color:#1f7a3a}.ad .lv1{color:#a85b00}.ad .lv2{color:#b42020}
.ad ul{margin:4px 0 4px 16px;padding:0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* 部材構成（Fusion の ブラウザの 形）：3D の 上に 背景なしで 置く。名前の 所だけ 押せる（すき間は 3D を 回せる） */
.tree{position:absolute;left:10px;top:10px;width:310px;max-height:calc(100% - 20px);overflow-x:hidden;overflow-y:auto;pointer-events:none;font-size:12.5px;user-select:none}
.tree .bh,.tree .n{pointer-events:auto}
.tree .bh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-weight:700;background:rgba(242,243,245,.85);border:1px solid #c9ccd2;border-radius:4px;margin-bottom:4px;cursor:pointer;width:max-content;min-width:160px;gap:12px}
.tree .bh span:last-child{color:#888;font-weight:400}
.tree .n{display:flex;align-items:center;gap:4px;padding:2px 4px;white-space:nowrap;width:max-content;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:pointer}
.tree .nm{background:rgba(255,255,255,.55);border-radius:3px;padding:0 3px}
.tree .n.on .nm{background:#cfe3fa;outline:1px solid #6aa0de}
.tree .n.off .nm{color:#9a9a9a}
.tree .n.hit .nm{color:#b42020}
.tree .n[draggable]{touch-action:none}
.tree .kt{margin-left:6px;font-size:11px;color:#475569;background:rgba(255,255,255,.7);border-radius:3px;padding:0 4px;display:inline-flex;align-items:center;gap:3px}.tree .kt i{width:9px;height:9px;border-radius:2px;border:1px solid #0003;display:inline-block}
#ctx .km{display:flex;align-items:center;gap:6px}#ctx .km i{width:12px;height:12px;border-radius:3px;border:1px solid #0003;flex:none}#ctx .km small{color:#7a8899}
.kmc{display:inline-block;min-width:18px;text-align:center;font-size:11px;background:#e3eefc;color:#2f5f9e;border-radius:8px;padding:0 5px}
input.kmn{width:110px;text-align:left}
.kmrow{border-top:1px solid #eef1f5;padding:6px 0}.kmh{display:flex;align-items:center;gap:6px}.kmh .lk{margin-left:auto}.kms{display:flex;align-items:center;gap:6px;margin:4px 0 0 24px;flex-wrap:wrap}
.kmcol{width:18px;height:18px;border-radius:4px;border:1px solid #0004;margin-right:4px;cursor:pointer;vertical-align:-4px;padding:0}
.kmpal{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 8px}.kmpal button{width:22px!important;height:22px;border-radius:5px;border:1px solid #0003!important;padding:0!important;cursor:pointer}
#ctx .km.on{background:#eef5ff}
.tree .n[draggable] .nm{cursor:grab}
.tree .n.dz .nm{background:#fde7cf;outline:2px dashed var(--org)}
.tree .ar{width:12px;color:#555;font-size:10px;text-align:center}
.tree .ey{width:18px;text-align:center;color:#444}
.tree .ey.off{color:#aaa}
.tree .ic{width:16px;text-align:center}
.tree.min .n{display:none}
.fx{width:100%;border-collapse:collapse;font-size:12px}
.fx th{font-weight:400;color:var(--sub);text-align:center;padding:2px}
.fx td{padding:3px 2px;border-bottom:1px solid #e3e6ea;text-align:center}
.fx td:first-child{text-align:left}
.fx .chip{width:58px;padding:2px 4px}
.fx input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.fx .mv{color:var(--sub);font-size:10.5px;white-space:nowrap}
.fx .ps{font-size:10.5px;padding:1px 2px;max-width:none}
.fx .pk{cursor:pointer;color:var(--acc)}
.dis{color:#aaa}
.go{display:block;width:100%;margin-top:10px;background:var(--org);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:700}
.pick{cursor:pointer;display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px;background:#fff;text-align:left;color:var(--fg)}
.pick.on{border-color:var(--org);background:#fff4ea}
#busy{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;background:#223;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:14px;display:none}
#busy.ok{background:#1d7a3a}#busy.ng{background:#b42020}#busy.warn{background:#c0392b;font-weight:700;font-size:16px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.tc{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px;text-align:center;font-size:11px;line-height:1.3;color:var(--fg)}
.tc.on{border-color:var(--org);background:#fff4ea;box-shadow:0 0 0 1px var(--org)}
.tc .th{display:block;width:100%;aspect-ratio:1;background:#fafbfc;border-radius:6px}
.tc .th svg{width:100%;height:100%;display:block}
.tc .th.no{display:flex;align-items:center;justify-content:center;color:#aab;font-size:22px}
.tc .use{position:absolute;top:3px;left:3px;background:var(--org);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.tc .mr{position:absolute;top:3px;right:3px;background:#eef;color:#336;border-radius:4px;padding:0 4px;font-size:10px}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tchips button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:1px 8px;font-size:11px;cursor:pointer;color:var(--fg)}
.tchips button.on{background:#334;color:#fff;border-color:#334}
/* 部材を 足す（部材マスターの サムネ）と 支点を 選ぶ 案内 */
.ldw{position:relative}
.ldm{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;width:260px;font-size:13px}
.ldm.on{display:block}.ldm button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;font:inherit;color:inherit}.ldm button:hover{background:#f1f5f9}
.ldm .muted{padding:4px 10px}
.tree .bhw{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}.tree .bhw .bh{margin-bottom:0;min-width:120px}
.tree .mbb{pointer-events:auto;border:1px solid #c9ccd2;background:rgba(255,255,255,.92);color:var(--navy);border-radius:4px;padding:4px 8px;font-weight:700;font:inherit;font-weight:700;white-space:nowrap}
.addb{display:block;width:100%;margin:8px 0 4px;background:var(--org);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:14px}
#pk{position:absolute;left:12px;right:12px;top:12px;max-width:900px;max-height:calc(100% - 24px);margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid #d6d9de;padding:14px 16px;display:none;flex-direction:column;z-index:20}
#pk.on{display:flex}
#pk .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pk .hd b{font-size:15px}
#pk .x{background:none;border:0;font-size:20px;color:#6b7280}
#pk .q{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;margin:8px 0}
#pk .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#pk .tabs button{border:0;background:#eef0f3;border-radius:16px;padding:5px 11px;color:var(--fg)}
#pk .tabs button.on{background:var(--navy);color:#fff}
#pk .grid{flex:1;min-height:120px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start;margin-top:8px;padding:2px}

<script>
var APP_VER = 'v0.8.95';
// 部材の データ：見本（kumitate-data.js）か、読んだ 旧シミュレーターの 保存ファイル
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var DATA0 = lsGet('kumitate.data') || window.KUMITATE_DATA;
// セット（図面から 読んだ 石塔・外柵。buzai-set/1）。SharePoint の 部材ライブラリ/セット が 元。この 端末にも 覚える（つながらない ときも 使える）
var SETS = lsGet('kumitate.sets') || [];
// 部材ライブラリ（buzai/1。SharePoint の 部材ライブラリ/部材 が 元。この 端末にも 覚える）。セット（buzai-set/2）は 枠と 部材の id だけ（buzai-lib.js）
var LIB = lsGet('kumitate.lib') || {}, RSETS = [];
var PART_DIR = '/業務アプリ/部材ライブラリ/部材';
// 中身（版・保存日・絵・元・__ の 印を 除く）
function partBody(p){ var d = {}; Object.keys(p || {}).forEach(function(k){ if (k.indexOf('__') !== 0 && ['version', 'savedAt', 'thumb', 'sources', 'tags', 'status'].indexOf(k) < 0) d[k] = p[k]; }); return JSON.stringify(d); }
// ファイルから 読んだ セットの 部材で 手元を 置き換える（v0.8.62。本人「読んだのに 香炉が 古い まま・見本図面も ない」＝手元の 版が 上で 捨てて いた）
//   中身が ちがう ときだけ 手元の 版 +1 に して 置き換え、SharePoint へは 未保存（保存で 送る）。見本図面が 無い ときは 手元の ものを 残す
var LIB_FORCE = false;
function libForce(p){ BL.mhIn(p); var o = LIB[p.id]; if (!o) { LIB[p.id] = p; return true; }
  var shapeNew = JSON.stringify(o.components) !== JSON.stringify(p.components);   // 形が 変わった ときは 前の 加工図面の 下書き（sketch）を 残さない（古い 形の 図から 反映すると 形が 戻る）
  Object.keys(o).forEach(function(k){ if (k.indexOf('__') !== 0 && k !== 'thumb' && !(shapeNew && k === 'sketch') && p[k] == null) p[k] = o[k]; });   // ファイルに 無い もの（見本図面・加工図面の 下書き など）は 手元の ものを 残す
  if (partBody(o) === partBody(p)) return false;
  ['tags', 'status'].forEach(function(k){ if (o[k] != null) p[k] = o[k]; });
  p.version = (o.version || 0) + 1; delete p.thumb; delete p.__sp; LIB[p.id] = p; return true; }
function libPut(p){ if (LIB_FORCE) return libForce(p); BL.mhIn(p); var o = LIB[p.id]; if (o && (o.version || 0) > (p.version || 0)) return false; if (o && o.thumb && !p.thumb && (o.version || 0) === (p.version || 0)) p.thumb = o.thumb; LIB[p.id] = p; return true; }
function libSave(){ lsSet('kumitate.lib', LIB); }
// 前の 形の セット（部材を 丸ごと）→ 枠と 参照 ＋ 部材ライブラリ（左右で 同じ 石は 反転で 1 つ）
// セットの ファイルに 入った 部材（parts_lib）は、この 端末に 無い・古い ときだけ 入れる（同じ 版の 手元の 直しを 消さない。v0.8.22）
function libFill(p){ var o = LIB[p.id]; if (o && (o.version || 0) >= (p.version || 0)) return false; return libPut(p); }
function toNewSet(S){ if (!S || BL.isNew(S)) { (S && S.parts_lib || []).forEach(LIB_FORCE ? libPut : libFill); if (S) delete S.parts_lib; return S; } var r = BL.split(S); r.parts.forEach(libPut); return r.set; }
(function(){ var ch = false; SETS = SETS.map(function(S){ if (BL.isNew(S)) return S; ch = true; return toNewSet(S); }); if (ch) { lsSet('kumitate.sets', SETS); libSave(); } })();
function addsOf(id){ return ((typeof ST !== 'undefined' && ST && ST.add) || []).filter(function(a){ return a.setId === id; }); }
// 旧シミュレーターの 石塔（和型8寸・9寸・洋型）と 外柵（デザイン1・2・階段付き）は 使わない（本人）。図面から 読んだ セットだけ 出す
function build(){ RSETS = SETS.map(function(S){ return BL.resolve(S, LIB, addsOf(S.id)); }); var d = KM.addSets(DATA0, RSETS), pd = d === DATA0 ? (d = JSON.parse(JSON.stringify(d))).partsData : d.partsData;
  ['TOWER_VARIANTS', 'FENCE_VARIANTS'].forEach(function(vt){ var V = pd[vt] || {}; Object.keys(V).forEach(function(k){ if (!V[k].set && k !== 'none') delete V[k]; }); });
  return d; }
// 部材マスターで 削除した 部材（buzai.deleted＝id → 版）は ライブラリから 外す（v0.8.18）
function dropDel(){ var D0 = lsGet('buzai.deleted') || {}, ch = false; Object.keys(D0).forEach(function(id){ if (LIB[id] && (LIB[id].version || 0) <= D0[id]) { delete LIB[id]; ch = true; } }); if (ch) libSave(); return ch; }
dropDel();
var DATA = build();
// 部材マスター（buzai.html）で 直した 部材・セットを 取り込む（同じ 端末の 別の 窓）
window.addEventListener('storage', function(e){
  if (e.key === 'buzai.deleted') { dropDel(); return; }
  if (e.key !== 'kumitate.lib' && e.key !== 'kumitate.sets') return;
  if (e.key === 'kumitate.lib') { var L = lsGet('kumitate.lib') || {}; Object.keys(L).forEach(function(id){ if (!LIB[id] || (L[id].version || 0) >= (LIB[id].version || 0)) LIB[id] = L[id]; }); dropDel(); }
  else SETS = lsGet('kumitate.sets') || SETS;
  DATA = build(); if (typeof RES !== 'undefined' && RES) { renderLeft(); run(); }
});
function setsChanged(){ lsSet('kumitate.sets', SETS); libSave(); DATA = build(); }
// 見つからない 部材（セットが 指して いるが 部材ライブラリに 無い）。その 枠は 箱で 出る（v0.8.22）
function missingParts(sel){ var m = {}; (RSETS || []).forEach(function(R){ if (sel && !(typeof ST !== 'undefined' && ST && ST.sel && (ST.sel.tower === R.id || ST.sel.fence === R.id))) return; (R.missing || []).forEach(function(id){ (m[id] = m[id] || []).indexOf(R.name) < 0 && m[id].push(R.name); }); }); return m; }
// SharePoint から 見つからない 部材を 取りに いく → まだ 無ければ 知らせる
function fixMissing(say){
  var ids = Object.keys(missingParts()), w = spHost();
  var tell = function(){ var m = missingParts(!say), k = Object.keys(m); if (!k.length) return;
    var msg = '⚠ 部材が 見つかりません（' + k.length + ' 個・箱で 出して います）：' + k.join('、');
    busy(msg, 'ng', 12000);
    if (say) alert(msg + '\n\nセットが 指して いる 部材が、この 端末にも SharePoint の 部材ライブラリにも ありません。\n部材の 入った セットの ファイル（セットの［⬇］で 書き出した もの）か 部材の ファイルを［📂 読む］から 読むと 形が 出ます。\n部材マスターの セットの「部材の 中身」の 赤い 行（部材が ありません）からも［🗂 部材マスターから 選ぶ］で 部材を 選べます。'); };
  if (!ids.length) return Promise.resolve();
  if (!w) { tell(); return Promise.resolve(); }
  return Promise.all(ids.map(function(id){ return w.downloadJsonFromFolderPassFromTekkyo(PART_DIR, id + '.json').then(function(t){ try { var p = JSON.parse(t); if (p.schema === 'buzai/1' && p.status !== 'deleted') { p.__sp = p.version || 0; libPut(p); } } catch (e) {} }).catch(function(){}); }))
    .then(function(){ setsChanged(); if (typeof RES !== 'undefined' && RES) { renderLeft(); run(true); } tell(); });
}
var TANKA = lsGet('kumitate.tanka');   // { stones:[], estimate:{} }（公開の 場所に 置かない ため ファイルから 読む）
// セットを 直す 画面（v0.8.69 本人「マスター修正で 別の モデリング画面に」）：?set=<セットの id>。今の 設計とは 別の 状態（kumitate.state.set:<id>）で その セットだけ
var SETEDIT = (function(){ var m = /[?&]set=([^&#]+)/.exec(location.search); return m ? decodeURIComponent(m[1]) : ''; })();
var STK = SETEDIT ? 'kumitate.state.set:' + SETEDIT : 'kumitate.state';
var ST = lsGet(STK);
if (!ST || ST.schema !== 'kumitate/1') ST = KM.newState(DATA);
if (SETEDIT) (function(){ var S = setById(SETEDIT); if (!S) return; var vs = KM.variants(DATA, S.kind === 'tower' ? 'fence' : 'tower');
  ST.sel = ST.sel || {}; ST.sel[S.kind] = S.id; ST.sel[S.kind === 'tower' ? 'fence' : 'tower'] = vs.none ? 'none' : ''; ['boshi', 'toba'].forEach(function(k){ if (ST.sel[k] != null) ST.sel[k] = 'none'; }); ST.sel.crypt = '';
  ST.site = ST.site || {}; var z = S.size || {}; if (S.kind === 'fence' && z.W > 0) { ST.site.W = z.W; ST.site.D = z.D; } else if (z.W > 0) { ST.site.W = Math.max(ST.site.W || 0, z.W + 600); ST.site.D = Math.max(ST.site.D || 0, z.D + 600); }
  ST.name = 'セットを 直す：' + (S.name || S.id); })();
ST.shapes = ST.shapes || {};
var SEL = null, RES = null, V3 = null;
// ── まとめて 選ぶ（v0.8.48 本人「選択されている部材をまとめて移動できるようにして」）──
//   MSEL＝SEL の ほかに 選んだ 部材 {鍵:1}。Ctrl／Shift＋クリック（3D・部材構成）で 足す・外す、3D を 左で 引くと 窓で 選ぶ（Fusion・AutoCAD と 同じ）。
//   MSELO＝MSEL を 作った ときの SEL。ほかの 所で SEL が 変わったら（ふつうの クリック・部材を 足す など）MSEL は 消える
var MSEL = {}, MSELO = null;
ST.free = ST.free || [];
// 計算：組み立てエンジン ＋ 足した 部材（支点で 置く）
function calc(){ mvClean(ST); boltSync(ST); return calcOn(ST); }
// 置いた 金具の ボルト（穴径・深さ・位置）は 部材マスターの 今の 値に 合わせる（v0.8.78。本人「φ8 深さ 55、変えられる ように」）
function boltSync(S){ (S.free || []).forEach(function(f){ var L = f.shape && f.shape.id && LIB[f.shape.id]; if (L && L.bolts && JSON.stringify(L.bolts) !== JSON.stringify(f.shape.bolts)) f.shape.bolts = JSON.parse(JSON.stringify(L.bolts)); }); }
// 前の 版（〜v0.8.34）で 引く 間に 何倍も 足された 外柵の 面の ずれ（例 2112 mm）を 消す
//   v0.8.70：消すのは 伸ばした（両面の ずれが ちがう）ぶんが 500 を 越える とき だけ。石を そのまま 動かした（両面が 同じ）ずれは 何 mm でも 残す
//   （本人「塔婆柱の 基点を 使った 移動が できない」＝点で 移動で 後ろへ 906 動かすと z0・z1 が 消され 前後だけ 戻って いた）
function mvClean(S){ Object.keys(S.mv || {}).forEach(function(k){ var m = S.mv[k];
  Object.keys(m).forEach(function(f){ if (!isFinite(+m[f])) delete m[f]; });
  ['x', 'z'].forEach(function(A){ var a = +m[A + '0'] || 0, b = +m[A + '1'] || 0; if (Math.abs(a - b) > 500) { delete m[A + '0']; delete m[A + '1']; } }); }); }

function revOf(k, ax, val){ ST.lockRev = ST.lockRev || {}; var r = ST.lockRev[k] = ST.lockRev[k] || { n:0, ax:{} }, c = r.ax[ax]; val = Math.round(val * 10) / 10;
  if (c && Math.abs(c.val - val) < 0.5) return c.no; r.n++; r.ax[ax] = { no:r.n, val:val }; return r.n; }
function lockSnap(keys){ var o = {}; keys.forEach(function(k){ o[k] = {}; lockDiff(k).forEach(function(x){ o[k][x.ax] = x.model; }); }); return o; }
// 変えた あと：鍵の 寸法が 新しく 変わったら 一度 聞く（2026-11-16 本人「一度アラームを出して、OKなら」）。やめる → revert
function lockAsk(keys, before, revert){ var nw = [];
  keys.forEach(function(k){ lockDiff(k).forEach(function(x){ var b = (before[k] || {})[x.ax]; if (!x.diff || (b != null && Math.abs(b - x.model) < 0.5)) return; nw.push({ k:k, x:x }); }); });
  if (!nw.length) return true;
  var t = nw.map(function(o){ var q = RES.parts[o.k], r = ST.lockRev && ST.lockRev[o.k], no = r && r.ax[o.x.ax] && Math.abs(r.ax[o.x.ax].val - o.x.model) < 0.5 ? r.ax[o.x.ax].no : (r ? r.n : 0) + 1;
    return '・' + q.name + ' の ' + o.x.n + '：加工図面は ' + o.x.lock + ' に 鍵 → ' + Math.round(o.x.model * 10) / 10 + '（加工図面は ' + o.x.lock + ' を 横線で 消して △' + no + ' ' + Math.round(o.x.model * 10) / 10 + '）'; }).join('\n');
  if (confirm('🔒 鍵の かかった 寸法を 変えます。よろしいですか？\n' + t + '\n\nマスター部材は 変わりません（この お墓の 加工図面だけ）')) { nw.forEach(function(o){ revOf(o.k, o.x.ax, o.x.model); }); lsSet(STK, ST); run(); return true; }
  revert(); return false; }
function lockNotes(){ var out = []; if (!RES) return out;
  Object.keys(RES.parts).forEach(function(k){ var q = RES.parts[k]; if (q.visible === false || !RES.boxes[k]) return;
    // 図面で 鍵を かけた 中の 寸法が 今の 大きさに 入りきらない（v0.8.55）
    if (q.shape && BZ.keepFail) BZ.keepFail(q.shape).forEach(function(f){ out.push('✕ ' + q.name + '：鍵の 寸法が 入らない（' + f.name + ' ' + Math.round(f.now * 10) / 10 + ' ＜ 鍵 ' + [f.L, f.R].filter(function(x){ return x > 0; }).join('＋') + '）'); });
    lockDiff(k).forEach(function(x){ if (!x.diff) return; var d = Math.round((x.model - x.lock) * 10) / 10;
      var r = ST.lockRev && ST.lockRev[k] && ST.lockRev[k].ax[x.ax], no = r && Math.abs(r.val - x.model) < 0.5 ? '△' + r.no + ' ' : '';
      out.push('🔒 ' + q.name + '：' + x.n + 'は 加工図面で ' + x.lock + ' に 鍵 → ' + no + Math.round(x.model * 10) / 10 + '（差 ' + (d > 0 ? '+' : '') + d + '）'); }); });
  return out; }
function openKakou(k){
  var q = RES && RES.parts[k]; if (!q) return;
  var lk = lockDiff(k), lkd = lk.filter(function(x){ return x.diff; }), lkN = {}; lk.forEach(function(x){ lkN[x.n] = 1; });
  var lockInfo = lkd.map(function(x){ return { ax:x.ax, n:x.n, lock:x.lock, model:Math.round(x.model * 10) / 10, no:revOf(k, x.ax, x.model) }; }); if (lockInfo.length) lsSet(STK, ST);
  // 案件で 大きさ・左右が 変わった 部材は、3D と 同じ 形（q.shape）で 加工図面を 開く。前の 図（sketch）は 元の 大きさなので 外し、今の 形から かき直させる
  // （2026-11-11 本人「部材と 加工図面が 同じで ない」「水鉢と 同じように 拝石も」＝部品詳細図でなく 水鉢と 同じ 加工図面の 画面で）
  var jd = jobDiff(k).filter(function(t){ return !lkN[t.split(' ')[0]]; });   // 鍵の 寸法の ちがいは 形を 変えない（前の 図の まま 開く）
  if (q.shape && q.shape.__anc && q.shape.__anc.length) jd.push('アンカーの 穴 ' + q.shape.__anc.length);   // 金具の ボルトの 穴（v0.8.78）は この 案件の 形に だけ ある → 今の 形から かき直す
  if (jd.length && q.shape) { var dj = JSON.parse(JSON.stringify(q.shape)); delete dj.__from; delete dj.thumb; delete dj.sketch; if (!dj.id) dj.id = q.partId;
    lk.forEach(function(x){ if (dj.params && dj.params[x.ax]) { dj.params[x.ax].value = x.lock; dj.lock = dj.lock || {}; dj.lock[x.ax] = x.lock; } });
    dj.__job = { key:k, diff:jd, name:jobName(), lock:lockInfo }; dj.__master = 1; lsSet('zumen.part', dj); if (!skGo('kakou', '#pd' + Date.now())) window.open('zumen.html#pd' + Date.now(), 'zumen'); return; }
  var src = ST.shapes[k] || (q.partId && LIB[q.partId]) || q.shape; if (!src) { alert('この 部材には 形の データが ありません（箱だけ）'); return; }
  var d = JSON.parse(JSON.stringify(src)); delete d.__from; delete d.thumb; delete d.__mirror; if (!d.id) d.id = q.partId || 'part_' + Date.now().toString(36);
  lk.forEach(function(x){ if (d.params && d.params[x.ax]) { d.params[x.ax].value = x.lock; d.lock = d.lock || {}; d.lock[x.ax] = x.lock; } });
  d.__job = { key:k, diff:[], name:jobName(), lock:lockInfo }; // お墓（案件）から 開いた 印：保存は この お墓へ（マスターは 変えない、v0.8.19）
  d.__master = 1; lsSet('zumen.part', d); skGo('kakou', '#pd' + Date.now());
}
// 加工図面の［💾 この お墓に 保存］から：この 案件の この 石だけの 形と 加工図面（ST.shapes）に する。部材マスターは 変えない
// （2026-11-11 本人「お客様に 調整した 図面を マスターに 保存は ダメ。マスターから お客様ごとに 加工図面に して 微調整、お客様ごとに 保存」）
window.kmJobTake = function(k, def){ if (!def || !RES || !RES.parts[k]) return false; var d = JSON.parse(JSON.stringify(def)); delete d.__master; delete d.__back; delete d.__job; delete d.thumb;
  var q = RES.parts[k], o = ST.shapes[k]; d.__from = 'job';
  // 鍵の 寸法は 加工図面の 値（d.lock）の まま、モデリングの 大きさは 変えない（params は 今の モデリングの 大きさ。開くと また 鍵の 値で 描く）
  if (d.lock && d.params) [['W', 'w'], ['D', 'd'], ['H', 'h']].forEach(function(a){ if (+d.lock[a[0]] > 0 && d.params[a[0]] && q[a[1]] > 0) d.params[a[0]].value = q[a[1]]; }); d.__set = (o && o.__set) || q.setId || ''; if (!d.id) d.id = q.partId || ''; ST.shapes[k] = d; lsSet(STK, ST); renderLeft(); run(); return true; };
$('bUndo').onclick = undo;
$('bPng').onclick = function(){ if (!V3) return; var a = document.createElement('a'); a.href = V3.png(); a.download = 'kumitate_' + (ST.name || '3d') + '.png'; a.click(); };

  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); }); V3.fit(b.dataset.v);
});

var LOOK = lsGet('kumitate.look') || 'tex';
function lookSet(l){ LOOK = l === 'solid' || l === 'line' ? l : 'tex'; lsSet('kumitate.look', LOOK); var sh = SETEDIT && LOOK === 'tex' ? 'solid' : LOOK;   // セットを 直す 画面は 石目なし（石目の ボタンも 出さない）
  [].forEach.call($('segLook').children, function(x){ x.classList.toggle('on', x.dataset.l === sh); if (x.dataset.l === 'tex') x.style.display = SETEDIT ? 'none' : ''; }); if (V3 && V3.setMode) V3.setMode(sh); }
$('segLook').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) lookSet(b.dataset.l); });
$('ver').textContent = 'モデリング ' + APP_VER + '（部材は ' + (DATA0 === window.KUMITATE_DATA ? '見本' : '読んだ ファイル') + (SETS.length ? '・セット ' + SETS.length : '') + '）';

if (ST.sel.tower && !KM.variants(DATA, 'tower')[ST.sel.tower]) ST.sel.tower = KM.newState(DATA).sel.tower || '';
if (ST.sel.fence && !KM.variants(DATA, 'fence')[ST.sel.fence]) ST.sel.fence = 'none';
migGl(); RES = calc(); renderLeft(); run();
spLoadSets(false); if (!spHost()) fixMissing(false);
import('./kumitate-3d.js?v=0.8.95').then(function(m){
  K3M = m; V3 = m.create($('v'), pick, SKP ? function(k){ if (k) openKakou(k); } : null, ctxOpen, pickBox);
  V3.setTexture(ishSrc); V3.setLight(lightOf()); lookSet(LOOK); if (spHost()) spStonesLoad(); ishLoad().then(function(){ ishApply(); if (ISH.on && Object.keys(ISH.by).length) renderSel(); });
  draw();
  window.__ready = true;
}).catch(function(e){ $('v').innerHTML = '<div class="muted" style="padding:20px">3D を 開けませんでした：' + esc(e.message) + '</div>'; window.__ready = true; });
