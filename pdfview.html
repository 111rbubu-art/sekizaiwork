<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
html,body{margin:0;height:100%;background:#525659;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif}
/* お知らせは ビューワーより 前に */
#save-toast{z-index:20000!important}
#pvw-msg{color:#fff;padding:40px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div id="pvw-msg">読み込んでいます…</div>
<script>
/* **PDF ビューワーの 別ウインドウ**（v1.9.516。本人「PDFのビューワーは新しいウインドウで表示させてほしい」）。
   ビューワー・書き込み・ページ整理の 仕組みは、開いた 業務アプリ（index.html／index_b.html）から もらって ここで動かす。
   サインインと 一覧の描き直しは 業務アプリの画面のものを使うので、業務アプリを 閉じると 保存できなくなる。 */
(function () {
  var msg = document.getElementById('pvw-msg');
  var A = null; try { A = window.opener; } catch (e) {}
  if (!A || !A._pvInstall) { msg.textContent = '業務アプリの画面から 開いてください。'; return; }
  try { A._pvInstall(window); msg.remove(); }
  catch (e) { msg.textContent = '開けませんでした: ' + ((e && e.message) || e); }
})();
</script>
</body>
</html>
