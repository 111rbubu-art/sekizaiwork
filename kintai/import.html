<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤怠 — 過去の勤怠の入力</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
:root{
  --ground:#ECEDEA;--panel:#F8F9F7;--panel2:#E3E5E1;--ink:#191D1E;--ink2:#4A5251;--stone:#6B7371;
  --hair:#C9CDC8;--hair2:#DCDFDA;--accent:#2F5645;--accent-soft:#DFE9E3;--accent-txt:#2F5645;
  --signal:#A63D2C;--signal-soft:#F6E4E0;--amber:#8A6716;--amber-soft:#F3EBD8;
  --font:"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#131716;--panel:#1C2120;--panel2:#252B29;--ink:#E4E9E6;--ink2:#B2B9B6;--stone:#8B9390;
  --hair:#333B39;--hair2:#262D2B;--accent:#6FA189;--accent-soft:#21302A;--accent-txt:#8FBFA7;
  --signal:#D5806D;--signal-soft:#32211E;--amber:#C6A15C;--amber-soft:#2C2718;color-scheme:dark;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:52rem;margin:0 auto;padding:2rem 1rem 6rem}
h1{font-size:1.35rem;letter-spacing:.08em}
.sub{color:var(--stone);font-size:.86rem;margin-bottom:1.4rem}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:1rem 1.1rem;margin:.9rem 0}
.card h2{font-size:.8rem;letter-spacing:.1em;color:var(--stone);font-weight:700;margin-bottom:.7rem}
button{font-family:inherit;font-size:.92rem;cursor:pointer;background:var(--accent);
       color:var(--ground);border:none;border-radius:6px;padding:.6rem 1.1rem;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink2);font-weight:400}
button.danger{background:transparent;border:1px solid var(--signal);color:var(--signal);font-weight:400}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
label.f{display:block;font-size:.78rem;color:var(--stone);margin:.5rem 0 .2rem}
input,select,textarea{font-family:inherit;font-size:.95rem;padding:.45rem .55rem;background:var(--ground);
  color:var(--ink);border:1px solid var(--hair);border-radius:5px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{font-family:var(--mono);font-size:.85rem;min-height:7rem;line-height:1.6}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 8rem;min-width:7rem}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem;align-items:center}
.mon{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.mon .m{flex:1;text-align:center;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:.6rem -1.1rem 0;padding:0 1.1rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:.3rem .4rem;text-align:left;white-space:nowrap}
th{font-size:.7rem;letter-spacing:.05em;color:var(--stone);border-bottom:1px solid var(--hair);
   position:sticky;top:0;background:var(--panel)}
tbody tr+tr td{border-top:1px solid var(--hair2)}
tr.hol td{background:var(--panel2)}
tr.done td{opacity:.55}
td input{width:5.2rem;padding:.3rem .4rem;font-family:var(--mono);font-variant-numeric:tabular-nums;
         text-align:center}
td input.br{width:4rem}
td input.err{border-color:var(--signal);background:var(--signal-soft)}
td.act{white-space:nowrap}
button.del{background:transparent;border:1px solid var(--hair);color:var(--stone);
  font-size:.72rem;font-weight:400;padding:.1rem .45rem;border-radius:3px}
button.del:hover{border-color:var(--signal);color:var(--signal)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:.02rem .4rem;border-radius:3px}
.badge.ok{background:var(--accent-soft);color:var(--accent-txt)}
.badge.cau{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--signal-soft);color:var(--signal)}
.msg{border-radius:5px;padding:.6rem .75rem;margin-top:.6rem;font-size:.87rem}
.msg.bad{background:var(--signal-soft);color:var(--signal)}
.msg.warn{background:var(--amber-soft);color:var(--amber)}
.msg.good{background:var(--accent-soft);color:var(--accent-txt)}
.bar{height:6px;background:var(--hair2);border-radius:3px;overflow:hidden;margin-top:.6rem}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.nav{margin-bottom:1rem}
.back{display:inline-block;border:1px solid var(--hair);border-radius:6px;padding:.45rem .9rem;
  font-size:.88rem;color:var(--ink2);text-decoration:none;background:var(--panel)}
.back:hover{border-color:var(--accent);color:var(--accent-txt)}
.foot{color:var(--stone);font-size:.78rem;margin-top:2rem}
a{color:var(--accent-txt)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a class="back" href="./">← 勤怠にもどる</a></div>
  <h1>過去の勤怠の入力</h1>
  <p class="sub">タイムカードや手帳に残っている過去の出退勤を、まとめて登録します。管理者専用です。</p>
  <div id="gate"><button id="go">Microsoft 365 でログイン</button></div>
  <div id="main" class="hide"></div>
  <p class="foot">打刻画面は <a href="./">こちら</a> ／ 設定の点検は <a href="./check.html">こちら</a>。</p>
</div>

<script src="./config.js"></script>
<script src="./util.js"></script>
<script src="./auth.js"></script>
<script src="./graph.js"></script>
<script src="./attendance.js"></script>
<script>
var IM = { emps: [], holidays: [], punches: [], empNo: '', ym: ktYm(ktToday()), rows: [],
           busy: false, result: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return ktEsc(s); }

document.getElementById('go').onclick = function(){ ktLogin(); };

ktInitAuth(start, function(){}, function(e){
  $('gate').innerHTML = '<div class="msg bad">ログインエラー：' + esc(e.message) + '</div>';
});

function start(){
  $('gate').innerHTML = '<p class="sub">読み込んでいます…</p>';
  Promise.all([
    ktList('employees'),
    ktList('holidays').catch(function(){ return []; }),
    ktApi(KT_LIST.punches + '/columns').catch(function(){ return { value: [] }; })
  ]).then(function(r){
    IM.emps = r[0]; IM.holidays = r[1];
    IM.hasManual = (r[2].value || []).some(function(c){ return c.name === 'ManualTime'; });
    var me = ktUserName();
    var mine = IM.emps.filter(function(e){
      return String(e.UserPrincipalName || '').toLowerCase() === me;
    })[0];

    // 管理者だけが使える画面
    if (!mine || mine.IsAdmin !== true){
      $('gate').innerHTML = '<div class="msg bad"><b>この画面は管理者のみ使えます。</b><br>' +
        'ログイン中のアカウント：<code>' + esc(me) + '</code><br>' +
        '過去の勤怠の入力が必要な場合は、管理者にご依頼ください。</div>';
      return;
    }
    IM.admin = mine;
    var actives = IM.emps.filter(function(e){ return e.Active === true; });
    if (!IM.hasManual){
      $('gate').innerHTML = '<div class="msg bad"><b>打刻ログに <code>ManualTime</code> 列がありません。</b><br>' +
        '過去の勤怠を登録するには、この列が必要です（手入力した時刻を入れる欄です）。<br><br>' +
        'SharePoint の <code>' + esc(KT_LIST.punches) + '</code> リストに、' +
        '<b>1行テキスト</b>の列を <code>ManualTime</code> という名前で追加してください。<br>' +
        '追加したらこのページを再読み込みしてください。</div>';
      return;
    }
    if (!actives.length){
      $('gate').innerHTML = '<div class="msg bad">在籍中の社員が登録されていません。' +
        '先に <a href="./check.html">設定の点検</a> をご確認ください。</div>';
      return;
    }
    IM.empNo = actives[0].Title;
    $('gate').classList.add('hide');
    $('main').classList.remove('hide');
    loadMonth();
  }).catch(function(e){
    $('gate').innerHTML = '<div class="msg bad">読み込みに失敗しました：' + esc(e.message) + '</div>';
  });
}

/* 選んだ社員の打刻と有給を読み込み、表を組み立てる */
function loadMonth(){
  render(true);
  Promise.all([
    ktList('punches'),
    ktList('requests').catch(function(){ return []; })
  ]).then(function(r){
    IM.punches = r[0].filter(function(p){
      return p.Title === IM.empNo && p.Voided !== true &&
             ['出勤','退勤','休憩開始','休憩終了'].indexOf(p.PunchType) >= 0;
    });
    IM.requests = r[1].filter(function(x){
      return x.EmpNo === IM.empNo && x.Status === '承認';
    });
    buildRows();
    render(false);
  }).catch(function(e){
    IM.punches = []; IM.requests = []; buildRows(); render(false);
    note('bad', '読み込みに失敗しました：' + e.message);
  });
}

/* 選んでいる社員 */
function curEmp(){
  return IM.emps.filter(function(e){ return e.Title === IM.empNo; })[0] || {};
}
/* 有給を登録できる相手か（役員・入社日なしは対象外） */
function leaveOk(){
  var e = curEmp();
  return e.EmpType !== '役員' && /^\d{4}-\d{2}-\d{2}$/.test(e.HireDate || '');
}

function buildRows(){
  var mr = ktMonthRange(IM.ym);
  var byDate = ktGroupByDate(IM.punches);
  var lv = {};
  IM.requests.forEach(function(r){ if (r.LeaveDate) lv[r.LeaveDate] = r; });

  IM.rows = [];
  for (var d = mr.from; ktYmdDiffDays(d, mr.to) <= 0; d = ktYmdAddDays(d, 1)){
    var kind   = ktDayKind(d, IM.holidays);
    var future = ktYmdDiffDays(d, ktToday()) > 0;
    var ps     = byDate[d] || [];
    var done   = ps.length > 0;

    // 登録済みの日は、実際に入っている時刻を読み出して表示できるようにする
    var day = done ? ktComputeDay(d, ps, IM.holidays, false, curEmp()) : null;
    var lr  = lv[d] || null;

    IM.rows.push({
      date: d, kind: kind, future: future, done: done,
      punchIds:  ps.map(function(p){ return p._id; }),
      manual:    ps.some(function(p){ return p._manual; }),
      realPunch: ps.some(function(p){ return !p._manual; }),
      savedIn:   day && day.clockIn  ? ktHm(day.clockIn)  : '',
      savedOut:  day && day.clockOut ? ktHm(day.clockOut) : '',
      savedBr:   day && day.breakMin ? String(day.breakMin) : (done ? '0' : ''),
      savedWork: day ? day.workMin : 0,
      savedAlerts: day ? day.alerts : [],
      leaveRec:  lr,
      leaveDone: lr ? (lr.LeaveType || '全日') : '',
      inHm: '', outHm: '',
      // 休憩はほぼ毎日60分なので、はじめから入れておく（休日出勤の日も同じ）。
      // 登録済みの日と、休みとして登録済みの日は空にする。
      brMin: (done || future || lr) ? '' : '60',
      leave: ''
    });
  }
}

function note(cls, msg){
  var el = $('note');
  if (!el) return;
  el.className = 'msg ' + cls;
  el.innerHTML = msg;
}

function render(loading){
  var actives = IM.emps.filter(function(e){ return e.Active === true; });
  var h = '';

  h += '<div class="card"><h2>だれの・いつの分か</h2>';
  h += '<div class="row"><div><label class="f" for="emp">社員</label><select id="emp">' +
    actives.map(function(e){
      return '<option value="' + esc(e.Title) + '"' + (e.Title === IM.empNo ? ' selected' : '') +
             '>' + esc(e.EmpName || e.Title) + '</option>';
    }).join('') + '</select></div></div>';
  h += '<div class="mon" style="margin-top:.8rem">' +
       '<button class="ghost" id="prev">前月</button>' +
       '<span class="m">' + esc(IM.ym) + '</span>' +
       '<button class="ghost" id="next">翌月</button></div>';
  h += '</div>';

  if (loading){
    $('main').innerHTML = h + '<div class="card"><p class="sub" style="margin:0">読み込んでいます…</p></div>';
    bindTop();
    return;
  }

  // まとめて入力
  h += '<div class="card"><h2>まとめて入力</h2>';
  h += '<div class="row">' +
    '<div><label class="f" for="bin">出勤</label><input id="bin" value="08:00" inputmode="numeric"></div>' +
    '<div><label class="f" for="bout">退勤</label><input id="bout" value="17:00" inputmode="numeric"></div>' +
    '<div><label class="f" for="bbr">休憩（分）</label><input id="bbr" value="60" inputmode="numeric"></div>' +
    '</div>';
  h += '<div class="btnrow">' +
    '<button id="fill-wd">平日にまとめて入れる</button>' +
    '<button class="ghost" id="fill-all">休日も含めて入れる</button>' +
    '<button class="ghost" id="clear">入力をすべて消す</button></div>';
  h += '<p class="sub" style="margin:.7rem 0 0">' +
       'まず一括で入れてから、違う日だけ下の表で直すのが早いです。' +
       '既に打刻がある日は自動で飛ばします。</p>';
  h += '</div>';

  // Excel からの貼り付け
  h += '<div class="card"><h2>Excel などから貼り付け</h2>';
  h += '<textarea id="paste" placeholder="1行に「日付　出勤　退勤　休憩分」の順で貼り付けてください&#10;' +
       '例：&#10;2026-07-01\t08:00\t17:30\t60&#10;7/2\t8:00\t17:00&#10;7/3,08:15,18:00,60&#10;7/10\t有給"></textarea>';
  h += '<div class="btnrow"><button class="ghost" id="do-paste">貼り付けた内容を表に反映する</button></div>';
  h += '<p class="sub" style="margin:.7rem 0 0">' +
       'タブ区切り（Excelからのコピー）でもカンマ区切りでも読み取れます。休憩分は省略できます。<br>' +
       '日付の次を「有給」とすると、その日は有給として登録します（例：<code>7/10\t有給</code>）。</p>';
  h += '</div>';

  // 日ごとの表
  h += '<div class="card"><h2>日ごとの入力</h2><div id="note"></div>';
  if (!leaveOk()){
    h += '<div class="msg warn">' + esc(curEmp().EmpName || '') +
         ' さんは有給の対象外です（代休は登録できます）。' +
         (curEmp().EmpType === '役員' ? '（役員のため）'
                                      : '（社員マスタの <code>HireDate</code> が未登録です）') + '</div>';
  }
  h += '<p class="sub" style="margin:0 0 .3rem">' +
       '登録済みの日は、保存されている時刻がそのまま表示されます。' +
       '直したい日は［取消］を押すと入力し直せます。</p>';
  h += '<div class="tw"><table><thead><tr><th>日</th><th>区分</th><th>有給<br>代休</th><th>出勤</th><th>退勤</th>' +
       '<th>休憩<br>（分）</th><th>労働</th><th>状態</th></tr></thead><tbody id="tb">';
  h += rowsHtml();
  h += '</tbody></table></div>';
  h += '<div class="btnrow">' +
    '<button id="save">この内容で登録する</button>' +
    '<span id="cnt" class="sub"></span></div>';
  h += '<div class="bar hide" id="bar"><i></i></div>';
  h += '<div id="result">' + (IM.result ? '<div class="msg ' + IM.result.cls + '">' +
                                          IM.result.html + '</div>' : '') + '</div>';
  h += '</div>';

  // 取り消し
  h += '<div class="card"><h2>この月をまとめてやり直す</h2>' +
    '<p class="sub" style="margin:0 0 .3rem">1日ずつ直す場合は、上の表の［取消］をお使いください。' +
    'ここでは<b>この月に手入力した分だけ</b>をまとめて取り消せます。' +
    'スマホから実際に打刻した記録は消えません。</p>' +
    '<div class="btnrow"><button class="danger" id="undo">この月の手入力を取り消す</button></div></div>';

  $('main').innerHTML = h;
  bindTop();
  bindBody();
  updateCount();
}

var LEAVE_TYPES = ['全日', '午前半休', '午後半休'];   // 有給（対象者のみ）
var COMP_TYPE   = '代休';                            // 代休（全員が対象）

function rowsHtml(){
  var canLeave = leaveOk();
  return IM.rows.map(function(r, i){
    var cls = [];
    if (r.kind) cls.push('hol');
    if (r.done || r.leaveDone) cls.push('done');
    var label = r.kind === 'legal' ? '<span class="badge cau">法定休日</span>'
              : r.kind === 'company' ? '<span class="badge cau">所定休日</span>' : '';
    var saved  = r.done || r.leaveDone;         // 何かしら登録済みの日
    var locked = saved || r.future;
    // 全日の有給を選んだ日は、出退勤の入力欄を閉じる
    var timeDis = (locked || r.leave === '全日' || r.leave === COMP_TYPE) ? ' disabled' : '';
    var lvDis   = locked ? ' disabled' : '';

    // 登録済みの日は、保存されている時刻をそのまま欄に出して確認できるようにする
    var vIn  = r.done ? r.savedIn  : r.inHm;
    var vOut = r.done ? r.savedOut : r.outHm;
    var vBr  = r.done ? r.savedBr  : r.brMin;

    var st = '';
    if (saved) {
      if (r.done) {
        st += r.manual ? '<span class="badge cau">手入力</span> '
                       : '<span class="badge ok">実打刻</span> ';
      }
      if (r.leaveDone) st += '<span class="badge ok">' + esc(r.leaveDone) + '</span> ';
      if (r.savedAlerts && r.savedAlerts.length) {
        st += '<span class="badge no" title="' + esc(r.savedAlerts.join('／')) + '">!</span> ';
      }
      st += '<button class="del" data-del="' + i + '" type="button">取消</button>';
    } else if (r.future) {
      st = '<span class="badge">—</span>';
    }

    // 有給は対象者のみ、代休は誰でも選べる
    var choices = (canLeave ? LEAVE_TYPES : []).concat([COMP_TYPE]);
    var opts = '<option value="">—</option>' + choices.map(function(t){
      return '<option' + (r.leave === t ? ' selected' : '') + '>' + t + '</option>';
    }).join('');

    return '<tr class="' + cls.join(' ') + '" data-i="' + i + '">' +
      '<td>' + esc(ktYmdLabel(r.date)) + '</td>' +
      '<td>' + label + '</td>' +
      '<td><select class="lv" data-k="leave" data-i="' + i + '"' + lvDis + '>' +
        (r.leaveDone ? '<option>' + esc(r.leaveDone) + '</option>' : opts) + '</select></td>' +
      '<td><input data-k="inHm"  data-i="' + i + '" value="' + esc(vIn)  + '" inputmode="numeric" placeholder="8:00"' + timeDis + '></td>' +
      '<td><input data-k="outHm" data-i="' + i + '" value="' + esc(vOut) + '" inputmode="numeric" placeholder="17:00"' + timeDis + '></td>' +
      '<td><input class="br" data-k="brMin" data-i="' + i + '" value="' + esc(vBr) + '" inputmode="numeric" placeholder="60"' + timeDis + '></td>' +
      '<td class="work" data-i="' + i + '">' +
        (r.done && r.savedWork ? ktMinToHm(r.savedWork) : '') + '</td>' +
      '<td class="act">' + st + '</td></tr>';
  }).join('');
}

/* 1日分の入力を検証し、打刻の時刻に変換する */
function parseRow(r){
  if (r.done || r.future || r.leaveDone) return null;
  // 丸1日休む種別は打刻をつくらない
  if (r.leave === '全日' || r.leave === COMP_TYPE) return null;
  var i = ktNormalizeHm(r.inHm), o = ktNormalizeHm(r.outHm);
  if (!r.inHm && !r.outHm) return null;                    // 未入力の日
  if (!i || !o) return { err: true };

  var inMin = +i.split(':')[0] * 60 + +i.split(':')[1];
  var outMin = +o.split(':')[0] * 60 + +o.split(':')[1];
  if (outMin <= inMin) outMin += 1440;                     // 日をまたぐ夜勤
  var br = Math.max(0, Math.min(+r.brMin || 0, outMin - inMin));

  var out = { inMin: inMin, outMin: outMin, brMin: br,
              workMin: (outMin - inMin) - br };
  if (br > 0){
    // 休憩は12:00を基本に、勤務時間内へ収める
    var bs = Math.min(Math.max(720, inMin), outMin - br);
    out.bsMin = bs; out.beMin = bs + br;
  }
  return out;
}

/* 「勤務日の0:00からの分」を ManualTime の文字列にする */
function manualOf(date, min){
  var d = date, m = min;
  while (m >= 1440){ d = ktYmdAddDays(d, 1); m -= 1440; }
  return d + 'T' + ktPad(Math.floor(m / 60)) + ':' + ktPad(m % 60);
}

function updateCount(){
  var n = 0, bad = 0, lv = 0, cp = 0;
  IM.rows.forEach(function(r, i){
    var cell = document.querySelector('.work[data-i="' + i + '"]');
    if (r.leave && !r.leaveDone && !r.done && !r.future) {
      if (r.leave === COMP_TYPE) cp++; else lv++;
    }
    var p = parseRow(r);
    if (!p){
      if (cell) {
        cell.innerHTML = (r.done && r.savedWork) ? ktMinToHm(r.savedWork)
                       : (r.leave === '全日')    ? '<span class="badge ok">有給</span>'
                       : (r.leave === COMP_TYPE) ? '<span class="badge ok">代休</span>' : '';
      }
      return;
    }
    if (p.err){ bad++; if (cell) cell.innerHTML = '<span class="badge no">時刻が不正</span>'; return; }
    n++;
    if (cell) cell.textContent = ktMinToHm(p.workMin);
  });
  var parts = [];
  if (n)  parts.push('勤務 ' + n + '日');
  if (lv) parts.push('有給 ' + lv + '日');
  if (cp) parts.push('代休 ' + cp + '日');
  var c = $('cnt');
  if (c) c.textContent = (parts.length ? parts.join('／') + ' を登録します' : '入力された日がありません') +
                         (bad ? '（' + bad + '日は時刻が読み取れません）' : '');
  var s = $('save');
  if (s) s.disabled = (!n && !lv && !cp) || IM.busy;
}

function bindTop(){
  if ($('emp')) $('emp').onchange = function(){ IM.empNo = this.value; IM.result = null; loadMonth(); };
  if ($('prev')) $('prev').onclick = function(){ IM.ym = ktYm(ktYmdAddMonths(IM.ym + '-01', -1)); IM.result = null; loadMonth(); };
  if ($('next')) $('next').onclick = function(){ IM.ym = ktYm(ktYmdAddMonths(IM.ym + '-01',  1)); IM.result = null; loadMonth(); };
}

function bindBody(){
  bindRowInputs();

  $('fill-wd').onclick  = function(){ fill(false); };
  $('fill-all').onclick = function(){ fill(true); };
  $('clear').onclick = function(){
    IM.rows.forEach(function(r){ r.inHm = r.outHm = r.brMin = ''; });
    redrawBody();
  };
  $('do-paste').onclick = doPaste;
  $('save').onclick = save;
  $('undo').onclick = undo;
}

function redrawBody(){
  $('tb').innerHTML = rowsHtml();
  bindRowInputs();
  updateCount();
}
function bindRowInputs(){
  document.querySelectorAll('#tb input').forEach(function(el){
    el.oninput = function(){
      IM.rows[+el.dataset.i][el.dataset.k] = el.value;
      var p = parseRow(IM.rows[+el.dataset.i]);
      el.classList.toggle('err', !!(p && p.err));
      updateCount();
    };
  });
  document.querySelectorAll('#tb [data-del]').forEach(function(el){
    el.onclick = function(){ undoDay(+el.dataset.del); };
  });
  document.querySelectorAll('#tb select').forEach(function(el){
    el.onchange = function(){
      var r = IM.rows[+el.dataset.i];
      r.leave = el.value;
      // 全日の有給にしたら勤務時間は消す。半休なら残す。
      if (r.leave === '全日' || r.leave === COMP_TYPE){ r.inHm = ''; r.outHm = ''; r.brMin = ''; }
      else if (!r.brMin && !r.kind) r.brMin = '60';
      redrawBody();
    };
  });
}

function fill(includeHolidays){
  var i = ktNormalizeHm($('bin').value), o = ktNormalizeHm($('bout').value);
  if (!i || !o){ note('bad', '出勤・退勤の時刻を <code>8:00</code> のように入れてください。'); return; }
  var br = String(+$('bbr').value || 0);
  var n = 0;
  IM.rows.forEach(function(r){
    if (r.done || r.future) return;
    if (!includeHolidays && r.kind) return;
    r.inHm = i; r.outHm = o; r.brMin = br; n++;
  });
  redrawBody();
  note('good', n + '日に入れました。違う日は表で直してください。');
}

/* Excel などからの貼り付けを表に流し込む */
function doPaste(){
  var txt = $('paste').value || '';
  var lines = txt.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (!lines.length){ note('bad', '貼り付けた内容がありません。'); return; }

  var year = +IM.ym.split('-')[0], mon = +IM.ym.split('-')[1];
  var byDate = {};
  IM.rows.forEach(function(r, i){ byDate[r.date] = i; });

  var ok = 0, ng = [], skip = 0;
  lines.forEach(function(line, ln){
    var c = line.split(/\t|,|\s{2,}/).map(function(x){ return x.trim(); }).filter(function(x){ return x !== ''; });
    if (c.length < 2){ ng.push(ln + 1); return; }

    // 日付は 2026-07-01 / 2026/7/1 / 7/1 / 1 のいずれでも受ける
    var d = null, s = c[0].replace(/[０-９]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
    var m;
    if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))      d = m[1] + '-' + ktPad(+m[2]) + '-' + ktPad(+m[3]);
    else if ((m = s.match(/^(\d{1,2})[-\/](\d{1,2})$/)))            d = year + '-' + ktPad(+m[1]) + '-' + ktPad(+m[2]);
    else if ((m = s.match(/^(\d{1,2})日?$/)))                       d = year + '-' + ktPad(mon) + '-' + ktPad(+m[1]);
    if (d == null || byDate[d] == null){ ng.push(ln + 1); return; }

    var r = IM.rows[byDate[d]];
    if (r.done || r.future || r.leaveDone){ skip++; return; }

    // 2列目が「有給」なら有給として扱う（全日・午前半休・午後半休）
    if (/^(代休|振替休)$/.test(c[1])) { r.leave = COMP_TYPE; r.inHm = r.outHm = r.brMin = ''; ok++; return; }
    if (/^(有給|有休|全休|年休)$/.test(c[1])) { r.leave = '全日'; r.inHm = r.outHm = r.brMin = ''; ok++; return; }
    if (/^午前半休$/.test(c[1]) || /^午後半休$/.test(c[1])) { r.leave = c[1]; ok++; }
    else if (c.length < 3){ ng.push(ln + 1); return; }

    if (c.length >= 3){
      r.inHm = c[1 + (r.leave ? 1 : 0)]; r.outHm = c[2 + (r.leave ? 1 : 0)];
      var b = c[3 + (r.leave ? 1 : 0)];
      r.brMin = b != null ? String(+b || 0) : '60';
      if (!r.leave) ok++;
    }
  });

  redrawBody();
  var msg = ok + '行を表に反映しました。';
  if (skip) msg += '（既に登録済みの' + skip + '行は飛ばしました）';
  if (ng.length) msg += '<br>読み取れなかった行：' + ng.slice(0, 10).join('、') + '行目' +
                        (ng.length > 10 ? ' ほか' + (ng.length - 10) + '行' : '');
  note(ng.length ? 'warn' : 'good', msg);
}

/* 登録 */
var IMPORT_MARK = '過去分の登録';

function save(){
  if (IM.busy) return;
  var jobs = [], leaveJobs = [];
  var emp = curEmp();
  IM.rows.forEach(function(r){
    // 有給は打刻ではなく、承認済みの有給申請として登録する
    if (r.leave && !r.leaveDone && !r.done && !r.future){
      var days = (r.leave === '全日' || r.leave === COMP_TYPE) ? 1 : 0.5;
      leaveJobs.push({
        Title: IM.empNo + '_' + r.date, EmpNo: IM.empNo,
        LeaveDate: r.date, LeaveType: r.leave, Days: days,
        Status: '承認', Reason: IMPORT_MARK,
        ApprovedBy: IM.admin.EmpName || IM.admin.Title, ApprovedDate: ktToday()
      });
    }
  });
  IM.rows.forEach(function(r){
    var p = parseRow(r);
    if (!p || p.err) return;
    var base = {
      Title: IM.empNo, WorkDate: r.date,
      ClientTime: new Date().toISOString(),
      LocationStatus: '手入力',
      SiteName: ''
    };
    function row(type, min){
      var f = {}; Object.keys(base).forEach(function(k){ f[k] = base[k]; });
      f.PunchType = type; f.ManualTime = manualOf(r.date, min);
      return f;
    }
    jobs.push(row('出勤', p.inMin));
    if (p.bsMin != null){ jobs.push(row('休憩開始', p.bsMin)); jobs.push(row('休憩終了', p.beMin)); }
    jobs.push(row('退勤', p.outMin));
  });
  if (!jobs.length && !leaveJobs.length) return;

  IM.busy = true;
  IM.result = null;
  $('save').disabled = true;
  $('bar').classList.remove('hide');
  $('result').innerHTML = '';

  var total = jobs.length + leaveJobs.length;
  var done = 0, failed = 0;
  function tick(){
    done++;
    $('bar').firstElementChild.style.width = Math.round(done / total * 100) + '%';
    $('cnt').textContent = done + ' / ' + total + ' 件';
  }

  // 3件ずつ並行で送る（一気に投げるとSharePoint側で詰まるため）
  var idx = 0;
  function worker(){
    if (idx >= jobs.length) return Promise.resolve();
    var f = jobs[idx++];
    return ktCreate('punches', f)
      .catch(function(){ failed++; })
      .then(function(){ tick(); return worker(); });
  }
  // 有給は件数が少ないので順に送る
  function leaveWorker(){
    return leaveJobs.reduce(function(chain, f){
      return chain.then(function(){
        return ktCreate('requests', f)
          .catch(function(){ failed++; })
          .then(tick);
      });
    }, Promise.resolve());
  }
  Promise.all([worker(), worker(), worker(), leaveWorker()]).then(function(){
    IM.busy = false;
    $('bar').classList.add('hide');
    var days = jobs.filter(function(j){ return j.PunchType === '出勤'; }).length;
    var made = [];
    if (days) made.push('勤務 ' + days + '日');
    var lvN = leaveJobs.filter(function(j){ return j.LeaveType !== COMP_TYPE; }).length;
    var cpN = leaveJobs.length - lvN;
    if (lvN) made.push('有給 ' + lvN + '日');
    if (cpN) made.push('代休 ' + cpN + '日');
    // 結果は状態に持たせる（このあと表を読み直して再描画するため）
    IM.result = failed
      ? { cls:'warn', html:'<b>' + (total - failed) + '件を登録しました。' +
          failed + '件は失敗しました。</b><br>もう一度［この内容で登録する］を押すと、' +
          '登録済みの日は飛ばして残りだけ登録できます。' }
      : { cls:'good', html:'<b>' + made.join('／') + '（' + total + '件）を登録しました。</b><br>' +
          '<a href="./">打刻画面</a> の履歴・有給・管理タブで確認できます。' };
    loadMonth();
  });
}

/* 1日ぶんだけ取り消す。打刻は Voided、有給・代休は取消にする。
   実際に打刻された記録も取り消せるが、確認をはさみ、記録自体は消さず残す。 */
function undoDay(i){
  var r = IM.rows[i];
  if (!r || (!r.done && !r.leaveRec)) return;

  var what = [];
  if (r.punchIds.length) {
    what.push(r.manual ? '手入力の打刻' + r.punchIds.length + '件'
                       : '実際に打刻された記録' + r.punchIds.length + '件');
  }
  if (r.leaveRec) what.push(esc(r.leaveRec.LeaveType || '有給'));

  var warn = r.realPunch
    ? '\n\n※ この日には実際にスマートフォンから打刻された記録が含まれます。' +
      '取り消しても記録自体は残り、あとから確認できます。'
    : '';
  if (!window.confirm(ktYmdLabelFull(r.date) + ' の ' + what.join('と') +
                      'を取り消します。よろしいですか？' + warn)) return;

  var btn = document.querySelector('[data-del="' + i + '"]');
  if (btn) btn.disabled = true;
  var failed = 0;

  r.punchIds.reduce(function(chain, id){
    return chain.then(function(){
      return ktUpdate('punches', id, { Voided: true, VoidReason: '過去の勤怠入力から取消' })
        .catch(function(){ failed++; });
    });
  }, Promise.resolve()).then(function(){
    if (!r.leaveRec) return;
    return ktUpdate('requests', r.leaveRec._id, { Status: '取消' }).catch(function(){ failed++; });
  }).then(function(){
    IM.result = failed
      ? { cls:'warn', html:ktYmdLabel(r.date) + ' の取り消しに失敗した項目があります（' + failed + '件）。' }
      : { cls:'good', html:ktYmdLabel(r.date) + ' を取り消しました。入力し直せます。' };
    loadMonth();
  });
}

/* この月の手入力だけを取り消す（実際の打刻は消さない） */
function undo(){
  var mr = ktMonthRange(IM.ym);
  var inMonth = function(d){
    return ktYmdDiffDays(d, mr.from) >= 0 && ktYmdDiffDays(d, mr.to) <= 0;
  };
  var targets = IM.punches.filter(function(p){ return p._manual && inMonth(p.WorkDate); });
  // 過去分としてこの画面から登録した有給だけを対象にする
  var lvTargets = IM.requests.filter(function(r){
    return r.Reason === IMPORT_MARK && inMonth(r.LeaveDate);
  });
  if (!targets.length && !lvTargets.length){
    IM.result = { cls:'warn', html:'この月に手入力の記録はありません。' };
    render(false);
    return;
  }
  var name = curEmp().EmpName || IM.empNo;
  var what = [];
  if (targets.length)   what.push('打刻 ' + targets.length + '件');
  if (lvTargets.length) what.push('有給 ' + lvTargets.length + '日');
  if (!window.confirm(name + ' さんの ' + IM.ym + ' に手入力した ' + what.join('と') +
                      'を取り消します。よろしいですか？')) return;

  $('undo').disabled = true;
  var failed = 0;
  targets.reduce(function(chain, p){
    return chain.then(function(){
      return ktUpdate('punches', p._id, { Voided: true, VoidReason: '手入力の取り消し' })
        .catch(function(){ failed++; });
    });
  }, Promise.resolve()).then(function(){
    return lvTargets.reduce(function(chain, r){
      return chain.then(function(){
        return ktUpdate('requests', r._id, { Status: '取消' }).catch(function(){ failed++; });
      });
    }, Promise.resolve());
  }).then(function(){
    var n = targets.length + lvTargets.length;
    IM.result = failed
      ? { cls:'warn', html:(n - failed) + '件を取り消しました（' + failed + '件は失敗）。' }
      : { cls:'good', html:n + '件を取り消しました。同じ月をもう一度入力できます。' };
    loadMonth();
  });
}
