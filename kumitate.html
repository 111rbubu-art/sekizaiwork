<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>組み立て（墓所の 3D）</title>
<style>
:root{--fg:#1d1d1f;--sub:#6b6b70;--line:#d9d9de;--acc:#2f5d8a;--navy:#1f3b5c;--org:#e07a1f;--bg:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
.top{flex:none;min-height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
.top b{font-size:16px;white-space:nowrap}
.top .nm{background:transparent;border:1px solid #5b7a9c;border-radius:6px;color:#fff;padding:5px 8px;width:220px;font:inherit}
.top .nm::placeholder{color:#a9bcd2}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 11px;font-weight:700;white-space:nowrap}
.btn.g{background:var(--acc);color:#fff;border:1px solid #8fb0d0}
.seg{display:flex;border:1px solid #8fb0d0;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:7px 10px}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.main{flex:1;display:flex;min-height:0}
.left{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px;overflow:auto}
.left h4{margin:10px 0 6px;font-size:12px;color:var(--sub)}
.it{display:flex;align-items:center;width:100%;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fafafa;text-align:left;color:var(--fg)}
.it.on{border-color:var(--org);background:#fff4ea;font-weight:700}
.tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:#e6e8ec;color:#555;font-weight:400}
.c{flex:1;position:relative;min-width:0}
#v{position:absolute;inset:0}
.badge{position:absolute;top:10px;right:10px;border-radius:20px;padding:6px 14px;font-weight:700;max-width:calc(100% - 20px)}
.badge.ok{background:#dff3e4;color:#1d7a3a;border:1px solid #9fd3ae}
.badge.ng{background:#fde8e8;color:#b42020;border:1px solid #f2a7a7;cursor:pointer}
.hitlist{position:absolute;top:46px;right:10px;background:#fff;border:1px solid #f2a7a7;border-radius:10px;padding:8px 12px;line-height:1.7;display:none;max-width:calc(100% - 20px);max-height:40%;overflow:auto}
.site{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center}
.site b{grid-column:1/-1}
.chip{width:72px;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;font:inherit;font-weight:700;color:var(--navy);text-align:right;background:#fff}
.chip.l{border-color:#8fb0d0}
.chip:focus{outline:none;border-color:var(--org);background:#fff4ea}
.right{width:320px;flex:none;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}
.right h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f2}
.row .k{color:var(--sub)}
.muted{color:var(--sub);font-size:11px;line-height:1.5}
.box{margin-top:12px;background:#f5f7fa;border-radius:10px;padding:10px}
.box .row{border-color:#e3e6ea}
.tot{font-size:17px;font-weight:700;color:var(--navy)}
.lk{color:var(--acc);font-weight:700;background:none;border:0;padding:0}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;max-width:170px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #0002}
.plist .row{cursor:pointer}
.plist .row.on{background:#fff4ea}
.plist .row.hit .k{color:#b42020}
.err{color:#b42020}
.auto{grid-column:1/-1;background:var(--org);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:700}
.ad{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;background:#fff}
.ad.cur{border-color:var(--org)}
.ad .h{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.ad .lv0{color:#1f7a3a}.ad .lv1{color:#a85b00}.ad .lv2{color:#b42020}
.ad ul{margin:4px 0 4px 16px;padding:0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* 部材構成（Fusion の ブラウザの 形）：3D の 上に 背景なしで 置く。名前の 所だけ 押せる（すき間は 3D を 回せる） */
.tree{position:absolute;left:10px;top:10px;width:250px;max-height:calc(100% - 20px);overflow-x:hidden;overflow-y:auto;pointer-events:none;font-size:12.5px;user-select:none}
.tree .bh,.tree .n{pointer-events:auto}
.tree .bh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-weight:700;background:rgba(242,243,245,.85);border:1px solid #c9ccd2;border-radius:4px;margin-bottom:4px;cursor:pointer;width:max-content;min-width:160px;gap:12px}
.tree .bh span:last-child{color:#888;font-weight:400}
.tree .n{display:flex;align-items:center;gap:4px;padding:2px 4px;white-space:nowrap;width:max-content;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:pointer}
.tree .nm{background:rgba(255,255,255,.55);border-radius:3px;padding:0 3px}
.tree .n.on .nm{background:#cfe3fa;outline:1px solid #6aa0de}
.tree .n.off .nm{color:#9a9a9a}
.tree .n.hit .nm{color:#b42020}
.tree .ar{width:12px;color:#555;font-size:10px;text-align:center}
.tree .ey{width:18px;text-align:center;color:#444}
.tree .ey.off{color:#aaa}
.tree .ic{width:16px;text-align:center}
.tree.min .n{display:none}
.fx{width:100%;border-collapse:collapse;font-size:12px}
.fx th{font-weight:400;color:var(--sub);text-align:center;padding:2px}
.fx td{padding:3px 2px;border-bottom:1px solid #e3e6ea;text-align:center}
.fx td:first-child{text-align:left}
.fx .chip{width:58px;padding:2px 4px}
.fx input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.fx .mv{color:var(--sub);font-size:10.5px;white-space:nowrap}
.fx .ps{font-size:10.5px;padding:1px 2px;max-width:none}
.fx .pk{cursor:pointer;color:var(--acc)}
.dis{color:#aaa}
.go{display:block;width:100%;margin-top:10px;background:var(--org);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:700}
.pick{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px;background:#fff;text-align:left;color:var(--fg)}
.pick.on{border-color:var(--org);background:#fff4ea}
@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%}
  .main{flex-direction:column}
  .left{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .left > div{min-width:150px}
  .left h4{margin:2px 0 4px}
  .left .hint,.left > div:first-child{display:none}
  .c{height:62vh;flex:none}
  .right{width:auto;border-left:0}
  .top .nm{width:150px}
  .tree{width:200px}
}
</style>
</head>
<body>
<div class="top">
  <b>🏯 組み立て</b>
  <input class="nm" id="nm" placeholder="名前（例：和型8寸 案1）">
  <span class="sp"></span>
  <div class="seg" id="seg"><button data-v="3d" class="on">3D</button><button data-v="front">正面</button><button data-v="top">平面</button></div>
  <button class="btn g" id="bPng">🖼 画像</button>
  <button class="btn g" id="bOpen">📂 開く</button>
  <button class="btn" id="bSave">💾 保存</button>
</div>
<div class="main">
  <div class="left" id="left"></div>
  <div class="c">
    <div id="v"></div>
    <div class="badge ok" id="badge">✓ 干渉 なし</div>
    <div class="hitlist" id="hitlist"></div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="right">
    <div id="selBox"></div>
    <div class="box" id="adBox" style="display:none"></div>
    <div class="box" id="estBox"></div>
    <div class="box"><details><summary>部材の 一覧（才数）</summary><div class="plist" id="plist"></div></details></div>
    <div class="muted" style="margin-top:10px" id="ver"></div>
  </div>
</div>
<input type="file" id="fOpen" accept=".json,application/json" hidden>
<input type="file" id="fPart" accept=".json,application/json" hidden>
<input type="file" id="fTanka" accept=".json,application/json" hidden>
<input type="file" id="fSet" accept=".json,application/json" hidden>
<script src="buzai-engine.js?v=0.8.3"></script>
<script src="kumitate-data.js"></script>
<script src="kumitate-engine.js?v=0.5.1"></script>
<script>
var APP_VER = 'v0.5.1';
// 部材の データ：見本（kumitate-data.js）か、読んだ 旧シミュレーターの 保存ファイル
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var DATA0 = lsGet('kumitate.data') || window.KUMITATE_DATA;
// セット（図面から 読んだ 石塔・外柵。buzai-set/1）。SharePoint の 部材ライブラリ/セット が 元。この 端末にも 覚える（つながらない ときも 使える）
var SETS = lsGet('kumitate.sets') || [];
var DATA = KM.addSets(DATA0, SETS);
function setsChanged(){ lsSet('kumitate.sets', SETS); DATA = KM.addSets(DATA0, SETS); }
var TANKA = lsGet('kumitate.tanka');   // { stones:[], estimate:{} }（公開の 場所に 置かない ため ファイルから 読む）
var ST = lsGet('kumitate.state');
if (!ST || ST.schema !== 'kumitate/1') ST = KM.newState(DATA);
ST.shapes = ST.shapes || {};
var SEL = null, RES = null, V3 = null;
var KLABEL = { tower:'石塔', fence:'外柵', boshi:'墓誌', toba:'塔婆立', crypt:'納骨室' };
var GRAY = { tower:'#4a4d52', fence:'#9aa0a6', boshi:'#5a5d62', crypt:'#b8b2a6' };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function yen(n){ return '¥ ' + Math.round(n).toLocaleString(); }
function f2(n){ return (Math.round(n * 100) / 100).toFixed(2); }

function stoneOf(g){ if (!TANKA || !TANKA.stones || !TANKA.stones.length) return null; return TANKA.stones.filter(function(s){ return s.id === ST.stone[g]; })[0] || TANKA.stones[0]; }
function groupOf(p){ return p.kind === 'boshi' ? 'boshi' : (p.kind === 'crypt' || p.cg === 'crypt') ? 'crypt' : p.cg === 'tower' ? 'tower' : 'fence'; }
function colorOf(k){ var p = RES.parts[k], g = groupOf(p); if (g === 'crypt') return GRAY.crypt; var s = stoneOf(g); return s && s.hex ? s.hex : GRAY[g]; }

function renderLeft(){
  var h = '<div style="font-weight:700">部材を 置く</div>';
  KM.KINDS.forEach(function(K){
    var vs = KM.variants(DATA, K.k), keys = Object.keys(vs);
    h += '<div><h4>' + KLABEL[K.k] + '</h4>';
    if (keys.indexOf('none') < 0) h += '<button class="it' + (!ST.sel[K.k] ? ' on' : '') + '" data-k="' + K.k + '" data-v="">なし</button>';
    keys.forEach(function(vk){
      var n = Object.keys(vs[vk].parts || {}).length, isSet = !!vs[vk].set;
      h += '<button class="it' + (ST.sel[K.k] === vk ? ' on' : '') + '" data-k="' + K.k + '" data-v="' + esc(vk) + '">' + (isSet ? '🧱 ' : '') + esc(vs[vk].label || vk) +
        (n ? '<span class="tag"' + (isSet ? ' style="background:#dff3e4;color:#1d7a3a"' : '') + '>' + (isSet ? 'セット ' : '箱 ') + n + '</span>' : '') + '</button>';
    });
    if (K.k === 'tower') {
      h += '<button class="it" id="bSetFile">🧱 セットを 読む（.json）</button>';
      if (spHost()) h += '<button class="it" id="bSetSp">☁️ SP の セットを 読み直す</button>';
    }
    h += '</div>';
  });
  h += '<div><h4>形の ある 部材</h4>';
  partChoices().forEach(function(c, i){
    var on = Object.keys(ST.shapes).some(function(k){ return RES && RES.boxes[k] && ST.shapes[k].id === c.def.id && ST.shapes[k].__from === c.from; });
    h += '<button class="it' + (on ? ' on' : '') + '" data-part="' + i + '">🏺 ' + esc(c.def.name || c.def.id) + '<span class="tag" style="background:#dff3e4;color:#1d7a3a">' + esc(c.tag) + '</span></button>';
  });
  h += '<button class="it" id="bPartFile">📂 部材を 読む（.json）</button></div>';
  h += '<div class="muted hint" style="margin-top:10px">' + (spHost() ? '☁️ SharePoint と つながって います（部材ライブラリ/セット）' : 'SharePoint の セットは、業務アプリ →［📐 図面］→［🧊 部材設計］→［🏯 組み立て］で 開くと 使えます') + '</div>';
  h += '<div class="muted hint" style="margin-top:10px">「セット」＝図面から 読んだ 石塔・外柵（部材ごとに 形が ある）。「箱」＝旧シミュレーターの 寸法を 箱で 取り込んだ もの。「形の ある 部材」を 押すと、同じ 名前の 石（香炉 なら 香炉）が その 形に なる。石を 選んで から 押すと その 石に 入る</div>';
  $('left').innerHTML = h;
}
// 形の ある 部材の 候補：見本（香炉 1 号）／図面アプリで いま 作って いる 部材（同じ サイトの localStorage）／読んだ ファイル
var LOADED = lsGet('kumitate.parts') || [];
function partChoices(){
  var out = [{ def:BZ_KORO, from:'mihon', tag:'見本' }], z = lsGet('zumen.part');
  if (z && z.schema === 'buzai/1') out.unshift({ def:z, from:'zumen', tag:'図面アプリ' });
  LOADED.forEach(function(d){ out.push({ def:d, from:'file', tag:'読んだ' }); });
  return out;
}
function targetFor(def){
  if (isKey(SEL)) return SEL;
  var cat = def.category || '', ks = Object.keys(RES.boxes).filter(function(k){ var n = RES.parts[k].name || ''; return cat && n.indexOf(cat) >= 0; });
  return ks[0] || null;
}
function placePart(c){
  var k = targetFor(c.def);
  if (!k) { alert('「' + (c.def.category || c.def.name) + '」の 石が ありません。3D で 入れたい 石を 押して から もう一度 押して ください'); return; }
  var d = JSON.parse(JSON.stringify(c.def)); d.__from = c.from; d.__set = RES.parts[k].setId || ''; // どの 石に 入れたか（セットか どうか）
  ST.shapes[k] = d; delete ST.over[k]; SEL = k; renderLeft(); run();
}
$('fPart').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    if (j.schema !== 'buzai/1') { alert('部材の ファイル（buzai/1）では ありません'); return; }
    LOADED = LOADED.filter(function(d){ return d.id !== j.id; }); LOADED.push(j); lsSet('kumitate.parts', LOADED);
    placePart({ def:j, from:'file' });
  });
};
$('left').addEventListener('click', function(e){
  if (e.target.closest('#bPartFile')) { $('fPart').click(); return; }
  if (e.target.closest('#bSetFile')) { $('fSet').click(); return; }
  if (e.target.closest('#bSetSp')) { spLoadSets(true); return; }
  var pb = e.target.closest('[data-part]'); if (pb) { placePart(partChoices()[+pb.dataset.part]); return; }
  var b = e.target.closest('.it'); if (!b) return;
  ST.sel[b.dataset.k] = b.dataset.v; SEL = null; renderLeft(); run(true);
});

// ── セット：読む・SharePoint ──
// SharePoint の 読み書きは 業務アプリの 関数（*FromTekkyo）で。組み立ては 図面アプリから 開く ので、開いた 窓を さかのぼって 探す
var SET_DIR = '/業務アプリ/部材ライブラリ/セット';
function spHost(){
  var w = window.opener;
  for (var i = 0; i < 3 && w; i++) {
    try { if (!w.closed && w.listItemsInFolderPassFromTekkyo && w.downloadJsonFromFolderPassFromTekkyo && w.uploadJsonToFolderPassFromTekkyo) return w; w = w.opener; } catch (e) { return null; }
  }
  return null;
}
function putSet(S, keepSel){
  SETS = SETS.filter(function(x){ return x.id !== S.id; }); SETS.push(S); setsChanged();
  if (!keepSel) { ST.sel[S.kind] = S.id; SEL = null; }
}
function checkSet(j){
  if (!j || j.schema !== 'buzai-set/1') return 'セットの ファイル（buzai-set/1）では ありません';
  if (!j.id || !j.parts || !j.parts.length || !j.size) return 'セットの 中身（部材・大きさ）が ありません';
  if (!KM.KINDS.some(function(K){ return K.k === j.kind; })) return '種類（kind）が わかりません：' + j.kind;
  return '';
}
function spSaveSet(S){
  var w = spHost(); if (!w) return Promise.resolve(false);
  var d = JSON.parse(JSON.stringify(S)); d.version = (d.version || 0) + 1; d.savedAt = new Date().toISOString();
  var txt = JSON.stringify(d);
  return w.uploadJsonToFolderPassFromTekkyo(txt, d.id + '.json', SET_DIR).then(function(){
    return w.uploadJsonToFolderPassFromTekkyo(txt, d.id + '_v' + d.version + '.json', SET_DIR + '/履歴');
  }).then(function(){ putSet(d, true); renderLeft(); run(); alert('SharePoint に 保存しました（版 ' + d.version + '）\n' + SET_DIR + '/' + d.id + '.json'); return true; })
    .catch(function(e){ alert('SharePoint に 保存 できませんでした\n' + (e && e.message || e)); return false; });
}
// SharePoint の セットを ぜんぶ 読む（この 端末にも 覚える）
function spLoadSets(say){
  var w = spHost(); if (!w) return;
  w.listItemsInFolderPassFromTekkyo(SET_DIR).then(function(list){
    var files = (list || []).filter(function(it){ return !it.folder && /\.json$/i.test(it.name || ''); });
    return Promise.all(files.map(function(it){ return w.downloadJsonFromFolderPassFromTekkyo(SET_DIR, it.name).then(function(t){ try { return JSON.parse(t); } catch (e) { return null; } }).catch(function(){ return null; }); }));
  }).then(function(js){
    var n = 0; (js || []).forEach(function(j){ if (j && !checkSet(j)) { SETS = SETS.filter(function(x){ return x.id !== j.id; }); SETS.push(j); n++; } });
    setsChanged(); renderLeft(); run(true);
    if (say) alert('SharePoint の セットを ' + n + ' 件 読みました');
  }).catch(function(e){ if (say) alert('SharePoint の セットを 読めませんでした\n' + (e && e.message || e)); });
}
$('fSet').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    var m = checkSet(j); if (m) { alert(m); return; }
    putSet(j); renderLeft(); run(true);
    if (spHost() && confirm('「' + j.name + '」を SharePoint の 部材ライブラリ（セット）に 保存しますか？\n保存すると ほかの 人・ほかの 端末でも 使えます')) spSaveSet(j);
  });
};

// ── 選ぶ もの（SEL）：部材の 鍵、'#site'（敷地）、'#k:fence' など（種類 ぜんぶ）。null は 敷地と 同じ ──
function isKey(k){ return !!k && k[0] !== '#'; }
ST.fit = ST.fit || {}; ST.hide = ST.hide || {};
function kindOf(k){ var m = /^#k:(\w+)$/.exec(k || ''); return m ? m[1] : ''; }
// 3D に 出す 答え（👁 で かくした 部材は 抜く。干渉の 判断は かくしても そのまま）
function viewRes(){
  var b = {}; Object.keys(RES.boxes).forEach(function(k){ if (!ST.hide[k]) b[k] = RES.boxes[k]; });
  return { parts:RES.parts, boxes:b, hits:RES.hits.filter(function(h){ return !ST.hide[h.a] && !ST.hide[h.b]; }) };
}
function sel3d(){
  if (isKey(SEL)) return SEL;
  var kd = kindOf(SEL); if (!kd) return null;
  var o = {}; Object.keys(RES.boxes).forEach(function(k){ if (RES.parts[k].kind === kd) o[k] = 1; }); return o;
}
function draw(refit){ if (V3) V3.update(viewRes(), colorOf, sel3d(), ST.hide['#site'] ? null : ST.site, refit); }

function run(refit){
  RES = KM.compute(DATA, ST);
  if (isKey(SEL) && !RES.boxes[SEL]) SEL = null;
  if (kindOf(SEL) && !Object.keys(RES.boxes).some(function(k){ return RES.parts[k].kind === kindOf(SEL); })) SEL = null;
  draw(refit);
  var b = $('badge');

    h += '<div class="row"><span class="k">形</span><span>🏺 ' + esc(sh.name) + '</span></div>';
    if (pr || pt) h += '<div class="row"><span class="k">加工・既製品</span><span style="text-align:right">' + pr + (pt ? '<br>' + pt : '') + '</span></div>';
    h += '<div class="row"><button class="lk" id="bZumen">🧊 図面アプリで 形を 直す</button><button class="lk" id="bUnshape">箱に 戻す</button></div>';
  } else if (p.shape) h += '<div class="row"><span class="k">形</span><span>図面から（' + esc(p.shape.id || p.shape.name || '') + '）</span></div>';
  h += partFitHtml(SEL);
  h += swapHtml(p);
  h += '<div class="muted" style="margin-top:6px">数字を 変えると、上に のる 石・つながる 石も ついてくる。手で 変えた 寸法は ノウハウ式より 優先</div>';
  return h;
}
function renderSel(){
  var kd = kindOf(SEL), h;
  if (isKey(SEL) && RES.parts[SEL]) h = partHtml();
  else if (kd === 'fence' && fenceV()) h = fenceHtml(fenceV());
  else if (kd) h = kindHtml(kd);
  else h = siteHtml();
  $('selBox').innerHTML = h;
}
// 敷地・外柵の「いま」：打つ あいだは 3D だけ 直す（右の 欄を 作り直すと 打てなく なる）。決めたら（change）ぜんぶ
function quick(){ RES = KM.compute(DATA, ST); draw(); renderTree(); lsSet('kumitate.state', ST); }
$('selBox').addEventListener('change', function(e){
  var t = e.target, d = t.dataset;
  if (t.tagName === 'SELECT' && d.g) { ST.stone[d.g] = t.value; run(); return; }
  if (d.site) { var v = parseFloat(t.value); if (v > 0) ST.site[d.site] = v; if (AD) autoRun(true); else run(); return; }
  if (d.fc) { var v2 = parseFloat(t.value), fv = fenceV(); if (fv && v2 > 0) { var c = KM.fitCur(fv.set, ST); c[d.fc] = v2; ST.fit[fv.set.id] = c; } AD = null; renderAuto(); run(); return; }
  var S;
  if (d.fa && (S = fenceS())) { S.fit[d.fa].auto = t.checked; return fitChanged(); }
  if (d.fr && (S = fenceS())) { var a = d.fr.split('.'), x = parseFloat(t.value); if (isFinite(x)) S.fit[a[0]][a[1]] = x; return fitChanged(); }
  if (d.pa && (S = fenceS())) { var e2 = d.pa.split('.'); S.fit.parts[e2[0]][e2[1]] = t.value; return fitChanged(); }
  if (d.pf && (S = fenceS())) { var b = d.pf.split('.'); S.fit.parts[b[0]][b[1]] = t.checked; return fitChanged(); }
  if (d.pr && (S = fenceS())) { var c3 = d.pr.split('.'), y = parseFloat(t.value), o = S.fit.parts[c3[0]][c3[1]];
    if (isFinite(y)) o[c3[2]] = y; else delete o[c3[2]]; return fitChanged(); }
});
function fitChanged(){ setsChanged(); run(); }
$('selBox').addEventListener('input', function(e){
  var t = e.target, d = t.dataset;
  if (d.site) { var v = parseFloat(t.value); if (v > 0) { ST.site[d.site] = v; quick(); } return; }
  if (d.fc) { var v2 = parseFloat(t.value), fv = fenceV(); if (fv && v2 > 0) { var c = KM.fitCur(fv.set, ST); c[d.fc] = v2; ST.fit[fv.set.id] = c; quick(); } return; }
  if (!d.f || !isKey(SEL)) return;
  var v3 = parseFloat(t.value); if (!(v3 > 0)) return;
  var sh = ST.shapes[SEL] && RES.parts[SEL] && RES.parts[SEL].shape === ST.shapes[SEL] ? ST.shapes[SEL] : null;
  if (sh) { var id = { w:'W', d:'D', h:'H' }[d.f]; if (sh.params[id]) sh.params[id].value = v3; }
  else { ST.over[SEL] = ST.over[SEL] || {}; ST.over[SEL][d.f] = v3; }
  RES = KM.compute(DATA, ST); draw(); renderEst();
  var q = RES.parts[SEL]; if (q && $('selSai')) $('selSai').textContent = f2(KM.sai(q.w, q.d, q.h)) + ' 才'; renderList(); lsSet('kumitate.state', ST);
});
$('selBox').addEventListener('click', function(e){
  var t = e.target, id = t.closest('button') ? t.closest('button').id : t.id;
  if (id === 'bAuto') { autoRun(true); return; }
  if (id === 'bReset') { delete ST.over[SEL]; run(); return; }
  if (id === 'bUnshape' || id === 'bUnshape2') { delete ST.shapes[SEL]; renderLeft(); run(); return; }
  if (id === 'bPartFile2') { $('fPart').click(); return; }
  if (id === 'bSetSave') { var S = fenceS(); if (S) spSaveSet(S); return; }
  if (id === 'bSetDl') { var S2 = fenceS(); if (!S2) return; var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S2, null, 1)], { type:'application/json' })); a.download = S2.id + '.json'; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000); return; }
  var pb = t.closest('[data-part]'); if (pb) { placePart(partChoices()[+pb.dataset.part]); return; }
  var pk = t.closest('[data-pk]'); if (pk) { pick(pk.dataset.pk); return; }
  var sl = t.closest('[data-sel]'); if (sl) { SEL = sl.dataset.sel; run(); return; }
  if (id === 'bZumen') { // 図面アプリの 部材設計は いまの 部材（zumen.part）を 開く
    var d = JSON.parse(JSON.stringify(ST.shapes[SEL])); delete d.__from; lsSet('zumen.part', d);
    alert('図面アプリを 開きます。上の［🧊 部材設計］を 押すと この 形が 出ます。直したら 組み立てを 開き直し、左の「図面アプリ」の 部材を 押して ください');
    window.open('zumen.html', 'zumen');
  }
});

function renderEst(){
  var E = KM.estimate(RES, ST, TANKA), s = E.sai, h = '<div style="font-weight:700;margin-bottom:4px">才数と 見積（その場で 変わる）</div>';
  h += '<div class="row"><span class="k">才数</span><span>石塔 ' + f2(s.tower) + '・外柵 ' + f2(s.fence) + (s.boshi ? '・墓誌 ' + f2(s.boshi) : '') + ' 才</span></div>';
  if (!E.ok) {
    h += '<div class="muted" style="margin:6px 0">単価が まだ 入って いません。旧シミュレーターの 保存ファイル（gravestone-project.json）か 単価ファイルを 読むと 金額が 出ます</div><button class="btn g" id="bTanka">💰 単価を 読む</button>';
  } else {
    var t = E.tower;
    h += '<details><summary class="row" style="display:flex"><span>石塔 小計</span><span>' + yen(t.subtotal) + '</span></summary>' +
      '<div class="row"><span class="k">石材費（' + f2(s.tower) + '才 × ' + yen(t.stU) + '）</span><span>' + yen(t.stone) + '</span></div>' +
      '<div class="row"><span class="k">金具</span><span>' + yen(t.kin) + '</span></div><div class="row"><span class="k">運搬</span><span>' + yen(t.hakobi) + '</span></div>' +
      '<div class="row"><span class="k">設計</span><span>' + yen(t.sekkei) + '</span></div><div class="row"><span class="k">据付</span><span>' + yen(t.suitsuke) + '</span></div></details>';
    if (E.fence) { var f = E.fence;
      h += '<details><summary class="row" style="display:flex"><span>外柵 小計</span><span>' + yen(f.subtotal) + '</span></summary>' +
        '<div class="row"><span class="k">石材費（' + f2(s.fence) + '才 × ' + yen(f.stU) + '）</span><span>' + yen(f.stone) + '</span></div>' +
        '<div class="row"><span class="k">金具</span><span>' + yen(f.kin) + '</span></div><div class="row"><span class="k">据付</span><span>' + yen(f.suitsuke) + '</span></div>' +
        '<div class="row"><span class="k">残土処分</span><span>' + yen(f.zando) + '</span></div></details>'; }
    if (E.boshi) h += '<div class="row"><span>墓誌（石材）</span><span>' + yen(E.boshi.subtotal) + '</span></div>';
    h += '<div class="row"><span>合計（税別）</span><span class="tot">' + yen(E.total) + '</span></div>';
    h += '<div class="muted">彫刻・耐震・コーティングは まだ 入れて いません。<button class="lk" id="bTanka">単価を 読み直す</button></div>';
  }
  if (RES.errs.length) h += '<div class="err muted" style="margin-top:6px">読めない 式：' + RES.errs.slice(0, 3).map(function(x){ return esc(x.expr) + '（' + esc(x.msg) + '）'; }).join('、') + '</div>';
  $('estBox').innerHTML = h;
}
$('estBox').addEventListener('click', function(e){ if (e.target.id === 'bTanka') $('fTanka').click(); });

function renderList(){
  var hit = {}; RES.hits.forEach(function(x){ hit[x.a] = hit[x.b] = 1; });
  $('plist').innerHTML = Object.keys(RES.boxes).map(function(k){ var p = RES.parts[k];
    return '<div class="row' + (k === SEL ? ' on' : '') + (hit[k] ? ' hit' : '') + '" data-k="' + esc(k) + '"><span class="k">' + esc(p.name) + '</span><span>' + p.w + '×' + p.d + '×' + p.h + '　' + f2(KM.sai(p.w, p.d, p.h)) + '</span></div>'; }).join('');
}
$('plist').addEventListener('click', function(e){ var r = e.target.closest('.row'); if (r) pick(r.dataset.k); });

// 単価・旧シミュレーターの 保存ファイルを 読む
function readJson(file, cb){ var fr = new FileReader(); fr.onload = function(){ try { cb(JSON.parse(fr.result)); } catch (e) { alert('読めませんでした：' + e.message); } }; fr.readAsText(file); }
$('fTanka').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    var stones = j.stones || j.stoneMaster, est = j.estimate || j.estimateSettings;
    if (!stones || !est) { alert('単価（石材と 見積の 設定）が 入って いない ファイルです'); return; }
    TANKA = { stones:stones, estimate:est }; lsSet('kumitate.tanka', TANKA);
    if (j.partsData && j.knowhow && confirm('このファイルには 部材・ノウハウ式・基準点も 入って います。組み立ての 部材も この ファイルの ものに しますか？')) {
      DATA0 = { partsData:j.partsData, knowhow:j.knowhow, anchors:j.anchors || {} }; lsSet('kumitate.data', DATA0); DATA = KM.addSets(DATA0, SETS); renderLeft();
    }
    run();
  });
};
// 保存・開く（kumitate/1）
$('nm').value = ST.name || '';
$('nm').oninput = function(){ ST.name = this.value; lsSet('kumitate.state', ST); };
$('bSave').onclick = function(){
  var txt = JSON.stringify(ST, null, 1), d = new Date(), ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'application/json' }));
  a.download = 'kumitate_' + (ST.name ? ST.name.replace(/[\\/:*?"<>|\s]+/g, '_') + '_' : '') + ds + '.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
};
$('bOpen').onclick = function(){ $('fOpen').click(); };
$('fOpen').onchange = function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  readJson(f, function(j){
    if (j.schema === 'kumitate/1') { ST = j; ST.over = ST.over || {}; ST.shapes = ST.shapes || {}; ST.stone = ST.stone || {}; ST.fit = ST.fit || {}; ST.hide = ST.hide || {}; $('nm').value = ST.name || ''; SEL = null; renderLeft(); run(true); return; }
    if (j.partsData || j.stoneMaster) { var dt = new DataTransfer(); dt.items.add(f); $('fTanka').files = dt.files; $('fTanka').onchange(); return; }
    alert('組み立ての ファイル（kumitate_….json）では ありません');
  });
};
$('bPng').onclick = function(){ if (!V3) return; var a = document.createElement('a'); a.href = V3.png(); a.download = 'kumitate_' + (ST.name || '3d') + '.png'; a.click(); };
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !V3) return;
  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); }); V3.fit(b.dataset.v);
});
$('ver').textContent = '組み立て ' + APP_VER + '（部材は ' + (DATA0 === window.KUMITATE_DATA ? '見本' : '読んだ ファイル') + (SETS.length ? '・セット ' + SETS.length : '') + '）';

if (ST.sel.tower && !KM.variants(DATA, 'tower')[ST.sel.tower]) ST.sel.tower = KM.newState(DATA).sel.tower;
RES = KM.compute(DATA, ST); renderLeft(); run();
spLoadSets(false);
import('./kumitate-3d.js?v=0.7').then(function(m){
  V3 = m.create($('v'), pick);
  draw();
  window.__ready = true;
}).catch(function(e){ $('v').innerHTML = '<div class="muted" style="padding:20px">3D を 開けませんでした：' + esc(e.message) + '</div>'; window.__ready = true; });
</script>
</body>
</html>
