<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>組み立て（墓所の 3D）</title>
<style>
:root{--fg:#1d1d1f;--sub:#6b6b70;--line:#d9d9de;--acc:#2f5d8a;--navy:#1f3b5c;--org:#e07a1f;--bg:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
.top{flex:none;min-height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-wrap:wrap}
.top b{font-size:16px;white-space:nowrap}
.top .nm{background:transparent;border:1px solid #5b7a9c;border-radius:6px;color:#fff;padding:5px 8px;width:220px;font:inherit}
.top .nm::placeholder{color:#a9bcd2}
.sp{flex:1}
.btn{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 11px;font-weight:700;white-space:nowrap}
.btn.g{background:var(--acc);color:#fff;border:1px solid #8fb0d0}
.seg{display:flex;border:1px solid #8fb0d0;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:7px 10px}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.main{flex:1;display:flex;min-height:0}
.left{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px;overflow:auto}
.left h4{margin:10px 0 6px;font-size:12px;color:var(--sub)}
.it{display:flex;align-items:center;width:100%;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#fafafa;text-align:left;color:var(--fg)}
.it.on{border-color:var(--org);background:#fff4ea;font-weight:700}
.tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:9px;background:#e6e8ec;color:#555;font-weight:400}
.c{flex:1;position:relative;min-width:0}
#v{position:absolute;inset:0}
/* 直す ための 案内（目地・拝石）は 3D の 右上（右の 欄の 部材の 設定と まぎれない ように） */
.fixes{position:absolute;top:46px;right:10px;width:300px;max-width:calc(100% - 20px);max-height:calc(100% - 56px);overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.fixes>*{pointer-events:auto}
.btn:disabled,.lk:disabled{opacity:.45;cursor:default}
/* 右クリックの メニュー・大きさを 変更・変えた あとの アラート（v0.8.23） */
#ctx{position:fixed;z-index:80;display:none;background:#fff;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.28);min-width:190px;padding:6px 0;font-size:13px}
#ctx .h{padding:4px 14px 8px;color:#888;font-size:12px;border-bottom:1px solid #eee}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;font:inherit;color:var(--fg);cursor:pointer}
#ctx button:hover{background:#e8f0ff}
#szBox{position:absolute;left:10px;bottom:10px;width:260px;max-width:calc(100% - 20px);margin:0;background:rgba(255,255,255,.97);box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:6}
#szBox .szr{display:flex;align-items:center;gap:6px;margin:5px 0}
#szBox .szr .k{width:36px;color:var(--sub)}
#szBox input{width:72px;font-weight:700;font-size:15px;padding:3px 6px;border:2px solid #1f9d55;border-radius:6px}
#szSt{margin-top:6px;line-height:1.6}
#alertBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;display:none;gap:10px;align-items:center;background:#b42020;color:#fff;border-radius:10px;padding:8px 12px;max-width:min(720px,calc(100% - 340px));box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px}
#alertBar .al{font-size:12px;opacity:.9;margin-top:2px}
#alertBar .ab{display:flex;flex-direction:column;gap:4px;flex:none}
#alertBar .lk{color:#fff}
.gopt{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.gopt button{text-align:left;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:7px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--fg)}
.gopt button:hover{border-color:var(--org);background:#fff4ea}
.gopt button:disabled{opacity:.55;cursor:default}
@media (max-width:900px){#alertBar{max-width:calc(100% - 20px);top:52px}}
.fixes .box{margin:0;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.fixes .hitlist{position:static;max-width:none;max-height:none}
.badge{position:absolute;top:10px;right:10px;border-radius:20px;padding:6px 14px;font-weight:700;max-width:calc(100% - 20px)}
.badge.ok{background:#dff3e4;color:#1d7a3a;border:1px solid #9fd3ae}
.badge.ng{background:#fde8e8;color:#b42020;border:1px solid #f2a7a7;cursor:pointer}
.hitlist{position:absolute;top:46px;right:10px;background:#fff;border:1px solid #f2a7a7;border-radius:10px;padding:8px 12px;line-height:1.7;display:none;max-width:calc(100% - 20px);max-height:40%;overflow:auto}
.site{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center}
.site b{grid-column:1/-1}
.chip{width:72px;border:2px solid var(--acc);border-radius:6px;padding:3px 6px;font:inherit;font-weight:700;color:var(--navy);text-align:right;background:#fff}
.chip.l{border-color:#8fb0d0}
.chip:focus{outline:none;border-color:var(--org);background:#fff4ea}
.right{width:320px;flex:none;background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}
.right h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f2}
.row .k{color:var(--sub)}
.muted{color:var(--sub);font-size:11px;line-height:1.5}
.box{margin-top:12px;background:#f5f7fa;border-radius:10px;padding:10px}
.box .row{border-color:#e3e6ea}
.tot{font-size:17px;font-weight:700;color:var(--navy)}
.lk{color:var(--acc);font-weight:700;background:none;border:0;padding:0}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;max-width:170px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #0002}
.plist .row{cursor:pointer}
.plist .row.on{background:#fff4ea}
.plist .row.hit .k{color:#b42020}
.err{color:#b42020}
.auto{grid-column:1/-1;background:var(--org);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:700}
.ad{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-top:6px;background:#fff}
.ad.cur{border-color:var(--org)}
.ad .h{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.ad .lv0{color:#1f7a3a}.ad .lv1{color:#a85b00}.ad .lv2{color:#b42020}
.ad ul{margin:4px 0 4px 16px;padding:0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
/* 部材構成（Fusion の ブラウザの 形）：3D の 上に 背景なしで 置く。名前の 所だけ 押せる（すき間は 3D を 回せる） */
.tree{position:absolute;left:10px;top:10px;width:310px;max-height:calc(100% - 20px);overflow-x:hidden;overflow-y:auto;pointer-events:none;font-size:12.5px;user-select:none}
.tree .bh,.tree .n{pointer-events:auto}
.tree .bh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-weight:700;background:rgba(242,243,245,.85);border:1px solid #c9ccd2;border-radius:4px;margin-bottom:4px;cursor:pointer;width:max-content;min-width:160px;gap:12px}
.tree .bh span:last-child{color:#888;font-weight:400}
.tree .n{display:flex;align-items:center;gap:4px;padding:2px 4px;white-space:nowrap;width:max-content;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;cursor:pointer}
.tree .nm{background:rgba(255,255,255,.55);border-radius:3px;padding:0 3px}
.tree .n.on .nm{background:#cfe3fa;outline:1px solid #6aa0de}
.tree .n.off .nm{color:#9a9a9a}
.tree .n.hit .nm{color:#b42020}
.tree .n[draggable]{touch-action:none}
.tree .n[draggable] .nm{cursor:grab}
.tree .n.dz .nm{background:#fde7cf;outline:2px dashed var(--org)}
.tree .ar{width:12px;color:#555;font-size:10px;text-align:center}
.tree .ey{width:18px;text-align:center;color:#444}
.tree .ey.off{color:#aaa}
.tree .ic{width:16px;text-align:center}
.tree.min .n{display:none}
.fx{width:100%;border-collapse:collapse;font-size:12px}
.fx th{font-weight:400;color:var(--sub);text-align:center;padding:2px}
.fx td{padding:3px 2px;border-bottom:1px solid #e3e6ea;text-align:center}
.fx td:first-child{text-align:left}
.fx .chip{width:58px;padding:2px 4px}
.fx input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.fx .mv{color:var(--sub);font-size:10.5px;white-space:nowrap}
.fx .ps{font-size:10.5px;padding:1px 2px;max-width:none}
.fx .pk{cursor:pointer;color:var(--acc)}
.dis{color:#aaa}
.go{display:block;width:100%;margin-top:10px;background:var(--org);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:700}
.pick{cursor:pointer;display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px;background:#fff;text-align:left;color:var(--fg)}
.pick.on{border-color:var(--org);background:#fff4ea}
#busy{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:50;background:#223;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:14px;display:none}
#busy.ok{background:#1d7a3a}#busy.ng{background:#b42020}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.tc{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px;text-align:center;font-size:11px;line-height:1.3;color:var(--fg)}
.tc.on{border-color:var(--org);background:#fff4ea;box-shadow:0 0 0 1px var(--org)}
.tc .th{display:block;width:100%;aspect-ratio:1;background:#fafbfc;border-radius:6px}
.tc .th svg{width:100%;height:100%;display:block}
.tc .th.no{display:flex;align-items:center;justify-content:center;color:#aab;font-size:22px}
.tc .use{position:absolute;top:3px;left:3px;background:var(--org);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.tc .mr{position:absolute;top:3px;right:3px;background:#eef;color:#336;border-radius:4px;padding:0 4px;font-size:10px}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tchips button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:1px 8px;font-size:11px;cursor:pointer;color:var(--fg)}
.tchips button.on{background:#334;color:#fff;border-color:#334}
/* 部材を 足す（部材マスターの サムネ）と 支点を 選ぶ 案内 */
.ldw{position:relative}
.ldm{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;width:260px;font-size:13px}
.ldm.on{display:block}.ldm button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;font:inherit;color:inherit}.ldm button:hover{background:#f1f5f9}
.ldm .muted{padding:4px 10px}
.tree .bhw{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}.tree .bhw .bh{margin-bottom:0;min-width:120px}
.tree .mbb{pointer-events:auto;border:1px solid #c9ccd2;background:rgba(255,255,255,.92);color:var(--navy);border-radius:4px;padding:4px 8px;font-weight:700;font:inherit;font-weight:700;white-space:nowrap}
.addb{display:block;width:100%;margin:8px 0 4px;background:var(--org);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:14px}
#pk{position:absolute;left:12px;right:12px;top:12px;max-width:900px;max-height:calc(100% - 24px);margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);border:1px solid #d6d9de;padding:14px 16px;display:none;flex-direction:column;z-index:20}
#pk.on{display:flex}
#pk .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pk .hd b{font-size:15px}
#pk .x{background:none;border:0;font-size:20px;color:#6b7280}
#pk .q{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;margin:8px 0}
#pk .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#pk .tabs button{border:0;background:#eef0f3;border-radius:16px;padding:5px 11px;color:var(--fg)}
#pk .tabs button.on{background:var(--navy);color:#fff}
#pk .grid{flex:1;min-height:120px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start;margin-top:8px;padding:2px}
#pk .ft{border-top:1px solid #eef0f3;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#pk .go2{background:var(--org);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
#pk .go2:disabled{background:#d8b48f}
#pk .no2{background:#eef0f3;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
#pmBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(600px,calc(100% - 20px));background:rgba(30,58,95,.96);color:#fff;border-radius:10px;padding:9px 14px;line-height:1.65;z-index:30;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#pmBar.on{display:block}
.c.pm .fixes,.c.pm .badge{display:none}
#pmBar .s1{color:#fdba74}#pmBar .s2{color:#93c5fd}#pmBar .now{color:#fcd34d}
#pmBar button{border:0;border-radius:6px;padding:3px 10px;margin:4px 6px 0 0;font-weight:700;background:#fff;color:var(--navy)}
#pmBar button:disabled{opacity:.45}
.fpt{text-align:right;line-height:1.4}
.c1{color:#c2410c}.c2{color:#2563eb}
@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%}
  .main{flex-direction:column}
  .left{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px}
  .left > div{min-width:150px}
  .left h4{margin:2px 0 4px}
  .left .hint,.left > div:first-child{display:none}
  .c{height:62vh;flex:none}
  .right{width:auto;border-left:0}
  .top .nm{width:150px}
  .tree{width:270px}
}
</style>
<script src="sekkei-in.js?v=0.1"></script>
</head>
<body>
<div class="top">
  <b>🏯 組み立て</b>
  <input class="nm" id="nm" placeholder="名前（例：和型8寸 案1）">
  <span class="sp"></span>
  <div class="seg" id="seg"><button data-v="3d" class="on">3D</button><button data-v="front">正面</button><button data-v="top">平面</button></div>
  <button class="btn g" id="bUndo" title="1 つ 前に 戻す（Ctrl+Z）：大きさ・自動処理・隠す" disabled>↶ 戻る</button>
  <button class="btn g" id="bCopy" title="いまの 状態を 文字に して コピー（チャットに 貼る）">📋 状態</button>
  <button class="btn g" id="bPng">🖼 画像</button>
  <span class="ldw"><button class="btn g" id="bOpen" title="組み立て・セット・部材・単価の ファイルを 読む">📂 読む ▾</button><div class="ldm" id="ldm"></div></span>
  <button class="btn" id="bSave">💾 保存</button>
  <button class="btn" id="bZm" title="今の 形から 配置図・部品寸法表・加工指示図・部品詳細図を 作る（図面アプリが 開く）">📐 図面に する</button>
</div>
<div class="main">
  <div class="c">
    <div id="v"></div>
    <div id="pmBar"></div>
    <div id="pk"></div>
    <div class="badge ok" id="badge">✓ 干渉 なし</div>
    <div id="alertBar"></div>
    <div class="box" id="szBox" style="display:none"></div>
    <div class="fixes" id="fixes">
      <div class="hitlist" id="hitlist"></div>
      <div class="box" id="jBox" style="display:none;border-left:4px solid #b42020"></div>
      <div class="box" id="gapBox" style="display:none"></div>
      <div class="box" id="noteBox" style="display:none"></div>
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="right">
    <div id="selBox"></div>
    <div class="box" id="adBox" style="display:none"></div>
    <div class="box" id="estBox"></div>
    <div class="box"><details><summary>部材の 一覧（才数）</summary><div class="plist" id="plist"></div></details></div>
    <div class="muted" style="margin-top:10px" id="ver"></div>
  </div>
</div>
<div id="ctx"></div>
<input type="file" id="fOpen" accept=".json,application/json" hidden>
<input type="file" id="fPart" accept=".json,application/json" hidden>
<input type="file" id="fTanka" accept=".json,application/json" hidden>
<input type="file" id="fSet" accept=".json,application/json" hidden>
<script src="buzai-engine.js?v=0.9.18"></script>
<script src="kumitate-data.js"></script>
<script src="kumitate-engine.js?v=0.8.27"></script>
<script src="buzai-lib.js?v=0.9.5"></script>
<script src="zumen-hlr.js?v=0.8.6"></script>
<script>
var APP_VER = 'v0.8.27';
// 部材の データ：見本（kumitate-data.js）か、読んだ 旧シミュレーターの 保存ファイル
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var DATA0 = lsGet('kumitate.data') || window.KUMITATE_DATA;
// セット（図面から 読んだ 石塔・外柵。buzai-set/1）。SharePoint の 部材ライブラリ/セット が 元。この 端末にも 覚える（つながらない ときも 使える）
var SETS = lsGet('kumitate.sets') || [];
// 部材ライブラリ（buzai/1。SharePoint の 部材ライブラリ/部材 が 元。この 端末にも 覚える）。セット（buzai-set/2）は 枠と 部材の id だけ（buzai-lib.js）
var LIB = lsGet('kumitate.lib') || {}, RSETS = [];
var PART_DIR = '/業務アプリ/部材ライブラリ/部材';
function libPut(p){ BL.mhIn(p); var o = LIB[p.id]; if (o && (o.version || 0) > (p.version || 0)) return false; if (o && o.thumb && !p.thumb && (o.version || 0) === (p.version || 0)) p.thumb = o.thumb; LIB[p.id] = p; return true; }
function libSave(){ lsSet('kumitate.lib', LIB); }
// 前の 形の セット（部材を 丸ごと）→ 枠と 参照 ＋ 部材ライブラリ（左右で 同じ 石は 反転で 1 つ）
// セットの ファイルに 入った 部材（parts_lib）は、この 端末に 無い・古い ときだけ 入れる（同じ 版の 手元の 直しを 消さない。v0.8.22）
function libFill(p){ var o = LIB[p.id]; if (o && (o.version || 0) >= (p.version || 0)) return false; return libPut(p); }
function toNewSet(S){ if (!S || BL.isNew(S)) { (S && S.parts_lib || []).forEach(libFill); if (S) delete S.parts_lib; return S; } var r = BL.split(S); r.parts.forEach(libPut); return r.set; }
(function(){ var ch = false; SETS = SETS.map(function(S){ if (BL.isNew(S)) return S; ch = true; return toNewSet(S); }); if (ch) { lsSet('kumitate.sets', SETS); libSave(); } })();
function addsOf(id){ return ((typeof ST !== 'undefined' && ST && ST.add) || []).filter(function(a){ return a.setId === id; }); }
// 旧シミュレーターの 石塔（和型8寸・9寸・洋型）と 外柵（デザイン1・2・階段付き）は 使わない（本人）。図面から 読んだ セットだけ 出す
function build(){ RSETS = SETS.map(function(S){ return BL.resolve(S, LIB, addsOf(S.id)); }); var d = KM.addSets(DATA0, RSETS), pd = d === DATA0 ? (d = JSON.parse(JSON.stringify(d))).partsData : d.partsData;

  var pv = function(x, n){ var a = x.params && x.params[n]; return a ? +(a.value != null ? a.value : a.default) : null; };
  [['W', '幅'], ['D', '奥行'], ['H', '高さ']].forEach(function(a){ var m = pv(L, a[0]), j = pv(sh, a[0]); if (m != null && j != null && Math.abs(m - j) > 0.5) out.push(a[1] + ' ' + Math.round(m) + ' → ' + Math.round(j)); });
  Object.keys(sh.params || {}).forEach(function(n){ if (/^[WDH]$/.test(n)) return; var m = pv(L, n), j = pv(sh, n); if (m != null && j != null && Math.abs(m - j) > 0.5) out.push((sh.params[n].name || n) + ' ' + m + ' → ' + j); });
  if (q.mirror || sh.__mirror) out.push('左右反転');
  return out;
}
// お墓の 名前（組み立ての 名前、無ければ 業務アプリの 件名）。ボタン・一覧は「〇〇家の 墓」（2026-11-11 本人「この お墓用では 分かりづらい」）
function jobName(){ var n = (ST.name || '').trim(); if (!n) try { n = (window.parent.FROM && window.parent.FROM.title) || ''; } catch (e) {} return n; }
function jobLabel(){ var n = jobName(); return n ? n + 'の 墓' : 'この 墓'; }
function openKakou(k){
  var q = RES && RES.parts[k]; if (!q) return;
  // 案件で 大きさ・左右が 変わった 部材は、3D と 同じ 形（q.shape）で 加工図面を 開く。前の 図（sketch）は 元の 大きさなので 外し、今の 形から かき直させる
  // （2026-11-11 本人「部材と 加工図面が 同じで ない」「水鉢と 同じように 拝石も」＝部品詳細図でなく 水鉢と 同じ 加工図面の 画面で）
  var jd = jobDiff(k);
  if (jd.length && q.shape) { var dj = JSON.parse(JSON.stringify(q.shape)); delete dj.__from; delete dj.thumb; delete dj.sketch; if (!dj.id) dj.id = q.partId;
    dj.__job = { key:k, diff:jd, name:jobName() }; dj.__master = 1; lsSet('zumen.part', dj); if (!skGo('kakou', '#pd' + Date.now())) window.open('zumen.html#pd' + Date.now(), 'zumen'); return; }
  var src = ST.shapes[k] || (q.partId && LIB[q.partId]) || q.shape; if (!src) { alert('この 部材には 形の データが ありません（箱だけ）'); return; }
  var d = JSON.parse(JSON.stringify(src)); delete d.__from; delete d.thumb; delete d.__mirror; if (!d.id) d.id = q.partId || 'part_' + Date.now().toString(36);
  d.__job = { key:k, diff:[], name:jobName() }; // お墓（案件）から 開いた 印：保存は この お墓へ（マスターは 変えない、v0.8.19）
  d.__master = 1; lsSet('zumen.part', d); skGo('kakou', '#pd' + Date.now());
}
// 加工図面の［💾 この お墓に 保存］から：この 案件の この 石だけの 形と 加工図面（ST.shapes）に する。部材マスターは 変えない
// （2026-11-11 本人「お客様に 調整した 図面を マスターに 保存は ダメ。マスターから お客様ごとに 加工図面に して 微調整、お客様ごとに 保存」）
window.kmJobTake = function(k, def){ if (!def || !RES || !RES.parts[k]) return false; var d = JSON.parse(JSON.stringify(def)); delete d.__master; delete d.__back; delete d.__job; delete d.thumb;
  var q = RES.parts[k], o = ST.shapes[k]; d.__from = 'job'; d.__set = (o && o.__set) || q.setId || ''; if (!d.id) d.id = q.partId || ''; ST.shapes[k] = d; lsSet('kumitate.state', ST); renderLeft(); run(); return true; };
$('bUndo').onclick = undo;
$('bPng').onclick = function(){ if (!V3) return; var a = document.createElement('a'); a.href = V3.png(); a.download = 'kumitate_' + (ST.name || '3d') + '.png'; a.click(); };
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !V3) return;
  [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); }); V3.fit(b.dataset.v);
});
$('ver').textContent = '組み立て ' + APP_VER + '（部材は ' + (DATA0 === window.KUMITATE_DATA ? '見本' : '読んだ ファイル') + (SETS.length ? '・セット ' + SETS.length : '') + '）';

if (ST.sel.tower && !KM.variants(DATA, 'tower')[ST.sel.tower]) ST.sel.tower = KM.newState(DATA).sel.tower || '';
if (ST.sel.fence && !KM.variants(DATA, 'fence')[ST.sel.fence]) ST.sel.fence = 'none';
migGl(); RES = calc(); renderLeft(); run();
spLoadSets(false); if (!spHost()) fixMissing(false);
import('./kumitate-3d.js?v=0.8.27').then(function(m){
  V3 = m.create($('v'), pick, SKP ? function(k){ if (k) openKakou(k); } : null, ctxOpen);
  draw();
  window.__ready = true;
}).catch(function(e){ $('v').innerHTML = '<div class="muted" style="padding:20px">3D を 開けませんでした：' + esc(e.message) + '</div>'; window.__ready = true; });
