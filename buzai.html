<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>部材マスター</title>
<style>
:root{--fg:#1d1d1f;--sub:#6b6b70;--line:#d9d9de;--acc:#2f5d8a;--navy:#1f3b5c;--org:#e07a1f;--bg:#eef0f3;--ok:#1d7a3a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color:var(--fg);background:var(--bg);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}input,select{font:inherit}
.top{flex:none;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px}
.top b{font-size:17px;margin-right:10px}.top input{width:240px;border:0;border-radius:6px;padding:6px 10px}
.top .b{background:#2d4a6e;color:#fff;border:0;border-radius:6px;padding:7px 11px}.top .b.o{background:var(--org)}.top .sp{flex:1}
.top .w{font-size:12px;color:#cbd5e1}
.main{flex:1;display:flex;min-height:0}
.left{width:210px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.g{margin:8px 10px 2px;color:var(--sub);font-size:12px;font-weight:700;border-bottom:1px dashed var(--line)}
.r{display:flex;justify-content:space-between;padding:4px 12px 4px 22px;cursor:pointer}.r span{color:#889;font-size:12px}.r.z{color:#aab}
.r.on{background:#dbe9ff;border-left:4px solid var(--acc);padding-left:18px;font-weight:700}
.mid{flex:1;min-width:0;overflow:auto;padding:12px 14px}
.mid h2{margin:0 0 6px;font-size:17px}.mid h2 small{font-weight:400;color:var(--sub);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 10px;font-size:12px}.chips button.on{background:#334;color:#fff;border-color:#334}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.cd{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--fg)}
.cd.on{border:2px solid var(--org);background:#fff8f1;padding:5px}
.cd .th{display:block;width:100%;aspect-ratio:1;background:#fafbfc;border-radius:6px}.cd .th svg{width:100%;height:100%;display:block}
.cd .th.no{display:flex;align-items:center;justify-content:center;color:#aab;font-size:24px}
.cd .nm{font-weight:700;font-size:13.5px;margin-top:2px}.cd .mt{color:var(--sub)}.cd .tg{color:#336;font-size:11px;margin-top:2px}
.st{position:absolute;top:6px;left:6px;border-radius:4px;padding:1px 6px;font-size:11px;color:#fff;background:var(--ok)}.st.dr{background:var(--org)}
.dt{position:absolute;top:6px;right:6px;border-radius:4px;padding:1px 6px;font-size:11px;background:#fde68a;color:#7a5200}
.cd.add{display:flex;flex-direction:column;justify-content:center;border-style:dashed;color:var(--sub);min-height:220px}
.right{width:470px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:12px 14px}
.right h3{margin:0;font-size:18px}.idl{color:var(--sub);font-size:12px;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eef0f4;padding:4px 0}.row .k{color:var(--sub);white-space:nowrap}
.row input,.row select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0;flex:1;max-width:280px}
.hd{display:flex;gap:10px}.hd .pic{width:170px;flex:none;aspect-ratio:1;background:#fafbfc;border-radius:8px}.hd .pic svg{width:100%;height:100%}.hd .kv{flex:1;min-width:0}
.btn{display:inline-block;border-radius:8px;padding:7px 11px;margin:6px 6px 0 0;border:1px solid var(--acc);color:var(--acc);background:#fff}
.btn.p{background:var(--acc);color:#fff}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn:disabled{opacity:.45;cursor:default}
.sec{font-weight:700;margin:14px 0 4px;font-size:14px}
.box{background:#f5f7fa;border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.8}
.lst div{padding:3px 0;border-bottom:1px dashed #e3e7ee;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.muted{color:var(--sub);font-size:12px}
.empty{color:var(--sub);padding:40px;text-align:center}
#busy{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:50;background:#223;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:14px;display:none}
#busy.ok{background:var(--ok)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40}
.dlg>div{background:#fff;border-radius:12px;padding:16px 18px;width:420px;max-width:92vw}
@media (max-width:1100px){.right{width:380px}.left{width:170px}}
</style></head><body>
<div class="top"><b>🗂 部材マスター</b><input id="q" placeholder="🔍 名前・id・タグで さがす"><button class="b o" id="bNew">＋ 新しい 部材</button><button class="b" id="bFile">📂 ファイルを 読む</button><button class="b" id="bSync">☁️ SP から 読む</button><span class="sp"></span><span class="w" id="where"></span><button class="b" id="bKumi">🏯 組み立てへ</button></div>
<div class="main"><div class="left" id="left"></div><div class="mid" id="mid"></div><div class="right" id="right"></div></div>
<div id="busy"></div>
<div class="dlg" id="dNew"><div><b style="font-size:16px">新しい 部材</b>
  <div class="row"><span class="k">役目</span><select id="nRole"></select></div>
  <div class="row"><span class="k">名前</span><input id="nName" placeholder="例：香炉 角型"></div>
  <div class="row"><span class="k">作り方</span><select id="nHow"><option value="copy">いま 選んで いる 部材を 複製して 直す</option><option value="box">箱から 図面で かく</option><option value="mihon">見本（香炉 筆返し・雲形穴）から</option></select></div>
  <div class="muted" style="margin-top:6px">下書きで 作ります（組み立ての 候補には 出ません）。［✎ 図面で 直す］で 形を かき、［登録済み］に して［💾 保存］</div>
  <div style="text-align:right;margin-top:10px"><button class="btn" id="nCancel">やめる</button><button class="btn p" id="nOk">作る</button></div></div></div>
<input type="file" id="fOpen" accept=".json,application/json" hidden>
<script src="buzai-engine.js?v=0.9.18"></script>
<script src="buzai-lib.js?v=0.9.4"></script>
<script src="zumen-hlr.js?v=0.9.22"></script>
<script>
var APP_VER = 'v0.2.5';
// 部材マスター：部材ライブラリ（buzai/1）の 一覧・名前や 役目の 直し・複製・新しく・保存（版と 履歴）。
// 形と 図面は 図面アプリ（zumen.html#pd）で 直し、ここへ 戻す。加工図面の 見本は zumen.html#km（この 部材 だけ）。
// 部材は この 端末（kumitate.lib・組み立てと 同じ）と SharePoint（/業務アプリ/部材ライブラリ/部材/<id>.json、履歴/<id>_v<n>.json）
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert('この 端末に 覚えられませんでした（容量）'); } }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var PART_DIR = '/業務アプリ/部材ライブラリ/部材', LIB = lsGet('kumitate.lib') || {}, SETS = lsGet('kumitate.sets') || [];
var CUR = { role:'', sel:'', st:'', tag:'', q:'' }, Z3 = null, THQ = {}, HIST = {};
try { var c0 = lsGet('buzai.cur'); if (c0) { CUR.role = c0.role || ''; CUR.sel = c0.sel || ''; } } catch (e) {}
function libPut(p){ var o = LIB[p.id]; if (o && (o.version || 0) > (p.version || 0)) return false; if (o && o.__dirty && (o.version || 0) === (p.version || 0)) return false; if (o && o.thumb && !p.thumb && (o.version || 0) === (p.version || 0)) p.thumb = o.thumb; LIB[p.id] = p; return true; }
function libSave(){ lsSet('kumitate.lib', LIB); }
// 前の 形の セット（部材を 丸ごと）が 端末に あれば、組み立てと 同じく 分けて ライブラリへ
(function(){ var ch = false; SETS = SETS.map(function(S){ if (BL.isNew(S)) return S; ch = true; var r = BL.split(S); r.parts.forEach(libPut); return r.set; }); if (ch) { lsSet('kumitate.sets', SETS); libSave(); } })();
// SharePoint：業務アプリの 関数（*FromTekkyo）を 開いた 窓を さかのぼって 探す
function spHost(){ var w = window.opener; for (var i = 0; i < 4 && w; i++) { try { if (!w.closed && w.listItemsInFolderPassFromTekkyo && w.downloadJsonFromFolderPassFromTekkyo && w.uploadJsonToFolderPassFromTekkyo) return w; w = w.opener; } catch (e) { return null; } } return null; }
function busy(msg, cls, ms){ var b = $('busy'); clearTimeout(busy.t); if (!msg) { b.style.display = 'none'; return; } b.className = cls || ''; b.textContent = msg; b.style.display = 'block'; if (ms) busy.t = setTimeout(function(){ b.style.display = 'none'; }, ms); }
function isDraft(p){ return p.status === 'draft'; }
function pv(p, k){ var x = p.params && p.params[k]; return x ? +(x.value != null ? x.value : x.default) : 0; }
function sizeOf(p){ var W = pv(p, 'W'), D = pv(p, 'D'), H = pv(p, 'H'); return W ? [Math.round(W), Math.round(D), Math.round(H)] : null; }
function sai(p){ var s = sizeOf(p); return s ? s[0] * s[1] * s[2] / Math.pow(303.03, 3) : 0; }
function roleOfP(p){ return p.role || BL.roleOf(p.name) || ''; }
function usedIn(id){ var out = []; SETS.forEach(function(S){ (S.slots || []).forEach(function(sl){ if (sl.part && sl.part.id === id) out.push({ set:S, slot:sl }); }); }); return out; }
function hasTpl(id){ var t = lsGet('zumen.kmTpl') || {}, p = LIB[id]; return !!(t[id] || (p && p.drawing && p.drawing.tpl)); }

// ── サムネ（形から 作って 部材に 覚える。組み立てと 同じ）──
function makeThumbs(ids){
  var need = ids.filter(function(id){ return LIB[id] && !LIB[id].thumb && !THQ[id]; }); if (!need.length) return;
  need.forEach(function(id){ THQ[id] = 1; });
  (Z3 ? Promise.resolve(Z3) : import('./zumen-3d.js?v=' + APP_VER).then(function(m){ return Z3 = m; })).then(function(m){
    need.forEach(function(id){ var q = LIB[id]; try { var g = m.partGeo(BZ.model(q, BZ.solve(q))); if (g && g.tris.length) q.thumb = kmThumbSvg(g, 120); } catch (e) {} THQ[id] = q.thumb ? 3 : 2; });
    libSave(); render();
  }).catch(function(){ need.forEach(function(id){ THQ[id] = 2; }); });
}
function pic(p){ return p.thumb ? '<span class="th">' + p.thumb + '</span>' : '<span class="th no">' + (THQ[p.id] === 2 ? '▢' : '…') + '</span>'; }

// ── 画面 ──
function counts(){ var c = {}; Object.keys(LIB).forEach(function(id){ var r = roleOfP(LIB[id]); c[r] = (c[r] || 0) + 1; }); return c; }
function renderLeft(){
  var c = counts(), h = '<div class="r' + (CUR.role === '' ? ' on' : '') + '" data-role="">すべて<span>' + Object.keys(LIB).length + '</span></div>';
  BL.BUNRUI.forEach(function(b){ h += '<div class="g">' + esc(b.g) + '</div>'; b.roles.forEach(function(r){ var n = c[r] || 0; h += '<div class="r' + (CUR.role === r ? ' on' : '') + (n ? '' : ' z') + '" data-role="' + esc(r) + '">' + esc(r) + '<span>' + n + '</span></div>'; }); });
  if (c['']) h += '<div class="g">分類 なし</div><div class="r' + (CUR.role === '?' ? ' on' : '') + '" data-role="?">役目が ない<span>' + c[''] + '</span></div>';
  $('left').innerHTML = h;
}
function listIds(){
  var q = CUR.q.trim().toLowerCase();
  return Object.keys(LIB).filter(function(id){ var p = LIB[id], r = roleOfP(p);
    if (CUR.role === '?' ? r : CUR.role && r !== CUR.role) return false;
    if (CUR.st === 'draft' && !isDraft(p)) return false; if (CUR.st === 'ok' && isDraft(p)) return false;
    if (CUR.tag && (p.tags || []).indexOf(CUR.tag) < 0) return false;
    if (q && (id + ' ' + (p.name || '') + ' ' + (p.tags || []).join(' ')).toLowerCase().indexOf(q) < 0) return false;
    return true; }).sort(function(a, b){ return String(LIB[a].name).localeCompare(String(LIB[b].name), 'ja'); });
}
function renderMid(){
  var ids = listIds(), all = Object.keys(LIB).filter(function(id){ var r = roleOfP(LIB[id]); return CUR.role === '?' ? !r : !CUR.role || r === CUR.role; });
  var tags = []; all.forEach(function(id){ (LIB[id].tags || []).forEach(function(t){ if (tags.indexOf(t) < 0) tags.push(t); }); });
  var g = CUR.role && CUR.role !== '?' ? BL.groupOf(CUR.role) + ' › ' + CUR.role : CUR.role === '?' ? '役目が ない 部材' : 'すべての 部材';
  var h = '<h2>' + esc(g) + ' <small>' + ids.length + ' 件</small></h2><div class="chips">';
  [['', 'すべて'], ['ok', '登録済み'], ['draft', '下書き']].forEach(function(x){ h += '<button data-st="' + x[0] + '"' + (CUR.st === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; });
  h += '<span style="width:10px"></span>' + tags.map(function(t){ return '<button data-tag="' + esc(t) + '"' + (CUR.tag === t ? ' class="on"' : '') + '>' + esc(t) + '</button>'; }).join('') + '</div><div class="grid">';
  ids.forEach(function(id){ var p = LIB[id], s = sizeOf(p), u = usedIn(id).length;
    h += '<div class="cd' + (CUR.sel === id ? ' on' : '') + '" data-id="' + esc(id) + '"><span class="st' + (isDraft(p) ? ' dr">下書き' : '">登録済み') + '</span>' + (p.__dirty ? '<span class="dt">未保存</span>' : '') + pic(p) +
      '<div class="nm">' + esc(p.name || id) + '</div><div class="mt">' + (s ? s.join('×') : '') + '　版 ' + (p.version || 0) + '</div><div class="mt">' + (hasTpl(id) ? '✓ 加工図' : '— 加工図') + '　セット ' + u + '</div><div class="tg">' + esc((p.tags || []).join('・')) + '</div></div>'; });
  h += '<div class="cd add" id="cAdd"><div style="font-size:36px">＋</div><div class="nm">新しい ' + esc(CUR.role && CUR.role !== '?' ? CUR.role : '部材') + '</div><div class="mt">複製して 直す／箱から 図面で</div></div></div>';
  if (!Object.keys(LIB).length) h += '<div class="empty">部材が まだ ありません。［☁️ SP から 読む］か、組み立てで セットを 開くと 入ります</div>';
  $('mid').innerHTML = h; makeThumbs(ids);
}
function roleSelect(cur){ return '<select data-f="role"><option value="">（なし）</option>' + BL.BUNRUI.map(function(b){ return '<optgroup label="' + esc(b.g) + '">' + b.roles.map(function(r){ return '<option' + (r === cur ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</optgroup>'; }).join('') + '</select>'; }
var OUTM = [['auto', '自動（直方体なら 立体の 絵だけ）'], ['iso', '立体の 絵だけ'], ['full', 'いつも 立体の 絵＋正面・右側面']];
function renderRight(){
  var p = LIB[CUR.sel]; if (!p) { $('right').innerHTML = '<div class="empty">真ん中の 部材を 押すと ここに 中身が 出ます</div>'; return; }
  var s = sizeOf(p), r = roleOfP(p), out = (p.drawing && p.drawing.out) || {}, sp = !!spHost();
  var h = '<h3>' + esc(p.name || p.id) + '</h3><div class="idl">' + esc(p.id) + '　版 ' + (p.version || 0) + '　' + (isDraft(p) ? '<b style="color:var(--org)">下書き</b>' : '<b style="color:var(--ok)">登録済み</b>') + (p.savedAt ? '　' + esc(p.savedAt.slice(0, 10)) + ' 保存' : '') + (p.__dirty ? '　<b style="color:#a16207">未保存の 直し あり</b>' : '') + '</div>';
  h += '<div class="hd"><div class="pic">' + (p.thumb || '') + '</div><div class="kv">';
  h += '<div class="row"><span class="k">名前</span><input data-f="name" value="' + esc(p.name || '') + '"></div>';
  h += '<div class="row"><span class="k">役目</span>' + roleSelect(r) + '</div>';
  h += '<div class="row"><span class="k">状態</span><select data-f="status"><option value="ok"' + (isDraft(p) ? '' : ' selected') + '>登録済み（組み立てに 出る）</option><option value="draft"' + (isDraft(p) ? ' selected' : '') + '>下書き（出ない）</option></select></div>';
  h += '<div class="row"><span class="k">大きさ</span><span>' + (s ? s.join(' × ') + ' mm' : '—') + '</span></div>';
  h += '<div class="row"><span class="k">才数</span><span>' + sai(p).toFixed(3) + ' 才</span></div></div></div>';
  h += '<div class="row"><span class="k">タグ</span><input data-f="tags" value="' + esc((p.tags || []).join('、')) + '" placeholder="和型、8寸、メーカー名 （、で 区切る）"></div>';
  h += '<div class="row"><span class="k">仕上げ</span><input data-f="finish" value="' + esc(p.finish || '') + '"></div>';
  h += '<div class="row"><span class="k">加工</span><input data-f="kakou" value="' + esc(p.kakou || '') + '"></div>';
  h += '<div><button class="btn p" id="bEdit">✎ 図面で 直す（形と 図）</button><button class="btn" id="bCopy">⧉ 複製</button></div>';
  h += '<div><button class="btn g" id="bSave">💾 保存（' + (sp ? 'SharePoint' : 'この 端末') + '・版 ' + (p.version || 0) + ' → ' + ((p.version || 0) + 1) + '）</button><button class="btn" id="bDl">📥 ファイルに</button>' + (p.__dirty && p.__base ? '<button class="btn" id="bUndo">直しを 取り消す</button>' : '') + '</div>';
  var hasFr = !!(p.sketch && (p.sketch.ents || []).some(function(e){ return e.frame; }));
  h += '<div class="sec">加工図面</div><div class="box">' + (hasFr ? '<b style="color:var(--ok)">✓ ［✎ 図面で 直す］の 図面 1 枚が 加工図面です（図枠の 中）</b><br><span class="muted">形も 加工図面も その 画面で 直し、印刷・PDF・DXF も その 画面の 右の 欄から</span>' :
    '<span class="muted">まだ 図枠が ありません。［✎ 図面で 直す］で 開くと 立体の 絵と 図枠（表題欄つき）が 入ります。それまでは 下の 決まりで 自動の 図に します</span>') + '</div><div class="box"' + (hasFr ? ' style="opacity:.55"' : '') + '>' + OUTM.map(function(o){ return '<label style="display:block"><input type="radio" name="om" data-om="' + o[0] + '"' + ((out.mode || 'auto') === o[0] ? ' checked' : '') + '> ' + o[1] + '</label>'; }).join('') +
    '<label><input type="checkbox" data-ot="1"' + (out.top ? ' checked' : '') + '> 天面図も 出す（穴・切り欠きが あれば いつも 出る）</label>' +
    '<div class="muted">枠が 無い ときは 組み立ての［📐 図面に する］の 部品詳細図に この 決まりを 使います。寸法を 動かした・注記を 足した 直しは［📌 ひな形に］で この 部材に 付きます' + (hasTpl(p.id) ? '（ひな形 あり）' : '') + '</div></div>';
  var hs = HIST[p.id];
  h += '<div class="sec">履歴</div><div class="lst">' + (hs ? (hs.length ? hs.map(function(x){ return '<div><span>版 ' + x.v + '　' + esc((x.at || '').slice(0, 10)) + '</span><a href="#" data-hv="' + x.v + '">この 版を 開く</a></div>'; }).join('') : '<div class="muted">まだ ありません</div>') : (sp ? '<div><a href="#" id="bHist">SharePoint の 履歴を 読む</a></div>' : '<div class="muted">SharePoint は 業務アプリ →［📐 図面］→［🧊 部材設計］で 開いた とき</div>')) + '</div>';
  var us = usedIn(p.id);
  h += '<div class="sec">使われて いる 所</div><div class="lst">' + (us.length ? us.map(function(u){ return '<div><span>セット：' + esc(u.set.name) + ' › ' + esc(u.slot.name) + (u.slot.mirror ? ' ⇋' : '') + '</span><span class="muted">版 ' + (u.slot.part.version || 0) + (u.slot.part.version < (p.version || 0) ? '（新しい 版 あり）' : '') + '</span></div>'; }).join('') : '<div class="muted">この 端末の セットでは 使って いません</div>') + '</div>';
  if (p.sources && p.sources.length) h += '<div class="muted" style="margin-top:8px">元：' + p.sources.map(function(s){ return esc(s.set ? s.set + '/' + s.key : s.file || ''); }).join('、') + '</div>';
  $('right').innerHTML = h;
}
function render(){ renderLeft(); renderMid(); renderRight(); lsSet('buzai.cur', { role:CUR.role, sel:CUR.sel }); }
function touch(p){ if (!p.__dirty) { p.__base = clone(p); delete p.__base.__base; p.__dirty = 1; } }

// ── 直す ──
$('left').onclick = function(e){ var r = e.target.closest('[data-role]'); if (!r) return; CUR.role = r.dataset.role; CUR.tag = ''; render(); };
$('mid').onclick = function(e){ var t = e.target;
  var st = t.closest('[data-st]'); if (st) { CUR.st = st.dataset.st; renderMid(); return; }
  var tg = t.closest('[data-tag]'); if (tg) { CUR.tag = CUR.tag === tg.dataset.tag ? '' : tg.dataset.tag; renderMid(); return; }
  if (t.closest('#cAdd')) { openNew(); return; }
  var cd = t.closest('[data-id]'); if (cd) { CUR.sel = cd.dataset.id; render(); } };
$('q').oninput = function(){ CUR.q = this.value; renderMid(); };
$('right').addEventListener('change', function(e){ var t = e.target, p = LIB[CUR.sel]; if (!p) return; var f = t.dataset.f;
  if (f) { touch(p);
    if (f === 'tags') p.tags = t.value.split(/[、,，\s]+/).filter(Boolean);
    else if (f === 'role') { p.role = t.value; p.category = t.value; }
    else if (f === 'status') { if (t.value === 'draft') p.status = 'draft'; else delete p.status; }
    else p[f] = t.value;
    libSave(); render(); return; }
  if (t.dataset.om || t.dataset.ot) { touch(p); p.drawing = p.drawing || {}; var o = p.drawing.out = p.drawing.out || {};
    if (t.dataset.om) o.mode = t.dataset.om; else o.top = t.checked; libSave(); render(); }
});
$('right').addEventListener('click', function(e){ var t = e.target, id = t.id, p = LIB[CUR.sel]; if (!p) return;
  if (id === 'bEdit') { editInZumen(p); return; }
  if (id === 'bSheet') { sheetInZumen(p); return; }
  if (id === 'bCopy') { var n = dup(p, (p.name || p.id) + '（複製）'); CUR.sel = n.id; render(); return; }
  if (id === 'bSave') { savePart(p); return; }
  if (id === 'bDl') { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(pure(p), null, 1)], { type:'application/json' })); a.download = p.id + '.json'; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000); return; }
  if (id === 'bUndo') { if (!confirm('保存して いない 直しを 取り消して、前の 状態に 戻します')) return; LIB[p.id] = p.__base; delete LIB[p.id].__dirty; THQ[p.id] = 0; libSave(); render(); return; }
  if (id === 'bHist') { e.preventDefault(); loadHist(p.id); return; }
  var hv = t.closest('[data-hv]'); if (hv) { e.preventDefault(); openHist(p.id, +hv.dataset.hv); }
});
function pure(p){ var d = clone(p); Object.keys(d).forEach(function(k){ if (k.indexOf('__') === 0) delete d[k]; }); return d; }
function newId(base){ var b = String(base || 'part').replace(/[^\w-]/g, '').slice(0, 30) || 'part', i = 1; while (LIB[b + '_' + i]) i++; return b + '_' + i; }
function dup(p, name){ var n = clone(p); delete n.__dirty; delete n.__base; delete n.__sp; n.id = newId(p.id.replace(/_\d+$/, '')); n.name = name; n.version = 0; n.status = 'draft'; delete n.savedAt;
  n.sources = (p.sources || []).concat([{ copy:p.id, version:p.version || 0 }]); n.__dirty = 1; LIB[n.id] = n; libSave(); return n; }
function boxPart(role, name){
  return { schema:'buzai/1', id:newId('P_' + Date.now().toString(36)), name:name || role || '新しい 部材', role:role, category:role, tags:[], status:'draft', version:0, __dirty:1,
    params:{ W:{ name:'幅', default:300, value:300 }, D:{ name:'奥行', default:300, value:300 }, H:{ name:'高さ', default:300, value:300 } }, dims:{},
    components:[{ id:'body', name:name || role, shape:{ type:'box', w:'幅', h:'高さ', d:'奥行' }, at:{ y:0 } }], drawing:{ views:['front', 'side'] }, sources:[{ new:new Date().toISOString().slice(0, 10) }] };
}
// ── 新しい 部材 ──
function openNew(){ $('nRole').innerHTML = BL.BUNRUI.map(function(b){ return '<optgroup label="' + esc(b.g) + '">' + b.roles.map(function(r){ return '<option' + (r === CUR.role ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</optgroup>'; }).join('');
  $('nName').value = ''; $('nHow').value = LIB[CUR.sel] ? 'copy' : 'box'; $('nHow').options[0].disabled = !LIB[CUR.sel]; $('dNew').style.display = 'flex'; }
$('bNew').onclick = openNew; $('nCancel').onclick = function(){ $('dNew').style.display = 'none'; };
$('nOk').onclick = function(){ var role = $('nRole').value, name = $('nName').value.trim() || role, n;
  if ($('nHow').value === 'copy' && LIB[CUR.sel]) { n = dup(LIB[CUR.sel], name); n.role = role; n.category = role; }
  else if ($('nHow').value === 'mihon') { n = clone(BZ_KORO); n.id = newId('koro'); n.name = name; n.role = role; n.category = role; n.tags = []; n.status = 'draft'; n.version = 0; n.__dirty = 1; n.sources = [{ mihon:'BZ_KORO' }]; LIB[n.id] = n; }
  else { n = boxPart(role, name); LIB[n.id] = n; }
  libSave(); $('dNew').style.display = 'none'; CUR.role = role; CUR.sel = n.id; render();
  if ($('nHow').value === 'box') editInZumen(n); };
// ── 図面アプリで 直す（#pd）→ 戻ると bmTake ──
// 図面アプリ：この 窓を 開いた 図面アプリが あれば そこ（業務アプリと つながった まま）、無ければ 新しく
function openZumen(hash){ try { var o = window.opener; if (o && !o.closed && o.pdFromMaster) { o.location.hash = hash; o.focus(); return; } } catch (e) {}
  var w = window.open('zumen.html' + hash, 'zumen'); if (!w) alert('図面アプリを 開けませんでした（ポップアップを 許可して ください）'); }
function editInZumen(p){ var d = pure(p); d.__master = 1; lsSet('zumen.part', d); openZumen('#pd' + Date.now()); }
window.bmTake = function(def){ if (!def || !def.id) return; var sig = JSON.stringify(def.components) + JSON.stringify(def.sketch || ''); if (sig === window.__lastSig) return; window.__lastSig = sig; var p = LIB[def.id]; delete def.__master;
  var n = Object.assign({}, p || {}, def); if (p) { touch(p); n.__base = p.__base; } n.__dirty = 1; delete n.thumb; THQ[def.id] = 0; n.version = p ? p.version || 0 : def.version || 0;
  LIB[def.id] = n; libSave(); CUR.sel = def.id; render(); busy('図面から 戻しました：' + (n.name || n.id) + '。［💾 保存］で 版が 上がります', 'ok', 5000); window.focus(); };
window.addEventListener('storage', function(e){
  if (e.key === 'zumen.part') { var z = lsGet('zumen.part'); if (z && z.__master && z.__back && z.__back !== window.__lastBack) { window.__lastBack = z.__back; delete z.__back; bmTake(z); } }
  if (e.key === 'kumitate.sets') { SETS = lsGet('kumitate.sets') || []; renderRight(); }
  if (e.key === 'kumitate.lib') { var L = lsGet('kumitate.lib') || {}; Object.keys(L).forEach(function(id){ if (!LIB[id] || (!LIB[id].__dirty && (L[id].version || 0) >= (LIB[id].version || 0))) LIB[id] = L[id]; }); render(); }
});
// 加工図面（この 部材 だけ の 部品詳細図）を 図面アプリで
function sheetInZumen(p){ var s = sizeOf(p) || [300, 300, 300], W = s[0], D = s[1], H = s[2], d = pure(p); delete d.thumb;
  var pay = { schema:'kmz/1', t:Date.now(), only:'detail', name:'', date:new Date().toISOString().slice(0, 10), site:{}, joint:{}, gl:null,
    parts:[{ k:'p1', key:'p1', name:p.name || p.id, grp:'part', setId:'part', setName:(p.name || p.id) + '（部材）', no:'1', stone:'', fin:p.finish || '', kakou:p.kakou || '', partId:p.id, basePart:p.id, mirror:false, role:roleOfP(p),
      w:W, d:D, h:H, box:{ x0:-W / 2, x1:W / 2, y0:0, y1:H, z0:-D / 2, z1:D / 2 }, shape:d }] };
  lsSet('kumitate.zumen', pay); openZumen('#km' + pay.t); }
// ── 保存（版を 1 つ 上げる・ひな形も 部材に 入れる）──
function savePart(p){
  var d = pure(p), tpl = (lsGet('zumen.kmTpl') || {})[p.id]; delete d.thumb;
  if (tpl) { d.drawing = d.drawing || {}; d.drawing.tpl = tpl; }
  d.version = (p.version || 0) + 1; d.savedAt = new Date().toISOString(); var txt = JSON.stringify(d), w = spHost();
  var done = function(){ var n = Object.assign(d, { thumb:p.thumb }); n.__sp = w ? d.version : 0; LIB[p.id] = n; libSave(); HIST[p.id] = null; render(); busy('✓ 保存しました：' + (d.name || d.id) + '（版 ' + d.version + '）', 'ok', 5000); };
  if (!w) { if (!confirm('SharePoint と つながって いません。この 端末だけに 保存します（版 ' + d.version + '）。\n業務アプリ →［📐 図面］→［🧊 部材設計］→［🗂 部材マスター］で 開くと SharePoint に 保存します')) return; done(); return; }
  busy('☁️ SharePoint に 保存中…');
  w.uploadJsonToFolderPassFromTekkyo(txt, d.id + '.json', PART_DIR).then(function(){ return w.uploadJsonToFolderPassFromTekkyo(txt, d.id + '_v' + d.version + '.json', PART_DIR + '/履歴'); })
    .then(done).catch(function(e){ busy(''); alert('SharePoint に 保存 できませんでした\n' + (e && e.message || e)); });
}
// 部材に 付いた ひな形を 図面アプリの ひな形へ（無い とき・部材の ほうが 新しい とき）
function tplToZumen(p){ if (!p.drawing || !p.drawing.tpl) return; var t = lsGet('zumen.kmTpl') || {}; if (!t[p.id] || (p.__dirty ? false : true)) { t[p.id] = p.drawing.tpl; lsSet('zumen.kmTpl', t); } }
// ── SharePoint から 読む ──
function spLoad(say){
  var w = spHost(); if (!w) { if (say) alert('SharePoint は 業務アプリ →［📐 図面］→［🧊 部材設計］で 開いた ときに 使えます'); return; }
  busy('☁️ 部材ライブラリを 読んで います…');
  w.listItemsInFolderPassFromTekkyo(PART_DIR).then(function(list){
    var fs = (list || []).filter(function(it){ return !it.folder && /\.json$/i.test(it.name || ''); }), n = 0;
    return Promise.all(fs.map(function(it){ return w.downloadJsonFromFolderPassFromTekkyo(PART_DIR, it.name).then(function(t){ var d = JSON.parse(t); if (d.schema === 'buzai/1') { d.__sp = d.version || 0; if (libPut(d)) { n++; tplToZumen(d); } } }).catch(function(){}); })).then(function(){ return [fs.length, n]; });
  }).then(function(r){ libSave(); render(); busy('✓ SharePoint の 部材 ' + r[0] + ' 件（新しく なった もの ' + r[1] + '）', 'ok', 4000); })
    .catch(function(e){ busy(''); alert('読めませんでした\n' + (e && e.message || e)); });
}
$('bSync').onclick = function(){ spLoad(true); };
function loadHist(id){ var w = spHost(); if (!w) return;
  w.listItemsInFolderPassFromTekkyo(PART_DIR + '/履歴').then(function(list){
    var re = new RegExp('^' + id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_v(\\d+)\\.json$', 'i');
    HIST[id] = (list || []).map(function(it){ var m = re.exec(it.name || ''); return m ? { v:+m[1], at:it.modified || '', name:it.name } : null; }).filter(Boolean).sort(function(a, b){ return b.v - a.v; });
    renderRight(); }).catch(function(e){ alert('履歴を 読めませんでした\n' + (e && e.message || e)); }); }
function openHist(id, v){ var w = spHost(), x = (HIST[id] || []).filter(function(q){ return q.v === v; })[0]; if (!w || !x) return;
  w.downloadJsonFromFolderPassFromTekkyo(PART_DIR + '/履歴', x.name).then(function(t){ var d = JSON.parse(t), p = LIB[id];
    if (!confirm('版 ' + v + ' の 中身に 戻します（保存すると 版 ' + ((p.version || 0) + 1) + ' に なります）')) return;
    touch(p); var n = Object.assign(d, { version:p.version || 0, __dirty:1, __base:p.__base }); delete n.thumb; THQ[id] = 0; LIB[id] = n; libSave(); render(); }); }
// ── ファイル ──
$('bFile').onclick = function(){ $('fOpen').click(); };
$('fOpen').onchange = function(){ var f = this.files[0]; this.value = ''; if (!f) return; var r = new FileReader();
  r.onload = function(){ try { var j = JSON.parse(r.result), got = [];
    if (j.schema === 'buzai/1') got = [j]; else if (/^buzai-set/.test(j.schema || '')) { if (BL.isNew(j)) got = j.parts_lib || []; else got = BL.split(j).parts; }
    if (!got.length) { alert('部材（buzai/1）・セット（buzai-set）の ファイルでは ありません'); return; }
    got.forEach(function(p){ if (!p.role) { p.role = BL.roleOf(p.name); p.category = p.role; } if (LIB[p.id] && !confirm('「' + (p.name || p.id) + '」は もう あります。読んだ ものに しますか')) return; p.__dirty = 1; LIB[p.id] = p; });
    libSave(); CUR.sel = got[0].id; CUR.role = roleOfP(got[0]); render(); } catch (e) { alert('読めませんでした：' + e.message); } }; r.readAsText(f, 'utf-8'); };
$('bKumi').onclick = function(){ window.open('kumitate.html', 'kumitate'); };
$('where').textContent = spHost() ? '☁️ SharePoint と つながって います' : 'この 端末だけ（SharePoint は 業務アプリから 開いた とき）';
window.addEventListener('beforeunload', function(e){ if (Object.keys(LIB).some(function(id){ return LIB[id].__dirty; })) { e.preventDefault(); e.returnValue = ''; } });
render(); if (spHost()) spLoad(false);
</script>
