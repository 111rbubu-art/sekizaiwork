.msbox{margin:6px 0 8px;padding:9px 12px;border-radius:8px;background:#c0392b;color:#fff;font-size:14px;font-weight:700;line-height:1.5}.msbox small{display:block;font-size:12px;font-weight:400}.sl.ms{background:#fff5f5;border-radius:6px;box-shadow:inset 4px 0 0 #c0392b}.sl.ms .mst{color:#c0392b;font-weight:700;font-size:12px}.sl.ms .msb{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.sl.ms .msb .btn{font-size:12px;padding:4px 9px;background:#fff;border:1px solid #c0392b;color:#c0392b;font-weight:700}.sl.ms .msb .btn.mp{background:#c0392b;color:#fff}
.sl .ux{border:1px solid #e5b4ae;color:#c0392b;background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;flex:none}.sl .ux:hover{background:#fff5f5}.hdr3{display:flex;align-items:center;gap:8px;justify-content:space-between}.hdr3 .btn{margin:0}.atbox{border:2px solid var(--org);border-radius:10px;background:#fff8f1;padding:8px 10px;margin:0 0 10px}.atbox .row input{width:80px;flex:none;min-width:80px;max-width:80px}
.sl .kms{font-size:12px;color:#555;white-space:nowrap}.sl .kms i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:3px;border:1px solid rgba(0,0,0,.2)}.sl .kms select{font-size:12px;padding:1px 2px;margin-left:2px}
.sl .sim{border:1px solid #7c3aed;color:#5b21b6;background:#faf5ff;border-radius:8px;padding:4px 9px;font-size:12px;white-space:nowrap}
#dCmp>div{width:980px;max-width:96vw;max-height:92vh;overflow:auto}
.cmp{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}.cmp th,.cmp td{border:1px solid #e3e7ee;padding:4px 6px;vertical-align:top;text-align:left}.cmp th{background:#f5f7fa;width:110px;white-space:nowrap}
.cmp td.sz{background:#eef4ff;color:#1e3a8a;font-weight:700}.cmp td.okc{background:#ecfdf3;color:#1d7a3a;font-weight:700}
.cmp td.df{background:#fff4e5;color:#7a3e00;font-weight:700}.cmp .pc{height:150px}.cmp .pc svg{width:100%;height:100%}
.det{width:450px;flex:none;background:#fff;border-left:3px solid var(--org);overflow:auto;padding:0 14px 12px;display:none}.main.wdet .det{display:block}
.main.wdet .bigp{aspect-ratio:auto;height:230px}.det .dh b{white-space:nowrap}
.det .dh{position:sticky;top:0;z-index:2;background:#fff7ef;border-bottom:1px solid #f3d3b0;margin:0 -14px 10px;padding:8px 14px;display:flex;align-items:center;gap:8px}.det .dh b{font-size:14px}.det .dh .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px}
.sl.pk{cursor:pointer;border-radius:6px}.sl.pk:hover{background:#f5f8fc}.sl.on{background:#fff3e6;box-shadow:inset 4px 0 0 var(--org)}
@media (max-width:1100px){.right{width:380px}.left{width:170px}}
@media (max-width:1500px){.main.wdet .left{display:none}}
@media (max-width:1250px){.main.wdet .mid{display:none}}

<div class="dlg" id="dNew"><div><b style="font-size:16px">新しい 部材</b>

<script>
var APP_VER = 'v0.3.36';
// 部材マスター：部材ライブラリ（buzai/1）の 一覧・名前や 役目の 直し・複製・新しく・保存（版と 履歴）。
// 形と 図面は 図面アプリ（zumen.html#pd）で 直し、ここへ 戻す。加工図面の 見本は zumen.html#km（この 部材 だけ）。
// 部材は この 端末（kumitate.lib・組み立てと 同じ）と SharePoint（/業務アプリ/部材ライブラリ/部材/<id>.json、履歴/<id>_v<n>.json）
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
// いっぱいの ときは 古い 案件の 下書きを 片づけて もう 1 回。それでも だめなら 1 回だけ 知らせる（v0.3.34。最後に 選んだ 所 buzai.cur は 知らせない）
function lsSet(k, v){ if (BL.lsTry(k, JSON.stringify(v))) return; if (k === 'buzai.cur' || lsSet.told) return; lsSet.told = 1;
  alert(BL.lsFullMsg(k === 'kumitate.sets' ? 'セット' : '部材')); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
var PART_DIR = '/業務アプリ/部材ライブラリ/部材', LIB = lsGet('kumitate.lib') || {}, SETS = lsGet('kumitate.sets') || [];
var CUR = { role:'', sel:'', st:'', tag:'', q:'', sk:'', sid:'' }, Z3 = null, THQ = {}, HIST = {};
try { var c0 = lsGet('buzai.cur'); if (c0) { CUR.role = c0.role || ''; CUR.sel = c0.sel || ''; CUR.sk = c0.sk || ''; CUR.sid = c0.sid || ''; } } catch (e) {}
(function(){ var m = /sk=(tower|fence)/.exec(location.hash || ''); if (m) { CUR.sk = m[1]; CUR.sid = ''; } })();
// ── 組み立てと つなぐ（枠の 中なら 組み立てタブ、単独なら 開いた 組み立ての 窓）v0.3 ──
function kumi(fn){ if (SKP && SKP.kumi) { SKP.kumi(function(w){ fn(w && w.kmMaster ? w : null); }); return; }
  var w = null; try { w = window.opener && !window.opener.closed && window.opener.kmMaster ? window.opener : null; } catch (e) { w = null; } fn(w); }
function toKumi(){ if (SKP && SKP.back) { SKP.back(); return; } if (skGo('kumi')) return; try { window.opener.focus(); } catch (e) {} }
var KSEL = {}, KUMI_OK = false;
function refreshSel(then){ kumi(function(w){ KUMI_OK = !!w; if (w) KSEL = w.kmMaster.sel(); if (then) then(); }); }
// セットを 組んだ 形の サムネ（組み立てで 作る。セットの 版と 部材の 版が 同じ あいだは 覚えた ものを 使う）
var SETTH = lsGet('buzai.setThumbs') || {}, STQ = {};
function setSig(S){ return 'k3:' + (S.version || 0) + ':' + (S.slots || []).map(function(sl){ var q = sl.part && LIB[sl.part.id]; var a = sl.at || {}; return sl.key + '=' + (sl.part && sl.part.id) + '@' + (q ? q.version || 0 : 0) + (sl.mirror ? 'm' : '') + (sl.w || '') + 'x' + (sl.d || '') + 'x' + (sl.h || '') + '/' + (a.x || 0) + ',' + (a.y || 0) + ',' + (a.z || 0); }).join(','); }
function setPic(S){ var c = SETTH[S.id]; return c && c.svg ? c.svg : ''; }
function makeSetThumbs(list){
  var need = list.filter(function(S){ var c = SETTH[S.id]; return (!c || c.sig !== setSig(S)) && !STQ[S.id]; }); if (!need.length) return;
  need.forEach(function(S){ STQ[S.id] = 1; });
  kumi(function(w){ if (!w) { need.forEach(function(S){ STQ[S.id] = 0; }); return; }
    w.kmMaster.setThumbs(need.map(function(S){ return S.id; }), 240).then(function(r){
      // モデリングに まだ 届いて いない セット（作った ばかり・コピー）は 絵が 来ない。すぐ 頼み直すと 止まらなく なる ので 少し あとで（v0.3.26）
      var got = 0; need.forEach(function(S){ if (r[S.id]) { STQ[S.id] = 0; SETTH[S.id] = { sig:setSig(S), svg:r[S.id] }; got++; } else { STQ[S.id] = 2; setTimeout(function(){ STQ[S.id] = 0; if (CUR.sk) renderMid(); }, 1500); } });
      if (!got) return; try { localStorage.setItem('buzai.setThumbs', JSON.stringify(SETTH)); } catch (e) {}
      if (CUR.sk) { renderMid(); renderRight(); } }).catch(function(){ need.forEach(function(S){ STQ[S.id] = 0; }); }); });
}
var SKN = { tower:'石塔', fence:'外柵' };
function setsOf(kd){ return SETS.filter(function(S){ return S.kind === kd; }).sort(function(a, b){ return String(a.name).localeCompare(String(b.name), 'ja'); }); }
// 組み立てから 開く（{ sk:'tower' } で その セットの 一覧）
// セットを 直す 画面から 開いた とき（{ id, name }）／null＝ふつうの モデリングから（v0.3.31 本人「マスター編集で 部材を 足すために 部材マスターを 使う」）
var SEF = null;
