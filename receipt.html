<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>領収書</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:#eef2f6;color:#222;font-size:13px}
input,select,button{font-family:inherit;font-size:inherit;color:inherit}

/* ── 画面上の操作バー（印刷には出ない） ───────────────── */
.tb{display:flex;gap:8px;align-items:center;padding:8px 14px;background:#1a2535;color:#fff;
    position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.2);flex-wrap:wrap}
.tb h1{font-size:14px;font-weight:600;letter-spacing:.05em;margin-right:6px}
.tb .ver{font-size:10px;opacity:.6}
.tb .lbl{font-size:11px;opacity:.75;margin-left:4px}
.tb button{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.30);
    padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px}
.tb button:hover{background:rgba(255,255,255,.22)}
.tb .pr{background:#1a5a9a;border-color:#1a5a9a}
.tb .pr:hover{background:#2670b8}
.tb .seg{display:flex;gap:0;border:1px solid rgba(255,255,255,.30);border-radius:5px;overflow:hidden}
.tb .seg button{border:none;border-radius:0;padding:6px 14px}
.tb .seg button.on{background:#e6a700;color:#1a2535;font-weight:700}
.tb .sp{flex:1}
.hint{padding:6px 14px;background:#fff8c4;color:#7a5a00;font-size:11px;border-bottom:1px solid #e8d68a}

/* ── 用紙 ────────────────────────────────────────────
   用紙はA4。領収書はその縦1/3（99mm）に収める。 */
@page{size:A4 portrait;margin:0}
.sheet{width:210mm;height:297mm;background:#fff;margin:16px auto;
       box-shadow:0 4px 20px rgba(0,0,0,.25);position:relative;overflow:hidden}

/* 領収書の本体。飾り枠（.rc-deco）は用紙の端から4mm内側に描くので、
   中身はさらに内側に置いて、切り取り線まで余裕を残す。 */
.rc{height:99mm;position:relative;overflow:hidden;
    font-family:'Yu Mincho','游明朝','Hiragino Mincho ProN','MS PMincho',serif;color:#1c1a14}
.rc-deco{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.rc-in{position:absolute;left:0;top:0;width:100%;height:100%;
       padding:7mm 17mm 7mm;display:flex;flex-direction:column}

/* 切り取り線（目印は線の上に置く。切ったときに文字が割れないように） */
.cut{position:absolute;left:0;right:0;top:99mm;border-top:1px dashed #b0a88c}
.cut::after{content:"✂ 切り取り";position:absolute;left:8mm;top:-4.2mm;
            padding:0 2mm;font-size:7pt;color:#a89a72;font-family:sans-serif}

.rc-hd{display:flex;align-items:flex-end;margin-bottom:2.5mm}
.rc-ttl{flex:1;text-align:center;font-size:19pt;font-weight:bold;letter-spacing:.55em;text-indent:.55em;
        color:#2a2418}
.rc-ttl-u{display:block;width:44mm;margin:1.2mm auto 0;border-top:0.7mm double #9c8546}
.rc-no{font-size:8.5pt;white-space:nowrap;color:#4a412c;padding-bottom:1mm}

/* 宛名。下線は行そのものに引くので「様／御中」も名前と同じ高さに並ぶ */
.rc-to-wrap{display:flex;margin-bottom:3.5mm}
.rc-to-row{flex:0 1 118mm;display:flex;align-items:baseline;gap:3mm;
           border-bottom:0.4mm solid #6d5c30;padding:0 2mm 1.6mm}
.rc-to{flex:1;font-size:13.5pt;min-height:6mm}
.rc-hon{font-size:11.5pt;white-space:nowrap;cursor:pointer;border-radius:2px;padding:0 .5mm}
.rc-hon:hover{background:#fff1b8}

.rc-amt-row{display:flex;align-items:center;gap:4mm;margin-bottom:1.8mm}
.rc-amt-lbl{font-size:12pt;font-weight:bold;letter-spacing:.25em}
.rc-amt{flex:1;border:0.7mm double #6d5c30;background:rgba(255,255,255,.55);
        padding:1.8mm 4mm;font-size:16.5pt;font-weight:bold;text-align:right;letter-spacing:.05em}
.rc-amt::before{content:"¥ ";font-size:11.5pt}
.rc-amt::after{content:" －";font-size:11.5pt}
.rc-tax{font-size:8.5pt;color:#4a412c;margin-bottom:2mm;text-align:right}

.rc-note-row{display:flex;align-items:baseline;gap:2mm;margin-bottom:1.8mm}
.rc-note-lbl{font-size:10.5pt;font-weight:bold;white-space:nowrap}
.rc-note{flex:1;border-bottom:0.3mm solid #6d5c30;padding:0 2mm 1mm;font-size:10.5pt;min-height:5mm}
.rc-recv{font-size:10pt;margin-bottom:auto;letter-spacing:.08em}

.rc-ft{display:flex;align-items:flex-end;gap:4mm}
.rc-stamp-box{width:19mm;height:19mm;border:0.3mm solid #9c8546;text-align:center;line-height:1.25;
              display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm}
.rc-stamp-cap{font-size:6.5pt;color:#9c8546}
.rc-stamp-amt{font-size:8.5pt;font-weight:bold;color:#6d5c30}
.rc-ft-sp{flex:1}
.rc-issuer{font-size:8.5pt;line-height:1.5;position:relative;padding-right:26mm}
.rc-date{font-size:9.5pt;margin-bottom:1.2mm}
.rc-company{font-size:11pt;font-weight:bold;letter-spacing:.05em}
/* 社印は実物と同じ24mm角で刷る */
.rc-seal{position:absolute;right:0;bottom:0;width:24mm;height:24mm;object-fit:fill}

/* 画面上で直せる場所を分かるようにする（印刷には出ない） */
[contenteditable]{cursor:text;border-radius:2px}
[contenteditable]:hover{background:#fff1b8}
[contenteditable]:focus{background:#ffeb9c;outline:2px solid #e6a700;outline-offset:1px}

@media print{
  body{background:#fff}
  .tb,.hint{display:none!important}
  .sheet{margin:0;box-shadow:none;width:210mm;height:296mm;
         break-inside:avoid;page-break-inside:avoid;page-break-after:avoid}
  [contenteditable]:hover,[contenteditable]:focus{background:transparent;outline:none}
  .rc-hon:hover{background:transparent}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="tb">
  <h1>🧾 領収書</h1><span class="ver">v1.2</span>
  <span id="segWrap" class="seg" style="display:none"></span>
  <span class="lbl">敬称</span>
  <span class="seg">
    <button id="honSama" onclick="setHonorific('様')">様</button>
    <button id="honOnchu" onclick="setHonorific('御中')">御中</button>
  </span>
  <span class="sp"></span>
  <button onclick="resetAll()">↺ 元に戻す</button>
  <button class="pr" onclick="window.print()">🖨️ 印刷</button>
</div>
<div class="hint">黄色くなる場所（宛名・金額・日付・但し書き）はクリックして直せます。金額を直すと内消費税も計算し直します。敬称は上のボタン、または用紙の「様」を押しても切り替わります。No.は4桁で自動採番、収入印紙の額は金額から自動で出します。</div>

<div class="sheet">
  <div class="rc">
    <!-- 飾り枠と地紋。画像ファイルを使わないので単独で開いても崩れない -->
    <svg class="rc-deco" viewBox="0 0 210 99" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="rcPaper" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#fdfbf4"/>
          <stop offset="0.55" stop-color="#faf5e8"/>
          <stop offset="1" stop-color="#f4eeda"/>
        </linearGradient>
        <pattern id="rcLattice" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <path d="M0 0 V5" stroke="#c3ab6c" stroke-width="0.12" opacity="0.30"/>
          <path d="M0 0 H5" stroke="#c3ab6c" stroke-width="0.12" opacity="0.30"/>
        </pattern>
        <radialGradient id="rcGlow" cx="0.5" cy="0.42" r="0.72">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <!-- 四隅の飾り（一つ描いて向きを変えて使い回す） -->
        <g id="rcOrn" fill="none" stroke="#a08a4c" stroke-width="0.25">
          <path d="M0 7 L0 2.4 Q0 0 2.4 0 L7 0"/>
          <circle cx="2.9" cy="2.9" r="0.95" fill="#bda972" stroke="none"/>
        </g>
      </defs>

      <rect width="210" height="99" fill="url(#rcPaper)"/>
      <rect width="210" height="99" fill="url(#rcLattice)"/>
      <rect width="210" height="99" fill="url(#rcGlow)"/>

      <rect x="4" y="4" width="202" height="91" fill="none" stroke="#9c8546" stroke-width="0.6"/>
      <rect x="5.7" y="5.7" width="198.6" height="87.6" fill="none" stroke="#bda972" stroke-width="0.22"/>

      <use href="#rcOrn" transform="translate(8.4,8.4)"/>
      <use href="#rcOrn" transform="translate(201.6,8.4) scale(-1,1)"/>
      <use href="#rcOrn" transform="translate(8.4,90.6) scale(1,-1)"/>
      <use href="#rcOrn" transform="translate(201.6,90.6) scale(-1,-1)"/>
    </svg>

    <div class="rc-in">
      <div class="rc-hd">
        <div class="rc-ttl">領収書<span class="rc-ttl-u"></span></div>
        <div class="rc-no">No. <span id="rcNo" contenteditable="true"
             onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"></span></div>
      </div>

      <div class="rc-to-wrap">
        <div class="rc-to-row">
          <span class="rc-to" id="rcName" contenteditable="true"></span>
          <span class="rc-hon" id="rcHon" title="クリックで「様」と「御中」を切り替えます" onclick="toggleHonorific()">様</span>
        </div>
      </div>

      <div class="rc-amt-row">
        <span class="rc-amt-lbl">金額</span>
        <span class="rc-amt" id="rcAmt" contenteditable="true"
              onblur="onAmtEdit()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"></span>
      </div>
      <div class="rc-tax">（内消費税等（10%） ¥<span id="rcTax">0</span>）</div>

      <div class="rc-note-row">
        <span class="rc-note-lbl">但し</span>
        <span class="rc-note" id="rcNote" contenteditable="true"></span>
      </div>
      <div class="rc-recv">上記正に領収いたしました</div>

      <div class="rc-ft">
        <div class="rc-stamp-box">
          <span class="rc-stamp-cap">収入印紙</span>
          <span class="rc-stamp-amt" id="rcStamp"></span>
        </div>
        <div class="rc-ft-sp"></div>
        <div class="rc-issuer">
          <div class="rc-date"><span id="rcDate" contenteditable="true"
               onblur="onDateEdit()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"></span></div>
          <div class="rc-company">有限会社　庄司石材店</div>
          <div>〒168-0082　東京都杉並区久我山5-5-12</div>
          <div>TEL 03-3333-8451　／　FAX 03-3333-8452</div>
          <div>登録番号：T7011302004722</div>
          <img class="rc-seal" src="syastamp.png" alt="" onerror="this.style.display='none'">
        </div>
      </div>
    </div>
  </div>
  <div class="cut"></div>
</div>

<script>
/* 業務アプリから受け取る内容。単独で開いたときは空の領収書になる。 */
var DATA = { mode: 'kouji', name: '', honorific: '様',
             variants: [{ key:'main', label:'工事代金', amount:0, date:'', note:'' }] };
try {
  var raw = sessionStorage.getItem('receiptData');
  if (raw) {
    var p = JSON.parse(raw);
    if (p && p.variants && p.variants.length) DATA = p;
  }
} catch (e) {}
if (!DATA.honorific) DATA.honorific = '様';

var curKey = DATA.variants[0].key;

function $(id){ return document.getElementById(id); }
function cur(){
  for (var i = 0; i < DATA.variants.length; i++) if (DATA.variants[i].key === curKey) return DATA.variants[i];
  return DATA.variants[0];
}
function num(s){
  var n = parseInt(String(s == null ? '' : s).replace(/[,，¥￥\s－-]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}
function comma(n){ return (n || 0).toLocaleString('ja-JP'); }

/* 税込の金額から内消費税を出す。1円未満は切り捨て（税額は切り捨てが通例）。 */
function innerTax(total){ return total > 0 ? Math.floor(total - total / 1.1) : 0; }

/* 領収書に貼る収入印紙の金額（印紙税法 第17号文書＝売上代金の受取書）。
   この用紙は消費税額を分けて書いているので、税抜の金額で判定する。
   [その金額まで, 印紙の額] を上から見ていく。 */
var STAMP_TAX = [
  [1000000, 200], [2000000, 400], [3000000, 600], [5000000, 1000],
  [10000000, 2000], [20000000, 4000], [30000000, 6000], [50000000, 10000],
  [100000000, 20000], [200000000, 40000], [300000000, 60000]
];
function stampDuty(netAmount){
  if (netAmount < 50000) return 0;   // 税抜5万円未満は非課税
  for (var i = 0; i < STAMP_TAX.length; i++) if (netAmount <= STAMP_TAX[i][0]) return STAMP_TAX[i][1];
  return 100000;                     // 3億円超（まず出ないが念のため）
}
function renderStamp(total){
  var net = total - innerTax(total);          // 税抜の金額
  var duty = stampDuty(net);
  $('rcStamp').textContent = duty ? '¥' + comma(duty) : '不要';
}

/* No. は4桁で自動採番する（あとから書き換えられる） */
function newReceiptNo(){ return String(1000 + Math.floor(Math.random() * 9000)); }

function jpDate(iso){
  if (!iso) return '';
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(iso);
  return m[1] + '年' + parseInt(m[2], 10) + '月' + parseInt(m[3], 10) + '日';
}

function render(){
  var v = cur();
  if (!v.no) v.no = newReceiptNo();   // 種別ごとに別の番号を振る
  $('rcNo').textContent   = v.no;
  $('rcName').textContent = DATA.name || '';
  $('rcAmt').textContent  = comma(v.amount);
  $('rcTax').textContent  = comma(innerTax(v.amount));
  $('rcNote').textContent = v.note || '';
  $('rcDate').textContent = jpDate(v.date);
  renderStamp(v.amount);
  renderHonorific();
  // 種別が2つ以上あるときだけ切り替えボタンを出す（納骨リスト）
  var wrap = $('segWrap');
  if (DATA.variants.length > 1) {
    wrap.style.display = '';
    wrap.innerHTML = DATA.variants.map(function (x) {
      return '<button class="' + (x.key === curKey ? 'on' : '') + '" onclick="switchVariant(\'' + x.key + '\')">' + x.label + '</button>';
    }).join('');
  } else {
    wrap.style.display = 'none';
  }
}

/* 宛名の敬称（様／御中） */
function renderHonorific(){
  $('rcHon').textContent = DATA.honorific;
  $('honSama').className  = DATA.honorific === '様'   ? 'on' : '';
  $('honOnchu').className = DATA.honorific === '御中' ? 'on' : '';
}
function setHonorific(h){ DATA.honorific = h; renderHonorific(); }
function toggleHonorific(){ setHonorific(DATA.honorific === '様' ? '御中' : '様'); }

function switchVariant(k){
  // 直した内容は種別ごとに覚えておく
  saveEdits();
  curKey = k;
  render();
}

/* 画面で直した内容を、いまの種別に書き戻す */
function saveEdits(){
  var v = cur();
  DATA.name = $('rcName').textContent.trim();
  v.amount  = num($('rcAmt').textContent);
  v.note    = $('rcNote').textContent.trim();
  v.no      = $('rcNo').textContent.trim();
  var t = $('rcDate').textContent.trim();
  if (t) v.date = t;      // 和暦・自由入力もそのまま残す
}

function onAmtEdit(){
  var n = num($('rcAmt').textContent);
  cur().amount = n;
  $('rcAmt').textContent = comma(n);
  $('rcTax').textContent = comma(innerTax(n));
  renderStamp(n);
}
function onDateEdit(){
  var t = $('rcDate').textContent.trim();
  // 2026-05-12 のように入れたら、日本語の表記に整える
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) $('rcDate').textContent = jpDate(t);
  cur().date = $('rcDate').textContent.trim();
}

function resetAll(){
  if (!window.confirm('画面で直した内容を捨てて、業務アプリから渡された内容に戻します。\n\nよろしいですか？')) return;
  try {
    var raw = sessionStorage.getItem('receiptData');
    if (raw) DATA = JSON.parse(raw);
  } catch (e) {}
  if (!DATA.honorific) DATA.honorific = '様';
  curKey = DATA.variants[0].key;
  render();
}

['rcName', 'rcNote', 'rcNo'].forEach(function (id) {
  $(id).addEventListener('blur', saveEdits);
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
  });
});

render();
</script>
</body>
</html>
