<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墓石新規 見積書・請求書</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Meiryo',sans-serif;background:#eef2f6;color:#222;font-size:13px}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ── トップバー（見積書・撤去見積と同じ形） ───────────────── */
.topbar{display:flex;gap:8px;align-items:center;padding:6px 14px;background:#1a2535;color:#fff;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.2);flex-wrap:wrap}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:.05em}
.topbar .ver{font-size:10px;opacity:.6;margin-right:4px}
.topbar .sp{flex:1}
.btn{font-size:12px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;border-radius:3px}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.pr{background:#1a5a9a;border-color:#1a5a9a}
.btn.pr:hover{background:#2470b3}
.btn.dirty{background:#c0392b;border-color:#c0392b}
.btn-mode{background:#2d7a3d;border-color:#2d7a3d}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;color:#fff;padding:5px 10px;cursor:pointer;font-size:12px}
.seg button.on{background:#e6a700;color:#1a2535;font-weight:700}

/* 読込の 一覧・PDF の 保存先を 聞く 窓 */
.dlg-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column}
.dlg.wide{max-width:980px}
.dlg h3{font-size:14px;padding:12px 16px;border-bottom:1px solid #e1e6ec;color:#1a2535}
.dlg .body{padding:10px 16px;overflow:auto;font-size:13px}
.dlg .foot{padding:10px 16px;border-top:1px solid #e1e6ec;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg .foot button,.dlg .choice{font-size:13px;padding:7px 14px;border-radius:5px;border:1px solid #b8c4d2;background:#fff;cursor:pointer}
.dlg .foot button.pr{background:#1a5a9a;border-color:#1a5a9a;color:#fff}
.dlg .choice{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px}
.dlg .choice:hover{background:#f0f5fb;border-color:#3a85d0}
.dlg .choice b{display:block;font-size:14px;color:#1a2535;margin-bottom:2px}
.dlg .choice span{font-size:11px;color:#7a8696}
table.dl{width:100%;border-collapse:collapse;font-size:12px}
table.dl th{font-size:11px;color:#556;font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid #d6dde6;white-space:nowrap}
table.dl td{padding:7px 6px;border-bottom:1px solid #eef1f5;vertical-align:top}
table.dl tr.r{cursor:pointer}
table.dl tr.r:hover td{background:#eef5fd}
table.dl td.m{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.dl .sub{font-size:10px;color:#8a95a3}
table.dl .kd{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#e6f1fb;color:#185fa5;white-space:nowrap;margin:0 2px 2px 0}

/* ── 画面：入力（左）と 見本（右） ───────────────── */
.main{display:flex;gap:14px;padding:12px;align-items:flex-start}
.colL{width:520px;flex:none;display:flex;flex-direction:column;gap:10px}
.colR{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:52px}
@media (max-width:1150px){ .main{flex-direction:column} .colL{width:100%} .colR{position:static} }
.panel{background:#fff;border:1px solid #d6dde6;border-radius:6px;padding:10px 12px}
.panel h2{font-size:13px;color:#1a2535;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.panel h2 .amt{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:#1a5a9a}
.panel h2 .tw{font-size:10px;color:#99a;width:10px}
.panel h2 .note{font-size:11px;font-weight:400;color:#7a8696}
.panel .pb{margin-top:8px}
.panel.closed .pb{display:none}
.fields{display:grid;grid-template-columns:84px 1fr 84px 1fr;gap:6px 8px;align-items:center}
.fields label{font-size:11px;color:#556;text-align:right}
.fields input,.fields select,.fields textarea{border:1px solid #c8d0da;border-radius:3px;padding:4px 6px;width:100%;background:#fff}
.fields .span3{grid-column:span 3}
.fields .inl{display:flex;gap:4px;align-items:center}
.fields .inl input{width:72px}
.fields .inl span{font-size:11px;color:#556;white-space:nowrap}

.grp{border-top:1px dashed #e1e6ec;padding:6px 0 4px}
.grp:first-child{border-top:none;padding-top:0}
.grp .gt{font-size:11px;font-weight:700;color:#445;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.grp .gt .outs{margin-left:auto;font-weight:400;color:#1a5a9a;font-variant-numeric:tabular-nums;text-align:right}
.grp .gt .outs b{font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px}
.kv .f{display:flex;align-items:center;gap:4px;font-size:12px}
.kv .f .l{flex:1;color:#445;font-size:11px;line-height:1.2}
.kv .f input,.kv .f select{width:84px;border:1px solid #c8d0da;border-radius:3px;padding:3px 5px;text-align:right;background:#fff}
.kv .f select{text-align:left}
.kv .f .u{font-size:10px;color:#889;width:22px}
.kv .f.wide{grid-column:span 2}
.kv .f.wide input{width:100%;text-align:left}
.kv .f input.pct{width:56px;background:#fffaf0}
.kv .f input.ov{background:#fffbe6}

table.oth{width:100%;border-collapse:collapse;font-size:12px}
table.oth th{background:#eef2f6;font-weight:600;font-size:11px;color:#445;padding:3px;border:1px solid #d6dde6}
table.oth td{border:1px solid #e1e6ec;padding:1px}
table.oth input{width:100%;border:none;padding:4px;background:transparent}
table.oth td.num input{text-align:right}
table.oth td.amt{text-align:right;padding:0 6px;background:#f6f8fa;white-space:nowrap}

.sum{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12px;margin-top:4px}
.sum .k{color:#556}
.sum .v{text-align:right;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:700;font-size:14px;color:#1a2535}
.sum input{width:120px;text-align:right;border:1px solid #c8d0da;border-radius:3px;padding:2px 4px}
.warn{color:#b03a2e;font-size:11px;margin-top:4px;white-space:pre-line}
.subtle{font-size:11px;color:#7a8696;margin-top:4px;line-height:1.5}
.mini{font-size:11px;padding:2px 8px;border:1px solid #b8c4d2;background:#fff;border-radius:3px;cursor:pointer}
.mini:hover{background:#f0f5fb}
textarea.memo{width:100%;min-height:62px;border:1px solid #c8d0da;border-radius:3px;padding:5px 6px;font-size:12px;line-height:1.5;resize:vertical}
textarea.greet{min-height:200px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px}
table.prof{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
table.prof th,table.prof td{padding:3px 5px;border-bottom:1px solid #eef1f5;text-align:right;white-space:nowrap}
table.prof th{color:#556;font-weight:600}
table.prof td:first-child,table.prof th:first-child{text-align:left}
table.prof tr.t td{font-weight:700;border-top:1px solid #c8d0da}

/* 単価マスタ */
.mst-status{font-size:11px;padding:6px 8px;border-radius:4px;margin-bottom:8px;background:#f3f5f8;color:#445}
.mst-status.ok{background:#e9f6ec;color:#22603a}
.mst-status.warn,.mst-status.dirty{background:#fff6e0;color:#7a5200}
.mst-status.err{background:#fdecea;color:#9a2b20}
.mst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.mst-box{border:1px solid #d6dde6;border-radius:5px;padding:6px 8px}
.mst-box.wide{grid-column:span 2}
.mst-box h4{font-size:12px;color:#1a2535;margin-bottom:4px}
.mst-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
.mst-row .l{flex:1;color:#445;min-width:96px}
.mst-row input{width:80px;text-align:right;border:1px solid #c8d0da;border-radius:3px;padding:2px 4px;font-size:12px}
.mst-row input.s{width:62px}
.mst-row .u{width:44px;color:#889;font-size:10px}
.mst-row .calc{width:70px;text-align:right;color:#1a5a9a;font-size:10px}
.mst-h{display:flex;gap:6px;font-size:10px;color:#889;padding-bottom:2px;border-bottom:1px solid #eef1f5}
.mst-h .l{flex:1}

/* ── 用紙（A4 横）。Excel「出力」シートの 列幅・行の高さを そのまま 写し、
   Excel と 同じく 1 枚に 収まる 倍率で 置く（JS の paperGeom）。位置は すべて mm ───── */
.page{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.22);flex:none;color:#000}
.pv-wrap{transform-origin:top center}
.cx{position:absolute;display:flex;overflow:hidden;white-space:pre;line-height:1.1}
.cx.ov{overflow:visible}
.cx.nmb{width:auto;justify-content:flex-start;align-items:flex-end}
.cx.nmb .nm{min-width:2em;text-align:center;flex:none}
.cx.nmb .hn{margin-left:1em;flex:none}          /* 結合して いない セルは Excel と 同じく となりへ はみ出す */
.fm{font-family:'ＭＳ Ｐ明朝','MS PMincho','Yu Mincho','游明朝','Hiragino Mincho ProN',serif}
.fg{font-family:'HGSｺﾞｼｯｸM','HGSGothicM','ＭＳ Ｐゴシック','MS PGothic','Yu Gothic','游ゴシック','Hiragino Kaku Gothic ProN',sans-serif}
.ln{position:absolute;box-sizing:border-box}
.pimg{position:absolute}
.p-memo{position:absolute;white-space:pre-wrap;line-height:1.35;overflow:hidden}
.p2-body{position:absolute;white-space:pre-wrap;line-height:1.5}

@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  .topbar,.colL{display:none !important}
  .main{padding:0;display:block}
  .colR{display:block}
  .pv-wrap{transform:none !important;height:auto !important}
  .page{box-shadow:none;page-break-after:always;margin:0}
}
body.pdf-mode .page{box-shadow:none}

.toast{position:fixed;right:16px;bottom:16px;background:#1a2535;color:#fff;padding:10px 16px;border-radius:6px;
  font-size:13px;white-space:pre-line;z-index:500;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.ok{background:#2d7a3d}
.toast.ng{background:#b03a2e}
</style>
</head>
<body>

<div class="topbar">
  <h1>🪦 墓石新規 見積書・請求書</h1>
  <span class="ver">v1.1</span>
  <span class="seg" id="kindSeg"></span>
  <span class="sp"></span>
  <button class="btn" onclick="openMaster()" title="原価計算の 単価（全員で 共有）">⚙ 単価マスタ</button>
  <button class="btn btn-mode" onclick="loadDraft()" title="案件の フォルダーに 保存した 見積を 一覧から 選んで 開く">📂 読込</button>
  <button class="btn btn-mode" id="save_btn" onclick="saveDraft()" title="案件の フォルダー（SharePoint）に 保存">💾 保存</button>
  <button class="btn btn-mode" onclick="exportPdf()" title="PDF保存（保存先を 聞きます：SharePoint の 提出資料／このパソコン）">📑 PDF保存</button>
  <button class="btn" onclick="newDraft()">🆕 新規</button>
  <button class="btn pr" onclick="printDoc()">🖨 印刷</button>
</div>

<div class="main">
  <div class="colL" id="colL"></div>
  <div class="colR" id="pvCol"><div class="pv-wrap" id="pvWrap"></div></div>
</div>

/* Excel の TEXT(日付,"ge.m.d") と同じ（R8.10.27） */
function wareki(iso){
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '';
  var y = +m[1], mo = +m[2], d = +m[3];
  var g = (y > 2019 || (y === 2019 && mo >= 5)) ? ['R', y - 2018] : ['H', y - 1988];
  return g[0] + g[1] + '.' + mo + '.' + d;
}
function ymd8(iso){ return String(iso || todayISO()).replace(/-/g, ''); }
/* Excel の ROUNDUP（0 から 遠い ほうへ）。浮動小数の くずれ（39000.0000001 など）で 1 桁 上がらない ように 丸めてから */
function roundup(x, d){
  var p = Math.pow(10, -d), y = Math.round(x / p * 1e9) / 1e9;
  return (y >= 0 ? Math.ceil(y) : -Math.ceil(-y)) * p;
}

function shrinkToFit(){

    if (el.scrollWidth <= el.clientWidth + 1) return;
    var fs = parseFloat(el.style.fontSize), min = fs * (el.classList.contains('nmb') ? 0.35 : 0.55);

var PDF_LIBS = [
  { url: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', ready: function(){ return !!window.html2canvas; } },

function ensurePdfLibs(){
  return new Promise(function(resolve, reject){
    (function next(i){
      if (i >= PDF_LIBS.length) { resolve(); return; }
      if (PDF_LIBS[i].ready()) { next(i + 1); return; }
      var s = document.createElement('script');
      s.src = PDF_LIBS[i].url;
      s.onload = function(){ next(i + 1); };
      s.onerror = function(){ reject(new Error('部品の読み込みに失敗しました\n' + PDF_LIBS[i].url)); };
      document.head.appendChild(s);
    })(0);
  });
}

  return Promise.all(imgs.map(function(img){
    var src = img.getAttribute('src');
    if (!src || src.indexOf('data:') === 0) return null;
    var p = _imgCache[src] || (_imgCache[src] = fetch(src).then(function(r){ return r.blob(); }).then(function(b){
      return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ res(null); }; fr.readAsDataURL(b); });
    }).catch(function(){ return null; }));
    return p.then(function(d){
      if (!d) return;
      return new Promise(function(res){ img.onload = res; img.onerror = res; img.src = d; setTimeout(res, 800); });
    });
  }));
}
function renderCanvases(scale){
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  upd();
  var wrap = $('pvWrap'), prevT = wrap.style.transform;
  document.body.classList.add('pdf-mode');
  wrap.style.transform = 'none';
  return ensurePdfLibs().then(inlineImages).then(function(){
    var pages = Array.prototype.slice.call(wrap.querySelectorAll('.page'));
    var out = [];
    return pages.reduce(function(p, el){
      return p.then(function(){
        return window.html2canvas(el, { scale: scale, backgroundColor: '#ffffff', useCORS: true, logging: false })
          .then(function(c){ out.push(c); });
      });
    }, Promise.resolve()).then(function(){ return out; });
  }).finally(function(){
    document.body.classList.remove('pdf-mode');
    wrap.style.transform = prevT;
    fitPreview();
  });
}
function buildPdf(){
  return renderCanvases(2.5).then(function(cs){
    var pdf = new window.jspdf.jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
    cs.forEach(function(c, i){
      if (i) pdf.addPage('a4', 'l');
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210, undefined, 'SLOW');
    });
    return pdf;
  });
}
/* ファイル名は 見積書・撤去見積と 同じ形：種類_お客様_YYYYMMDD（件名が あれば 後ろに） */
function pdfFilename(){
  return KIND[S.kind].file + '_' + (safeName(S.cust) || 'noname') + '_' + ymd8(S.dates[S.kind]) + (safeName(S.subj) ? '_' + safeName(S.subj) : '') + '.pdf';
}
function exportPdf(){
  var fn = pdfFilename();
  var sp = isSpAvailable();
  dlgOpen('📑 PDF の 保存先',
    '<div style="margin-bottom:10px;color:#556">ファイル名：<b>' + esc(fn) + '</b></div>' +
    '<button class="choice" onclick="dlgClose();pdfToSP()"' + (sp ? '' : ' disabled style="opacity:.45;cursor:not-allowed"') + '>' +
      '<b>☁️ SharePoint（案件の 提出資料）</b><span>' + (sp ? esc(FROM.folderPass.replace(/\/+$/, '') + '/提出資料') : 'つながっていません（工事の［🪦 墓石新規 見積］から 開くと 使えます）') + '</span></button>' +
    '<button class="choice" onclick="dlgClose();pdfToPC()"><b>💻 このパソコン（ダウンロード）</b><span>ブラウザの ダウンロード先に 保存します</span></button>');
}
function pdfToSP(){
  if (!spOrWarn()) return;
  var fn = pdfFilename();
  var w = window.opener;
  if (!w.fileExistsInFolderPassFromTekkyo) { alert('業務アプリの 画面が 古いままです。業務アプリを 再読み込みしてから、もう一度 開いてください'); return; }
  var folder = FROM.folderPass.replace(/\/+$/, '') + '/提出資料';
  var t;
  w.fileExistsInFolderPassFromTekkyo(folder, fn).then(function(ex){
    if (ex && !confirm('提出資料に 同じ名前の ファイルが あります。\n\n' + fn + '\n\n上書きしますか？\n（キャンセルで 保存しません）')) return;
    t = toast('PDF を 作っています…');
    return buildPdf().then(function(pdf){
      t.textContent = '提出資料に 保存しています…';
      return w.uploadPdfToFolderPassFromTekkyo(pdf.output('blob'), fn, folder);
    }).then(function(){
      t.remove(); toast('提出資料に 保存しました\n' + fn, 'ok', 3500);
    });
  }).catch(function(e){
    if (t) t.remove();
    toast('保存できませんでした\n' + (e && e.message || e), 'ng', 6000);
  });
}
function pdfToPC(){
  var fn = pdfFilename();
  var t2 = toast('PDF を 作っています…');
  buildPdf().then(function(pdf){ pdf.save(fn); t2.remove(); })
    .catch(function(e){ t2.remove(); toast('PDF を 作れませんでした\n' + (e && e.message || e), 'ng', 6000); });
}
function printDoc(){
  var t = toast('印刷の 用意を しています…');
  renderCanvases(300 / 96).then(function(cs){
    t.remove();
    var old = $('pvPrintFrame'); if (old) old.remove();
    var fr = document.createElement('iframe'); fr.id = 'pvPrintFrame';
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
    document.body.appendChild(fr);
    var d = fr.contentWindow.document;
    d.open();
    /* 用紙と ちょうど 同じ 大きさだと 白紙が 出るので 少しだけ 小さく */
    d.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(pdfFilename().replace(/\.pdf$/, '')) + '</title><style>' +
      '@page{size:A4 landscape;margin:0}html,body{margin:0;padding:0;background:#fff}' +
      'img{display:block;width:296.6mm;height:auto;page-break-after:always}img:last-child{page-break-after:auto}</style></head><body>' +
      cs.map(function(c){ return '<img src="' + c.toDataURL('image/jpeg', 0.92) + '">'; }).join('') + '</body></html>');
    d.close();
    var ims = Array.prototype.slice.call(d.images);
    Promise.all(ims.map(function(im){ return im.complete ? null : new Promise(function(r){ im.onload = r; im.onerror = r; }); })).then(function(){
      try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { window.print(); }
    });
  }).catch(function(){ t.remove(); window.print(); });
}

/* ── はじめ ─────────────────────────── */
(function init(){
  var raw = null;
  try { raw = sessionStorage.getItem('shinkiFrom'); } catch (e) {}
  if (raw) { try { FROM = JSON.parse(raw); } catch (e) {} }
  buildForm();
  try { var loc = JSON.parse(localStorage.getItem('shinki_master') || 'null'); if (loc) MASTER = normalizeMaster(loc); } catch (e) {}
  S = freshState();
  if (FROM) { S.cust = FROM.cust || ''; S.place = FROM.place || ''; }
  else {
    /* 案件なしで 開いたら、前回の 入力を 出す */
    try { var last = JSON.parse(localStorage.getItem('shinki_last') || 'null'); if (last) { S = normalizeState(last); _fromDraft = true; } } catch (e) {}
  }
  toForm();
  upd();
  if (isSpAvailable()) document.title = '墓石新規 見積 - ' + (FROM.cust || '');
  _loading = false; clearDirty();
  masterSync();
})();
</script>
