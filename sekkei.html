<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墓石設計</title>
<style>
/* 墓石設計の タブの 枠（2026-11-10 本人「図面関連の ページを 統一。組み立てと 図面と 加工図面を タブで」「部材マスターは 組み立てから しか 使わない」）
   上の 帯は 共通。帯の 下は 今の 各画面（kumitate.html・zumen.html・buzai.html）を そのまま 入れる。タブを 切り替えても 作業は 消えない */
:root{--bar:#14233a;--tab:#24395a;--tabtx:#c9d6ea;--on:#f6f7f9;--ontx:#14233a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6f7f9;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
#bar{height:44px;background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;white-space:nowrap}
#logo{font-weight:700;font-size:16px}
#ken{background:#ffffff1a;border:1px solid #ffffff40;border-radius:14px;padding:2px 12px;font-size:13px;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
#ken:empty{display:none}
#tabs{display:flex;gap:2px;align-self:flex-end;margin-left:8px}
/* v0.3.5 本人「モデリングか セットを 直す 画面か 分からない」：選んだ タブ＝白＋上に 青い 線、ほかは 暗く。セットを 直す タブは 離して 橙＋「マスター」 */
#tabs button{border:1px solid #2c4266;border-bottom:0;font:inherit;font-size:15px;padding:8px 20px 9px;border-radius:8px 8px 0 0;background:transparent;color:#8ea2c0;cursor:pointer;touch-action:manipulation}
#tabs button:hover{color:#dfe7f3}
#tabs button.on{background:#fff;border-color:#fff;color:var(--ontx);font-weight:700;box-shadow:inset 0 4px 0 #2f7de1}
/* v0.4.0 本人「マスターの 加工図面を 編集する とき、モデリングと 同じ タブだと 混乱する。分けて」→ 案A：右に 橙の「マスター」の まとまり（セットを 直す・マスターの 加工図面）。使わない ときは 全部 隠す */
#mtabs{display:none;gap:2px;align-self:flex-end;margin-left:30px;position:relative;padding-left:0}
#mtabs.on{display:flex}
#mtabs::before{content:'';position:absolute;left:-17px;top:4px;bottom:4px;border-left:2px dashed #ffffff40}
#mtabs .mchip{align-self:center;font-size:11px;background:#e07a1f;color:#fff;border-radius:9px;padding:1px 8px;margin-right:4px}
#mtabs button{font:inherit;font-size:15px;padding:8px 16px 9px;border-radius:8px 8px 0 0;cursor:pointer;touch-action:manipulation;position:relative;border:2px solid #e07a1f;border-bottom:0;background:#e07a1f22;color:#f0a868}
#mtabs button:hover{color:#ffd2a8}
#mtabs button.on{background:#fff;color:#c45f0c;font-weight:700;box-shadow:inset 0 4px 0 #e07a1f}
#mtabs button .x{margin-left:8px;opacity:.75;padding:0 2px}#mtabs button .x:hover{opacity:1}
#main.mk iframe#f_mkakou{border:3px solid #e07a1f;border-top:0}
#mtabs button .sub2{font-size:12px;font-weight:400}#mtabs button .sub2:empty{display:none}
#main.se iframe#f_buzai{border:3px solid #e07a1f;border-top:0}
#main.se iframe#f_sedit{border:3px solid #e07a1f;border-top:0}   /* セットを 直す 画面は ふちも 橙（中の 帯は kumitate の seBar） */
#tabs button .sub{font-size:12px;font-weight:400;color:#56657a}
#tabs button:not(.on) .sub{display:none}
#sp{margin-left:auto;font-size:12px;color:var(--tabtx);overflow:hidden;text-overflow:ellipsis}#sp.off{background:#c0392b;color:#fff;font-weight:700;font-size:14px;padding:4px 10px;border-radius:6px}
#ver{font-size:11px;color:#8ea2c0;overflow:hidden;text-overflow:ellipsis}
#main{position:absolute;left:0;right:0;top:44px;bottom:0}
#main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
#main iframe.on{visibility:visible;z-index:2}
#empty{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:#f6f7f9}
#empty.on{display:flex}
#empty div{max-width:560px;background:#fff;border:1px solid #d3d9e1;border-radius:10px;padding:22px 26px;font-size:15px;line-height:1.8;color:#334}
#empty b{color:var(--ontx)}
#empty button{margin-top:10px;font:inherit;font-size:14px;padding:6px 14px;border-radius:6px;border:1px solid #c3ccd8;background:#fff;cursor:pointer}
@media (max-width:900px){ #ver{display:none} #logo{font-size:14px} #tabs button,#mtabs button{padding:8px 12px 9px;font-size:14px} #mtabs{margin-left:22px} #sp .long{display:none} }
@media (max-width:600px){ #ken,#logo{display:none} #tabs{margin-left:0} }
</style>
</head><body>
<div id="bar">
  <span id="logo">🪨 墓石設計</span>
  <span id="ken" title="案件の 件名（業務アプリから）"></span>
  <div id="tabs">
    <button data-t="kumi" class="on" title="墓所に 部材・セットを 並べる 3D（部材マスターも ここから）">🏯 モデリング<span class="sub" id="subBz"></span></button>
    <button data-t="zumen" title="モデリングの 形の 展開図（平面・正面・側面・背面）。DXF・DWG・mics も ここで 開く">📐 図面</button>
    <button data-t="kakou" title="この お墓の 加工図面（配置図・部品寸法表・詳細図の 束／部材 1 つの 図枠つき 加工図面）。保存は この お墓へ">✏ 加工図面</button>
  </div>
  <div id="mtabs" title="マスター（部材マスター・セット）を 直す タブ。使う ときだけ 出ます"><span class="mchip">マスター</span></div>
  <span id="sp"></span>
  <span id="ver"></span>
</div>
<div id="main">
  <div id="empty"><div><b>加工図面</b>は 次の どれかで 開きます。<br>
    ・モデリングの 3D で 部材を <b>右クリック</b> →［📄 加工図面］<br>
    ・モデリングの［📐 図面に する］で 配置図・部品寸法表・詳細図の 束<br>
    <small>マスター部材の 加工図面は 右の 橙の「マスター」タブで 開きます</small></div></div>
</div>
<script>
var SHELL_VER = 'v0.4.1';
// 各 タブの 画面（はじめて 開く ときに 読む）。図面と 加工図面は zumen.html を 2 つ（自動保存の 鍵を 分けて ある）
var PAGES = { kumi:'kumitate.html?sk=kumi', zumen:'zumen.html?sk=zumen', kakou:'zumen.html?sk=kakou', mkakou:'zumen.html?sk=mkakou', buzai:'buzai.html?sk=buzai' };
var NAMES = { kumi:'モデリング', zumen:'図面', kakou:'加工図面', mkakou:'マスターの 加工図面', buzai:'部材マスター' };
// BZ_FOR＝部材マスターを 開いた 先（'kumi'＝モデリング／'sedit'＝セットを 直す）。v0.3.6 本人「マスター編集で 部材を 足すために 部材マスターを 使う」
var FR = {}, CUR = 'kumi', BZ_ON = false, BZ_FOR = 'kumi', BZ_SE = null, KAKOU_ON = false, WAIT = {};
function $(id){ return document.getElementById(id); }
function frame(t, hash){
  if (FR[t]) return FR[t];
  var f = document.createElement('iframe'); f.id = 'f_' + t; f.title = NAMES[t];
  f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
  f.src = PAGES[t] + (hash || ''); f.addEventListener('load', function(){ f.__ok = true; vers(); (WAIT[t] || []).forEach(function(fn){ try { fn(f.contentWindow); } catch (e) {} }); WAIT[t] = []; });
  $('main').appendChild(f); FR[t] = f; return f;
}
function whenReady(t, fn){ var f = frame(t); if (f.__ok) fn(f.contentWindow); else (WAIT[t] = WAIT[t] || []).push(fn); }
function show(){
  if (BZ_FOR === 'sedit' && !FR.sedit) BZ_FOR = 'kumi';
  var vis = CUR === BZ_FOR && BZ_ON ? 'buzai' : CUR;
  Object.keys(FR).forEach(function(k){ FR[k].classList.toggle('on', k === vis); });
  [].forEach.call(document.querySelectorAll('#tabs button,#mtabs button'), function(b){ b.classList.toggle('on', b.dataset.t === CUR); });
  $('mtabs').classList.toggle('on', !!$('mtabs').querySelector('button'));
  $('subBz').textContent = CUR === 'kumi' && BZ_ON ? '　›　🗂 部材マスター' : '';
  var sb = $('subSe'); if (sb) sb.textContent = CUR === 'sedit' && BZ_ON ? '　›　🗂 部材マスター' : '';
  $('empty').classList.toggle('on', CUR === 'kakou' && !KAKOU_ON);
  $('main').classList.toggle('se', CUR === 'sedit'); $('main').classList.toggle('mk', CUR === 'mkakou');
  var f = FR[vis]; if (f) setTimeout(function(){ try { f.contentWindow.focus(); } catch (e) {} }, 0);   // キー操作（AutoCAD 式の コマンド・Fusion 式の 3D）は 見えて いる タブへ
}
// 枠の 窓口（中の 画面は sekkei-in.js の SKP から 呼ぶ）
var SK = {
  go: function(t, hash){
    if (t === 'buzai') { if (BZ_FOR === 'sedit' && !FR.sedit) bzFor('kumi'); CUR = BZ_FOR; BZ_ON = true; frame(BZ_FOR); frame('buzai'); show(); return; }
    if (t === 'kumi') { BZ_ON = false; bzFor('kumi'); }
    if (t === 'sedit') BZ_ON = false;
    if (t === 'kakou' && /^#(pd|km)/.test(hash || '')) KAKOU_ON = true;
    if (t === 'mkakou') mkTab();
    var f = FR[t];
    if (!f) frame(t, hash);
    else if (hash) { try { f.contentWindow.location.hash = hash; } catch (e) { f.src = PAGES[t] + hash; } }
    CUR = t; show();
  },
  // 加工図面の［✓ 図から 反映して マスターへ 戻る］→ 組み立てタブの 部材マスターに 渡す
  toMaster: function(def, open){ whenReady('buzai', function(w){ if (w.bmTake) w.bmTake(def); }); if (open) SK.go('buzai'); },
  // 部材マスターを 開く（opts＝{ sk:'tower'|'fence' } で セットの 一覧から）・組み立ての 窓へ 頼む（v0.3）
  // se＝{ id, name }：セットを 直す 画面から（その タブの 中で 開き、入れる 先も セットを 直す 画面）v0.3.6
  master: function(opts, se){ bzFor(se && FR.sedit ? 'sedit' : 'kumi', se); whenReady('buzai', function(w){ if (w.bmShow) w.bmShow(opts || null); }); SK.go('buzai'); },
  // 部材マスターから 入れる 先（今 部材マスターを 開いて いる 方の モデリング）
  kumi: function(fn){ whenReady(BZ_FOR === 'sedit' && FR.sedit ? 'sedit' : 'kumi', fn); },
  // 加工図面の［💾 この 墓に 保存］の 渡し先：案件の 加工図面タブ→モデリング、マスターの 加工図面タブ→セットを 直す（v0.4.0）
  kumiOf: function(from, fn){ if (from === 'mkakou') { if (!FR.sedit) return false; whenReady('sedit', fn); return true; } whenReady('kumi', fn); return true; },
  // 部材マスターから 入れる 先へ 戻る
  back: function(){ BZ_ON = false; CUR = BZ_FOR === 'sedit' && FR.sedit ? 'sedit' : 'kumi'; show(); },
  // セットを 直す 画面（v0.3.4・モデリング v0.8.69 本人「マスター修正で 別の モデリング画面に」）：今の 設計の タブは そのまま、別の タブで その セットだけ
  setEdit: function(id, name){ var u = 'kumitate.html?sk=kumi&set=' + encodeURIComponent(id), f = FR.sedit;
    if (f && f.__sid !== id) { f.remove(); delete FR.sedit; f = null; }
    PAGES.sedit = u; NAMES.sedit = 'セットを 直す'; if (!f) { f = frame('sedit'); f.__sid = id; }
    var b = $('mtabs').querySelector('[data-t="sedit"]'); if (!b) { b = document.createElement('button'); b.dataset.t = 'sedit'; b.className = 'se'; $('mtabs').insertBefore(b, $('mtabs').querySelector('[data-t="mkakou"]')); }
    b.title = 'セットだけを 動かして 置き場所を 直す（今の 設計とは 別）'; b.innerHTML = '🧱 ' + String(name || id).replace(/[&<>"]/g, '') + '<span class="sub2" id="subSe"></span><span class="x" title="閉じて 設計に 戻る">✕</span>';
    if (BZ_FOR === 'sedit') bzFor('kumi'); BZ_ON = false; CUR = 'sedit'; show(); },
  setEditClose: function(){ var f = FR.sedit; if (f) { f.remove(); delete FR.sedit; } var b = $('mtabs').querySelector('[data-t="sedit"]'); if (b) b.remove(); bzFor('kumi'); BZ_ON = false; CUR = $('mtabs').querySelector('button') ? 'mkakou' : 'kumi'; show(); },
  kakouState: function(on, nm, tab){ if (tab === 'mkakou') { mkTab(nm); return; } KAKOU_ON = !!on; show(); },
  // 組み立ての［📐 図面に する］：配置図・部品寸法表・詳細図の 束は 加工図面タブ、展開図は 図面タブ（こちらを 見せる）
  // quiet（v0.4.1）：モデリングで データを 読み込んだ とき。見て いる タブは そのまま、図面・加工図面タブを 裏で 作る
  zumenize: function(t, quiet){ KAKOU_ON = true; var f = FR.kakou; if (!f) frame('kakou', '#km' + t); else { try { f.contentWindow.location.hash = '#km' + t; } catch (e) { f.src = PAGES.kakou + '#km' + t; } }
    if (!quiet) { SK.go('zumen', '#tk' + t); return; }
    var z = FR.zumen; if (!z) frame('zumen', '#tk' + t); else { try { z.contentWindow.location.hash = '#tk' + t; } catch (e) { z.src = PAGES.zumen + '#tk' + t; } } show(); }
};
// マスターの 加工図面タブ（使う ときだけ 出す。✕ で 閉じると 隠れる）v0.4.0
function mkTab(nm){ var b = $('mtabs').querySelector('[data-t="mkakou"]');
  if (!b) { b = document.createElement('button'); b.dataset.t = 'mkakou'; b.title = 'マスター部材の 加工図面（保存は 部材マスターへ。お墓の 加工図面とは 別）'; $('mtabs').appendChild(b); }
  if (nm !== undefined || !b.innerHTML) b.innerHTML = '✏ 加工図面' + (nm ? '<span class="sub2">：' + String(nm).replace(/[&<>"]/g, '') + '</span>' : '<span class="sub2"></span>') + '<span class="x" title="マスターの 加工図面を 閉じる">✕</span>';
  if (nm !== undefined) show(); }
function mkClose(){ var f = FR.mkakou;
  if (f && !confirm('マスターの 加工図面を 閉じますか（［💾 マスター部材に 保存］して いない 直しは 消えます）')) return;
  if (f) { f.remove(); delete FR.mkakou; } var b = $('mtabs').querySelector('[data-t="mkakou"]'); if (b) b.remove();
  if (CUR === 'mkakou') { if (FR.sedit) CUR = 'sedit'; else { CUR = 'kumi'; BZ_ON = !!FR.buzai && BZ_FOR === 'kumi' && BZ_ON; } } show(); }
// 部材マスターの 行き先を 変え、部材マスターの 画面にも 知らせる（se＝{ id, name }）
function bzFor(t, se){ var o = t === 'sedit' ? (se || null) : null, ch = BZ_FOR !== t || JSON.stringify(o) !== JSON.stringify(BZ_SE); BZ_FOR = t; BZ_SE = o;
  if (ch && (FR.buzai || o)) whenReady('buzai', function(w){ if (w.bmFor) w.bmFor(BZ_SE); }); }
function tabClick(e){ var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t === 'mkakou' && e.target.closest('.x')) { mkClose(); return; }
  if (b.dataset.t === 'sedit' && e.target.closest('.x')) { try { FR.sedit.contentWindow.seClose(); } catch (er) { SK.setEditClose(); } return; }
  if (b.dataset.t === 'kumi' && CUR === 'kumi' && BZ_ON) { BZ_ON = false; show(); return; }   // 部材マスターから 組み立てへ
  if (b.dataset.t === 'sedit' && CUR === 'sedit' && BZ_ON) { BZ_ON = false; show(); return; }   // 部材マスターから セットを 直す へ
  SK.go(b.dataset.t); }
$('tabs').addEventListener('click', tabClick); $('mtabs').addEventListener('click', tabClick);
// 件名・SharePoint（業務アプリの［📐 図面］から 開いた とき）
var FROM = null; try { FROM = JSON.parse(sessionStorage.getItem('zumenFrom') || 'null'); } catch (e) {}
if (FROM && FROM.title) { $('ken').textContent = '📁 ' + FROM.title; document.title = FROM.title + ' ― 墓石設計'; }
function spOn(){ try { var w = window.opener; return !!(w && !w.closed && w.listItemsInFolderPassFromTekkyo); } catch (e) { return false; } }
function spShow(){ $('sp').classList.toggle('off', !spOn()); $('sp').innerHTML = spOn() ? '☁️ <span class="long">SharePoint と </span>つながって います' : '⚠ SharePoint 未接続：この 端末だけに 保存<span class="long">（業務アプリから 開き直して ください）</span>'; }
spShow(); setInterval(spShow, 10000);
function vers(){ var v = [], g = function(t, n){ try { var w = FR[t] && FR[t].__ok && FR[t].contentWindow; if (w && w.APP_VER) v.push(n + ' ' + w.APP_VER); } catch (e) {} };
  g('kumi', 'モデリング'); g('zumen', '図面'); if (!FR.zumen) g('kakou', '図面'); if (!FR.zumen && !FR.kakou) g('mkakou', '図面'); g('buzai', '部材'); v.push('枠 ' + SHELL_VER); $('ver').textContent = v.join('・'); }
// 最初は 組み立て。#zumen・#kakou・#buzai で その タブから
var h0 = (location.hash || '').replace('#', '');
frame('kumi'); if (h0 === 'zumen' || h0 === 'kakou' || h0 === 'buzai') SK.go(h0); else show();
vers();
</script>
</body></html>
